<script>
RECORD_PAGE_DEFINITIONS.ssids = {
  defaultColumns: [
    'SSID', 'Status', 'Primary Usage', 'Bands / Radio Bands',
    'Security Level', 'Key Management', 'VLAN', 'Password'
  ],
  requiredColumns: ['SSID'],
  addLabel: 'Add SSID',
  columns: {
    'SSID': { minWidth: 150 },
    'Primary Usage': { minWidth: 135 },
    'Bands / Radio Bands': { minWidth: 155 },
    'Security Level': { minWidth: 135 },
    'Key Management': { minWidth: 185 },
    'Authentication Server': { minWidth: 180 },
    'Client IP Assignment': { minWidth: 180 },
    'Client VLAN Assignment': { minWidth: 185 },
    'Availability': { minWidth: 150 },
    'Notes': { minWidth: 150 }
  },
  openEditor: openSsidRecordEditor_,
  buildColumns: function(data) {
    return buildRecordColumns_(data, RECORD_PAGE_DEFINITIONS.ssids);
  },
  header: function(data) {
    setPageHeader(data.label, data.totalCount + ' wireless networks');
  },
  actions: function(data) {
    renderRecordActions_(data);
  }
};

const SSID_FORM_SECTIONS = [
  'General',
  'Security',
  'Network / VLAN',
  'Other'
];

/*
 * This is the single Add/Edit contract for the 15-column SSID inventory.
 * The key is also the Sheet header and serialized payload property, so form
 * rendering cannot silently drift from the data model again.
 */
const SSID_FORM_SCHEMA = [
  { key: 'SSID', label: 'SSID', section: 'General', control: 'text', required: true, defaultValue: '' },
  { key: 'Status', label: 'Status', section: 'General', control: 'select', optionsFrom: 'controlled', defaultValue: 'Enabled' },
  { key: 'Primary Usage', label: 'Primary Usage', section: 'General', control: 'text', suggestionsFrom: 'suggested', defaultValue: '' },
  { key: 'Bands / Radio Bands', label: 'Bands / Radio Bands', section: 'General', control: 'select', optionsFrom: 'suggested', allowBlank: true, defaultValue: '' },
  { key: 'Hidden SSID', label: 'Hidden SSID', section: 'General', control: 'select', optionsFrom: 'controlled', defaultValue: 'No' },
  { key: 'Security Level', label: 'Security Level', section: 'Security', control: 'select', optionsFrom: 'suggested', defaultValue: 'Open', onchange: "updateSsidSecurityFields_('Security Level')" },
  { key: 'Key Management', label: 'Key Management', section: 'Security', control: 'select', optionsFrom: 'suggested', allowBlank: true, defaultValue: '', visibleWhen: 'secured', onchange: "updateSsidSecurityFields_('Key Management')" },
  { key: 'Password', label: 'Password', section: 'Security', control: 'password', defaultValue: '', visibleWhen: 'personal', preserveBlankOnEdit: true },
  { key: 'Authentication Server', label: 'Authentication Server', section: 'Security', control: 'text', defaultValue: '', visibleWhen: 'enterprise', placeholder: 'RADIUS server or service name' },
  { key: 'MAC Authentication', label: 'MAC Authentication', section: 'Security', control: 'select', optionsFrom: 'controlled', defaultValue: 'No' },
  { key: 'Client IP Assignment', label: 'Client IP Assignment', section: 'Network / VLAN', control: 'select', optionsFrom: 'suggested', allowBlank: true, defaultValue: '' },
  { key: 'Client VLAN Assignment', label: 'Client VLAN Assignment', section: 'Network / VLAN', control: 'select', optionsFrom: 'suggested', allowBlank: true, defaultValue: '' },
  { key: 'VLAN', label: 'VLAN', section: 'Network / VLAN', control: 'text', defaultValue: '', placeholder: 'VLAN name or ID' },
  { key: 'Availability', label: 'Availability', section: 'Other', control: 'text', defaultValue: '', placeholder: 'Optional location or scope' },
  { key: 'Notes', label: 'Notes', section: 'Other', control: 'textarea', defaultValue: '' }
];

function renderSsidsPage(data) {
  renderRecordTable_(data, RECORD_PAGE_DEFINITIONS.ssids);
}

function openSsidRecordEditor_(record) {
  record = record || {};
  document.getElementById('recordModalTitle').textContent =
    editingRow ? 'Edit SSID' : 'Add SSID';

  const saveButton = document.getElementById('saveRecordButton');
  saveButton.style.display = '';
  saveButton.onclick = saveRecordFromModal;

  const sections = SSID_FORM_SECTIONS.map(section =>
    ssidFormSection_(section, SSID_FORM_SCHEMA
      .filter(field => field.section === section)
      .map(field => renderSsidFormField_(field, record))
      .join(''))
  ).join('');

  document.getElementById('recordModalBody').innerHTML = `
    <div class="ssid-form">
      <div class="form-required-note">
        <span class="required-marker">*</span> Required
      </div>
      ${sections}
    </div>
  `;

  updateSsidSecurityFields_();
  recordModal.show();
}

function renderSsidFormField_(field, record) {
  const hasValue = Object.prototype.hasOwnProperty.call(record, field.key);
  const value = field.control === 'password'
    ? ''
    : hasValue
      ? record[field.key]
      : field.defaultValue;
  let fieldMarkup = '';

  if (field.control === 'select') {
    fieldMarkup = ssidSelectField_(
      field.key,
      value,
      ssidOptionsForField_(field),
      field
    );
  } else if (field.control === 'textarea') {
    fieldMarkup = ssidTextareaField_(field.key, value, field);
  } else {
    fieldMarkup = ssidTextField_(field.key, value, {
      label: field.label,
      required: field.required,
      suggestions: field.suggestionsFrom ? ssidSuggestions_(field.key) : [],
      placeholder: field.control === 'password'
        ? (editingRow ? 'Leave blank to keep current password' : 'Optional password')
        : field.placeholder,
      type: field.control === 'password' ? 'password' : 'text',
      autocomplete: field.control === 'password' ? 'new-password' : '',
      help: field.control === 'password'
        ? (editingRow
          ? 'Leave blank to keep the saved password, or explicitly clear it below.'
          : 'Used for Personal/PSK or other shared-key networks.')
        : ''
    });
  }

  return field.visibleWhen
    ? `<div data-ssid-security="${escapeAttribute(field.visibleWhen)}" data-ssid-field="${escapeAttribute(field.key)}">${fieldMarkup}</div>`
    : fieldMarkup;
}

function ssidFormSection_(title, content) {
  return `
    <section class="ssid-form-section">
      <h3>${escapeHtml(title)}</h3>
      <div class="ssid-form-grid">${content}</div>
    </section>
  `;
}

function ssidSuggestions_(field) {
  return currentPageData && currentPageData.suggestedOptions
    ? currentPageData.suggestedOptions[field] || []
    : [];
}

function ssidOptionsForField_(field) {
  const source = field.optionsFrom === 'controlled'
    ? currentPageData && currentPageData.controlledOptions
    : currentPageData && currentPageData.suggestedOptions;

  return source && Array.isArray(source[field.key])
    ? source[field.key].slice()
    : [];
}

function ssidTextField_(field, value, options) {
  options = options || {};
  const listId = 'ssidSuggestions_' + field.replace(/[^a-z0-9]+/gi, '_');
  const inputId = 'ssidField_' + field.replace(/[^a-z0-9]+/gi, '_');
  const suggestions = options.suggestions || [];

  if (options.type === 'password') {
    return `
      <div class="ssid-field">
        <label for="${escapeAttribute(inputId)}">${escapeHtml(options.label || field)}</label>
        <div class="ssid-password-input">
          <input
            id="${escapeAttribute(inputId)}"
            class="form-control"
            type="password"
            data-header="${escapeAttribute(field)}"
            value="${escapeAttribute(value || '')}"
            autocomplete="${escapeAttribute(options.autocomplete || 'new-password')}"
            ${options.placeholder ? `placeholder="${escapeAttribute(options.placeholder)}"` : ''}
          >
          <button
            type="button"
            class="credential-icon-button password-eye-button ssid-password-toggle"
            title="Show password"
            aria-label="Show password"
            onclick="toggleSsidPasswordVisibility_(this)"
          ><i class="fa-solid fa-eye"></i></button>
        </div>
        ${options.help ? `<small>${escapeHtml(options.help)}</small>` : ''}
        ${editingRow ? `
          <label class="ssid-password-clear">
            <input type="checkbox" data-clear-credential="Password" onchange="toggleSsidPasswordClear_(this)">
            <span>Clear saved password</span>
          </label>
        ` : ''}
      </div>
    `;
  }

  return `
    <label class="ssid-field">
      <span>${escapeHtml(options.label || field)}${options.required ? ' <span class="required-marker">*</span>' : ''}</span>
      <input
        id="${escapeAttribute(inputId)}"
        class="form-control"
        type="${escapeAttribute(options.type || 'text')}"
        data-header="${escapeAttribute(field)}"
        value="${escapeAttribute(value || '')}"
        ${suggestions.length ? `list="${escapeAttribute(listId)}"` : ''}
        ${options.required ? 'required aria-required="true"' : ''}
        ${options.autocomplete ? `autocomplete="${escapeAttribute(options.autocomplete)}"` : ''}
        ${options.placeholder ? `placeholder="${escapeAttribute(options.placeholder)}"` : ''}
        ${options.oninput ? `oninput="${escapeAttribute(options.oninput)}"` : ''}
      >
      ${suggestions.length ? `
        <datalist id="${escapeAttribute(listId)}">
          ${suggestions.map(item => `<option value="${escapeAttribute(item)}"></option>`).join('')}
        </datalist>
      ` : ''}
      ${options.help ? `<small>${escapeHtml(options.help)}</small>` : ''}
    </label>
  `;
}

function ssidSelectField_(field, value, options, definition) {
  definition = definition || {};
  const selected = String(value || '');
  const normalizedOptions = (options || []).map(option => String(option || ''));
  const optionList = selected && !normalizedOptions.some(option =>
    option.toLowerCase() === selected.toLowerCase())
    ? [selected].concat(normalizedOptions)
    : normalizedOptions;
  if (definition.allowBlank && !optionList.includes('')) {
    optionList.unshift('');
  }
  return `
    <label class="ssid-field">
      <span>${escapeHtml(definition.label || field)}${definition.required ? ' <span class="required-marker">*</span>' : ''}</span>
      <select
        class="form-select"
        data-header="${escapeAttribute(field)}"
        ${definition.required ? 'required aria-required="true"' : ''}
        ${definition.onchange ? `onchange="${escapeAttribute(definition.onchange)}"` : ''}
      >
        ${optionList.map(option => `
          <option value="${escapeAttribute(option)}" ${option === selected ? 'selected' : ''}>
            ${escapeHtml(option || 'Select…')}
          </option>
        `).join('')}
      </select>
    </label>
  `;
}

function ssidTextareaField_(field, value, definition) {
  definition = definition || {};
  return `
    <label class="ssid-field ssid-field-full">
      <span>${escapeHtml(definition.label || field)}</span>
      <textarea class="form-control" rows="3" data-header="${escapeAttribute(field)}">${escapeHtml(value || '')}</textarea>
    </label>
  `;
}

function updateSsidSecurityFields_(changedField) {
  const levelInput = document.querySelector('[data-header="Security Level"]');
  const keyManagementInput = document.querySelector('[data-header="Key Management"]');
  const levelMode = getSsidSecurityMode_(levelInput && levelInput.value, '');

  if (keyManagementInput) {
    refreshSsidKeyManagementOptions_(
      levelMode,
      changedField === 'Security Level'
    );
  }

  const mode = getSsidSecurityMode_(levelInput && levelInput.value,
    keyManagementInput && keyManagementInput.value);

  document.querySelectorAll('[data-ssid-security]').forEach(container => {
    const kind = container.dataset.ssidSecurity;
    const visible = kind === 'secured'
      ? mode !== 'open'
      : kind === 'personal'
        ? mode === 'personal' || mode === 'other'
        : mode === 'enterprise' || mode === 'other';
    container.hidden = !visible;
  });
}

function refreshSsidKeyManagementOptions_(mode, resetIncompatible) {
  const select = document.querySelector('[data-header="Key Management"]');
  const definition = SSID_FORM_SCHEMA.find(field => field.key === 'Key Management');
  if (!select || !definition) return;

  const currentValue = String(select.value || '').trim();
  let options = ssidOptionsForField_(definition);

  if (mode === 'personal' || mode === 'enterprise') {
    options = options.filter(option => {
      const optionMode = getSsidSecurityMode_('', option);
      return option === 'Other' || optionMode === mode;
    });
  } else if (mode === 'open') {
    options = [];
  }

  const currentMode = getSsidSecurityMode_('', currentValue);
  const retainCurrent = !!currentValue && !resetIncompatible &&
    !options.some(option => option.toLowerCase() === currentValue.toLowerCase());
  const compatibleCurrent = !currentValue || mode === 'other' ||
    currentValue === 'Other' || currentMode === mode;
  const nextValue = resetIncompatible && !compatibleCurrent ? '' : currentValue;
  const visibleOptions = retainCurrent ? [currentValue].concat(options) : options;

  select.replaceChildren();
  appendSsidSelectOption_(select, '', 'Select…');
  visibleOptions.forEach(option => appendSsidSelectOption_(select, option, option));
  select.value = nextValue;
}

function appendSsidSelectOption_(select, value, label) {
  const option = document.createElement('option');
  option.value = value;
  option.textContent = label;
  select.appendChild(option);
}

function getSsidSecurityMode_(securityLevel, keyManagement) {
  const level = String(securityLevel || '').trim().toLowerCase();
  const key = String(keyManagement || '').trim().toLowerCase();

  // An explicit Security Level wins when the user changes modes. Key
  // Management then classifies the configurable detailed WPA/PSK value.
  if (level === 'open') {
    return 'open';
  }
  if (/802\.?1x|enterprise|radius|peap|(?:^|[^a-z])eap(?:[^a-z]|$)/i.test(level)) {
    return 'enterprise';
  }
  if (/psk|personal|pre[\s-]*shared|passphrase|wep/i.test(level)) {
    return 'personal';
  }
  if (/802\.?1x|enterprise|radius|peap|(?:^|[^a-z])eap(?:[^a-z]|$)/i.test(key)) {
    return 'enterprise';
  }
  if (/psk|personal|pre[\s-]*shared|passphrase|wep/i.test(key)) {
    return 'personal';
  }
  if (!level && key === 'open') {
    return 'open';
  }
  return 'other';
}

function toggleSsidPasswordVisibility_(button) {
  const wrapper = button && button.closest('.ssid-password-input');
  const input = wrapper && wrapper.querySelector('input[data-header="Password"]');
  if (!input) return;

  const reveal = input.type === 'password';
  input.type = reveal ? 'text' : 'password';
  button.title = reveal ? 'Hide password' : 'Show password';
  button.setAttribute('aria-label', button.title);
  button.innerHTML = reveal
    ? '<i class="fa-solid fa-eye-slash"></i>'
    : '<i class="fa-solid fa-eye"></i>';
}

function toggleSsidPasswordClear_(checkbox) {
  const field = checkbox && checkbox.closest('[data-ssid-field="Password"]');
  const input = field && field.querySelector('input[data-header="Password"]');
  const toggle = field && field.querySelector('.ssid-password-toggle');
  if (!input) return;

  input.value = '';
  input.disabled = !!checkbox.checked;
  if (toggle) toggle.disabled = !!checkbox.checked;
}

</script>
