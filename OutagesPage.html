<script>

const OUTAGE_CIRCUIT_FILTER_STORAGE_KEY =
  'networkDashboard.outageCircuitFilter';


let currentOutageView_ = 'incidents';

function outageViewControls_(data) {
  return [
    ['incidents', 'Confirmed incidents', data.summary.total || 0],
    ['review', 'Needs review', data.summary.reviewCount || 0],
    ['monitoring', 'Monitoring log', data.summary.monitoringCount || 0]
  ].map(([view, label, count]) =>
    `<button type="button" class="btn btn-sm ${view === currentOutageView_ ? 'btn-brand' : 'btn-light border'}"
      data-outage-view="${view}" aria-pressed="${view === currentOutageView_}"
      onclick="setOutageView_('${view}')">${label} <span class="ms-1">${count}</span></button>`).join('');
}

function setOutageView_(view) {
  if (!['incidents', 'review', 'monitoring'].includes(view)) return;
  currentOutageView_ = view;
  document.getElementById('outageViews').innerHTML = outageViewControls_(currentPageData);
  applyOutageFilters();
  if (tableInstance) tableInstance.redraw(true);
}

function outageSummaryMarkup_(summary) {
  return [
    outageSummaryCard('Open Incidents', summary.active, 'fa-triangle-exclamation', 'Open confirmed incidents only.'),
    outageSummaryCard('Started Last 30 Days', summary.last30Days, 'fa-calendar-days', 'Confirmed incidents started in the rolling last 30 days.'),
    outageSummaryCard('30 Day Downtime', summary.durationLast30Label, 'fa-clock', 'Sum of confirmed incident time across circuits. Unreviewed monitoring is excluded.')
  ].join('');
}

function renderOutagesPage(
  data
) {

  data =
    data || {};

  data.summary =
    data.summary || {
      active: 0,
      last30Days: 0,
      durationLast30Label: '0m'
    };

  data.rows =
    data.rows || [];

  data.circuits =
    data.circuits || [];

  currentPageData =
    data;

  const canEdit =
    data.permission === 'edit';

  const canAdminAction =
    appBootstrap &&
    appBootstrap.user &&
    appBootstrap.user.admin;

  const integration =
    data.integration || {};

  const canSyncUptimeRobot =
    !!(
      canAdminAction &&
      integration.enabled &&
      integration.configurationComplete
    );

  const syncTitle =
    integration.enabled
      ? (
          integration.configurationComplete
            ? 'Sync UptimeRobot incidents'
            : 'UptimeRobot is missing required Script Properties'
        )
      : 'UptimeRobot is disabled';

  setPageHeader(
    'Outages',
    appBootstrap?.demoPresentation
      ? 'Downtime log. Link UptimeRobot and map active monitors to supported WAN circuits to sync available incident history; review imported events before confirming outages.'
      : 'Confirmed incident history and monitoring review'
  );

  document.getElementById(
    'pageActions'
  ).innerHTML = `
    ${
      canEdit
        ? `
          <button
            type="button"
            class="btn btn-sm btn-brand"
            onclick="openOutageAddRecord()"
          >
            <i class="fa-solid fa-plus me-2"></i>
            Add Outage
          </button>
        `
        : ''
    }

    ${
      canAdminAction
        ? `
          <button
            type="button"
            class="btn btn-sm btn-light border"
            onclick="syncOutagesFromUptimeRobot(this)"
            title="${escapeAttribute(syncTitle)}"
            ${canSyncUptimeRobot ? '' : 'disabled'}
          >
            <i class="fa-solid fa-cloud-arrow-down me-2"></i>
            Sync UptimeRobot
          </button>
        `
        : ''
    }

    <button type="button" class="btn btn-sm btn-light border" onclick="openOutageHistoryReport_(this)">
      <i class="fa-solid fa-file-lines me-2" aria-hidden="true"></i>History Report
    </button>

    <button
      type="button"
      class="btn btn-sm btn-light border"
      onclick="refreshCurrentPage(this)"
    >
      <i class="fa-solid fa-rotate me-2"></i>
      Refresh
    </button>
  `;

  document.getElementById(
    'pageContent'
  ).innerHTML = `
    <div class="outages-layout">
      <div class="outages-summary">${outageSummaryMarkup_(data.summary)}</div>
      <div id="outageViews" class="d-flex flex-wrap gap-2" role="group" aria-label="Outage views">
        ${outageViewControls_(data)}
      </div>

      ${canAdminAction && data.summary.dataQualityCount
        ? `<div class="alert alert-warning py-2" role="status"><i class="fa-solid fa-triangle-exclamation me-2"></i>${escapeHtml(data.summary.dataQualityCount)} outage record${data.summary.dataQualityCount === 1 ? '' : 's'} need review. Check invalid timestamps, lifecycle status, duration, or duplicate external IDs.</div>`
        : ''}

      <div class="table-toolbar">
        <div class="table-toolbar-left">
          <div class="input-group input-group-sm table-search">
            <span class="input-group-text bg-white">
              <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input
              id="outageSearch"
              type="search"
              class="form-control"
              placeholder="Search outages..." aria-label="Search outages"
              oninput="applyOutageFilters()"
            >
          </div>

          <select
            id="outageCircuitFilter" aria-label="Filter outages by circuit"
            class="form-select form-select-sm outage-filter"
            onchange="applyOutageFilters()"
          >
            <option value="">All circuits</option>
            ${(data.circuits || []).map(circuit => `
              <option value="${escapeAttribute(circuit.circuitId)}">
                ${escapeHtml(formatOutageCircuitOption_(circuit))}
              </option>
            `).join('')}
          </select>

          <select
            id="outageStatusFilter" aria-label="Filter outages by status"
            class="form-select form-select-sm outage-filter"
            onchange="applyOutageFilters()"
          >
            <option value="">All statuses</option>
            ${outageFilterOptions_(['Ongoing', 'Restored'])}
          </select>

          <select
            id="outageSourceFilter" aria-label="Filter outages by source"
            class="form-select form-select-sm outage-filter"
            onchange="applyOutageFilters()"
          >
            <option value="">All sources</option>
            ${outageFilterOptions_(['Manual', 'UptimeRobot'])}
          </select>

          <details class="outage-period-filter">
            <summary class="btn btn-sm btn-light border">Started date range</summary>
            <div class="d-flex flex-wrap gap-2 mt-2">
              <label class="small">Started from <input type="date" class="form-control form-control-sm"
                id="outageDateFrom" onchange="applyOutageFilters()"></label>
              <label class="small">Started through <input type="date" class="form-control form-control-sm"
                id="outageDateTo" onchange="applyOutageFilters()"></label>
            </div>
          </details>

          <div class="dropdown">
            <button
              class="btn btn-sm btn-light border dropdown-toggle"
              data-bs-toggle="dropdown"
            >
              <i class="fa-solid fa-table-columns me-2"></i>
              Columns
            </button>
            <div
              id="outageColumnMenu"
              class="dropdown-menu table-column-menu p-2 shadow"
            ></div>
          </div>

          <button
            class="btn btn-sm btn-light border"
            onclick="clearOutageFilters()"
          >
            <i class="fa-solid fa-filter-circle-xmark me-2"></i>
            Clear
          </button>
        </div>

        <div class="table-toolbar-right">
          <span
            id="outageRecordCount"
            class="record-count"
          >
            ${data.totalCount || 0} records
          </span>
        </div>
      </div>

      <div class="app-card table-card">
        <div id="outagesTable"></div>
      </div>
    </div>
  `;

  buildOutagesTable_(
    data
  );

  applyPendingOutageCircuitFilter_();
}


function outageSummaryCard(
  label,
  value,
  icon,
  helpText
) {

  return `
    <div class="metric-card outage-metric" ${helpText ? `title="${escapeAttribute(helpText)}"` : ''}>
      <div class="metric-icon">
        <i class="fa-solid ${icon}"></i>
      </div>
      <div>
        <div class="metric-label">${escapeHtml(label)}</div>
        <div class="metric-value">${escapeHtml(value || 0)}</div>
      </div>
    </div>
  `;
}


function outageFilterOptions_(
  options
) {

  return (options || [])
    .map(option => `
      <option value="${escapeAttribute(option)}">
        ${escapeHtml(option)}
      </option>
    `)
    .join('');
}


function formatOutageCircuitOption_(
  circuit
) {

  return [
    circuit.circuitName || circuit.circuitId,
    circuit.site || '',
    circuit.provider || ''
  ]
    .filter(Boolean)
    .join(' - ');
}


function buildOutagesTable_(
  data
) {

  if (tableInstance) {
    tableInstance.destroy();
    tableInstance = null;
  }

  const columns =
    getOutageColumns_(
      data
    );

  tableInstance =
    createAppTable_(
      '#outagesTable',
      {
        data:
          data.rows || [],
        layout:
          getNativeTableLayout_(),
        reactiveData:
          false,
        pagination:
          'local',
        paginationSize:
          15,
        movableColumns:
          true,
        placeholder:
          'No outage records found.',
        columns:
          columns,
        rowFormatter:
          function(row) {
            const data =
              row.getData();

            if (data._ongoing) {
              row
                .getElement()
                .classList
                .add(
                  'outage-row-ongoing'
                );
            }
          }
      }
    );

  bindTableColumnPreferenceEvents_(
    tableInstance,
    'outages'
  );

  tableInstance.on(
    'dataFiltered',
    function(filters, rows) {
      const count =
        document.getElementById(
          'outageRecordCount'
        );

      if (count) {
        count.textContent =
          `${rows.length} records`;
      }
    }
  );

  tableInstance.on('tableBuilt', function() {
    buildOutageColumnMenu_(data, columns);
    applyOutageFilters();
  });

  bindColumnMenuRefresh_(
    'outageColumnMenu',
    function() {
      buildOutageColumnMenu_(
        data,
        columns
      );
    }
  );
}


function getOutageColumns_(
  data
) {

  const fields =
    getOutagePreferenceFields_();

  const defaults =
    new Set(
      data.defaultColumns || []
    );

  const preferences =
    reconcileColumnVisibilityPreferences_(
      'outages',
      fields
    );

  const requiredColumns = {
    'Site / Location': true,
    'Circuit Name': true
  };

  const applyVisible =
    column => {
      column.visible =
        isTableColumnVisibleByPreference_(
          column.field,
          defaults,
          preferences,
          requiredColumns
        );

      applyColumnWidthPreference_(
        column,
        preferences
      );

      return column;
    };

  const columns = [
    applyVisible({
      title: 'Site',
      field: 'Site / Location',
      minWidth: 150
    }),
    applyVisible({
      title: 'Circuit',
      field: 'Circuit Name',
      minWidth: 190,
      formatter: function(cell) {
        const row =
          cell.getRow().getData();

        return `
          <div class="outage-circuit-cell">
            <strong>${escapeHtml(row['Circuit Name'] || row['Circuit ID'])}</strong>
            <small>${escapeHtml(row['Circuit ID'])}</small>
          </div>
        `;
      }
    }),
    applyVisible({
      title: 'Provider',
      field: 'Provider',
      minWidth: 140
    }),
    applyVisible({
      title: 'Start Time',
      field: 'Started',
      minWidth: 165,
      formatter: function(cell) {
        return escapeHtml(
          formatOutageDateDisplay_(
            outageMonitoringDisplay_(cell.getRow().getData(), 'Started')
          )
        );
      }
    }),
    applyVisible({
      title: 'End Time',
      field: 'Restored',
      minWidth: 165,
      formatter: function(cell) {
        const row = cell.getRow().getData();
        const value = outageMonitoringDisplay_(row, 'Restored');

        return value
          ? escapeHtml(
              formatOutageDateDisplay_(
                value
              )
            )
          : outageMonitoringDisplay_(row, 'Status') === 'Ongoing'
            ? '<span class="outage-ongoing-text">Ongoing</span>'
            : '<span class="text-muted">Unavailable</span>';
      }
    }),
    applyVisible({
      title: 'Duration',
      field: 'Duration',
      minWidth: 115,
      formatter: function(cell) {
        const row = cell.getRow().getData();
        if (currentOutageView_ === 'monitoring' && row._monitoring) {
          const start = Date.parse(row._monitoring.Started);
          const end = row._monitoring.Status === 'Ongoing' ? Date.now() : Date.parse(row._monitoring.Restored);
          return Number.isFinite(start) && end >= start
            ? escapeHtml(formatOutageDurationClient_(Math.round((end - start) / 60000))) : 'Unknown';
        }
        if (row._ongoing && Number(row._startedMs || 0)) {
          return escapeHtml(
            formatOutageDurationClient_(
              Math.max(0, Math.round((Date.now() - Number(row._startedMs)) / 60000))
            )
          );
        }
        return escapeHtml(cell.getValue() || 'Unknown');
      }
    }),
    applyVisible({
      title: 'Source',
      field: 'Source',
      minWidth: 120,
      formatter: function(cell) {
        return statusPill(
          cell.getValue() || 'Manual', 'outageSource'
        );
      }
    }),
    applyVisible({
      title: 'Reason',
      field: 'Cause / Reason',
      minWidth: 180
    }),
    applyVisible({
      title: 'Status',
      field: 'Status',
      minWidth: 120,
      formatter: function(cell) {
        return statusPill(
          outageMonitoringDisplay_(cell.getRow().getData(), 'Status'), 'outage'
        );
      }
    }),
    applyVisible({
      title: 'Review',
      field: '_reviewState',
      minWidth: 125,
      formatter: cell => {
        const label = cell.getValue() || 'Needs review';
        return `<span class="badge ${label === 'Needs review' ? 'text-bg-warning' : 'text-bg-light border'}">${escapeHtml(label)}</span>`;
      }
    }),
    applyVisible({
      title: 'Monitor ID',
      field: 'UptimeRobot Monitor ID',
      minWidth: 140
    }),
    applyVisible({
      title: 'Notes',
      field: 'Notes',
      minWidth: 220
    }),
    applyVisible({
      title: 'Outage ID',
      field: 'Outage ID',
      minWidth: 115
    }),
    applyVisible({
      title: 'Entered By',
      field: 'Entered By',
      minWidth: 180
    }),
    applyVisible({
      title: 'Created',
      field: 'Created At',
      minWidth: 165,
      formatter: function(cell) {
        return escapeHtml(
          formatOutageDateDisplay_(
            cell.getValue()
          )
        );
      }
    }),
    applyVisible({
      title: 'Updated',
      field: 'Updated At',
      minWidth: 165,
      formatter: function(cell) {
        return escapeHtml(
          formatOutageDateDisplay_(
            cell.getValue()
          )
        );
      }
    }),
    applyVisible({
      title: 'External Event',
      field: 'External Event ID',
      minWidth: 185
    }),
    createOutageActionColumn_(
      data.permission === 'edit'
    )
  ];

  return applyColumnOrderPreference_(
    columns,
    preferences
  );
}


function getOutagePreferenceFields_() {

  return [
    'Site / Location',
    'Circuit Name',
    'Provider',
    'Started',
    'Restored',
    'Duration',
    'Source',
    'Cause / Reason',
    'Status',
    '_reviewState',
    'UptimeRobot Monitor ID',
    'Notes',
    'Outage ID',
    'Entered By',
    'Created At',
    'Updated At',
    'External Event ID'
  ];
}


function createOutageActionColumn_(
  canEdit
) {

  return {
    title: 'Actions',
    field: '_actions',
    width: 92,
    minWidth: 92,
    maxWidth: 92,
    resizable: false,
    movable: false,
    hozAlign: 'center',
    headerHozAlign: 'center',
    headerSort: false,
    download: false,
    formatter: function(cell) {

      const row =
        cell.getRow().getData();

      const wrapper =
        document.createElement(
          'div'
        );

      wrapper.className =
        'table-row-actions';

      if (!canEdit) return wrapper;
      if (row._sourceKey === 'uptimerobot') {
        const review = document.createElement('button');
        review.type = 'button';
        review.className = 'table-row-action table-row-action-review';
        review.title = row._isConfirmed ? 'Edit reviewed incident' : 'Review monitoring event';
        review.setAttribute('aria-label', review.title);
        review.innerHTML = '<i class="fa-solid fa-clipboard-check" aria-hidden="true"></i>';
        review.onclick = event => { event.stopPropagation(); openOutageReview_(row); };
        wrapper.appendChild(review);
        return wrapper;
      }
      if (row._sourceKey !== 'manual') return wrapper;

      const edit =
        document.createElement(
          'button'
        );

      edit.type =
        'button';
      edit.className =
        'table-row-action table-row-action-edit';
      edit.title =
        row._ongoing
          ? 'Close outage'
          : 'Edit outage';
      edit.innerHTML =
        row._ongoing
          ? '<i class="fa-solid fa-check"></i>'
          : '<i class="fa-solid fa-pen"></i>';

      edit.addEventListener(
        'click',
        function(event) {
          event.preventDefault();
          event.stopPropagation();
          openOutageEditRecord(
            row
          );
        }
      );

      wrapper.appendChild(
        edit
      );

      const remove =
        document.createElement(
          'button'
        );

      remove.type =
        'button';
      remove.className =
        'table-row-action table-row-action-delete';
      remove.title =
        'Delete outage';
      remove.innerHTML =
        '<i class="fa-regular fa-trash-can"></i>';

      remove.addEventListener(
        'click',
        function(event) {
          event.preventDefault();
          event.stopPropagation();
          confirmDeleteOutage(
            row,
            remove
          );
        }
      );

      wrapper.appendChild(
        remove
      );

      return wrapper;
    }
  };
}


function normalizeClientKey_(
  value
) {

  return String(value || '')
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '');
}


function buildOutageColumnMenu_(
  data,
  columns
) {

  const menu =
    document.getElementById(
      'outageColumnMenu'
    );

  if (
    !menu ||
    !tableInstance
  ) {
    return;
  }

  menu.innerHTML =
    '';

  const defaults =
    new Set(
      data.defaultColumns || []
    );

  const requiredColumns = {
    'Site / Location': true,
    'Circuit Name': true
  };

  const selectableColumns =
    columns.filter(column =>
      column.field &&
      column.field !== '_actions'
    );

  const controls =
    document.createElement(
      'div'
    );

  controls.className =
    'column-menu-controls';

  const selectAll =
    document.createElement(
      'button'
    );

  selectAll.type =
    'button';
  selectAll.className =
    'btn btn-sm btn-light border';
  selectAll.textContent =
    'Select All';

  const clearAll =
    document.createElement(
      'button'
    );

  clearAll.type =
    'button';
  clearAll.className =
    'btn btn-sm btn-light border';
  clearAll.textContent =
    'Clear All';

  controls.appendChild(
    selectAll
  );
  controls.appendChild(
    clearAll
  );
  menu.appendChild(
    controls
  );

  selectAll.addEventListener(
    'click',
    function(event) {
      event.stopPropagation();
      setAllOutageColumnsVisible_(
        selectableColumns,
        true,
        defaults,
        requiredColumns
      );
      buildOutageColumnMenu_(
        data,
        columns
      );
    }
  );

  clearAll.addEventListener(
    'click',
    function(event) {
      event.stopPropagation();
      setAllOutageColumnsVisible_(
        selectableColumns,
        false,
        defaults,
        requiredColumns
      );
      buildOutageColumnMenu_(
        data,
        columns
      );
    }
  );

  selectableColumns.forEach(columnDefinition => {

    const field =
      columnDefinition.field;

    const column =
      tableInstance.getColumn(
        field
      );

    const wrapper =
      document.createElement(
        'label'
      );

    wrapper.className =
      'dropdown-item d-flex align-items-center gap-2';

    wrapper.addEventListener(
      'click',
      function(event) {
        event.stopPropagation();
      }
    );

    const checkbox =
      document.createElement(
        'input'
      );

    checkbox.type =
      'checkbox';
    checkbox.className =
      'form-check-input m-0';
    checkbox.checked =
      !!(
        column &&
        column.isVisible()
      );
    checkbox.disabled =
      !!requiredColumns[field];

    checkbox.addEventListener(
      'change',
      function(event) {
        event.stopPropagation();

        if (this.checked) {
          tableInstance.showColumn(
            field
          );
        } else {
          tableInstance.hideColumn(
            field
          );
        }

        persistColumnVisibilityPreference_(
          'outages',
          field,
          this.checked,
          defaults
        );
      }
    );

    const label =
      document.createElement(
        'span'
      );

    label.textContent =
      requiredColumns[field]
        ? columnDefinition.title + ' (required)'
        : columnDefinition.title;

    wrapper.appendChild(
      checkbox
    );
    wrapper.appendChild(
      label
    );
    menu.appendChild(
      wrapper
    );

  });
}


function setAllOutageColumnsVisible_(
  columns,
  visible,
  defaults,
  requiredColumns
) {

  const preferences = {
    hidden: [],
    visible: []
  };

  columns.forEach(columnDefinition => {

    const field =
      columnDefinition.field;

    const column =
      tableInstance.getColumn(
        field
      );

    const shouldShow =
      visible ||
      requiredColumns[field];

    if (column) {
      if (shouldShow) {
        tableInstance.showColumn(
          field
        );
      } else {
        tableInstance.hideColumn(
          field
        );
      }
    }

    if (requiredColumns[field]) {
      return;
    }

    const defaultVisible =
      defaults.size === 0 ||
      defaults.has(field);

    if (shouldShow) {
      if (!defaultVisible) {
        preferences.visible.push(
          field
        );
      }
    } else {
      preferences.hidden.push(
        field
      );
    }

  });

  setColumnVisibilityPreferences_(
    'outages',
    preferences
  );
}


function getOutageFilters_() {
  const value = id => document.getElementById(id)?.value || '';
  return {
    search: value('outageSearch').trim().toLowerCase(), circuitId: value('outageCircuitFilter'),
    status: value('outageStatusFilter'), source: value('outageSourceFilter'),
    from: value('outageDateFrom'), to: value('outageDateTo')
  };
}

function outageMonitoringDisplay_(row, field) {
  return currentOutageView_ === 'monitoring' && row._monitoring ? row._monitoring[field] : row[field];
}


function applyOutageFilters() {
  if (!tableInstance) return;
  const filters = getOutageFilters_();
  tableInstance.setFilter(row => {
    if (currentOutageView_ === 'incidents' && !row._isConfirmed) return false;
    if (currentOutageView_ === 'review' && row._reviewState !== 'Needs review') return false;
    if (currentOutageView_ === 'monitoring' && row._sourceKey !== 'uptimerobot') return false;
    const display = currentOutageView_ === 'monitoring' && row._monitoring ? row._monitoring : row;
    if (filters.circuitId && row['Circuit ID'] !== filters.circuitId) return false;
    if (filters.status && display.Status !== filters.status) return false;
    if (filters.source && row.Source !== filters.source) return false;
    if (filters.from || filters.to) {
      const date = formatOutageDateInput_(display.Started).slice(0, 10);
      if (!date || (filters.from && date < filters.from) || (filters.to && date > filters.to)) return false;
    }
    return !filters.search || [
      'Outage ID', 'Circuit ID', 'Circuit Name', 'Site / Location', 'Provider',
      'Source', 'Cause / Reason', 'Notes', 'Status', '_reviewState'
    ].map(field => row[field] || '').join(' ').toLowerCase().includes(filters.search);
  });
}

function clearOutageFilters() {
  ['outageSearch', 'outageCircuitFilter', 'outageStatusFilter', 'outageSourceFilter',
    'outageDateFrom', 'outageDateTo'].forEach(id => {
    const input = document.getElementById(id);
    if (input) input.value = '';
  });
  applyOutageFilters();
}


function applyPendingOutageCircuitFilter_() {

  let circuitId =
    '';

  try {
    circuitId =
      sessionStorage.getItem(
        OUTAGE_CIRCUIT_FILTER_STORAGE_KEY
      ) || '';

    if (circuitId) {
      sessionStorage.removeItem(
        OUTAGE_CIRCUIT_FILTER_STORAGE_KEY
      );
    }
  } catch (error) {
    circuitId =
      '';
  }

  if (!circuitId) {
    return;
  }

  const select =
    document.getElementById(
      'outageCircuitFilter'
    );

  if (!select) {
    return;
  }

  select.value =
    circuitId;

  applyOutageFilters();
}


function requestOutageCircuitFilter(
  circuitId
) {

  try {
    sessionStorage.setItem(
      OUTAGE_CIRCUIT_FILTER_STORAGE_KEY,
      String(circuitId || '')
    );
  } catch (error) {}
}

function openOutageEditRecord(

function toggleOutageReviewFields_() {

function saveOutageFromModal() {

  const form = document.querySelector('#recordModalBody .outage-form');
  const record = { _timezone: form.dataset.outageTimezone, _timeOccurrences: {} };
  form.querySelectorAll('[data-outage-field]').forEach(input => {
    record[input.dataset.outageField] = input.value;
  });
  form.querySelectorAll('[data-outage-occurrence]').forEach(input => {
    if (input.value) record._timeOccurrences[input.dataset.outageOccurrence] = input.value;
  });

  if (editingRow) {
    record._row = editingRow._row;
    record._outageId = editingRow['Outage ID'];
  }
  const review = form.querySelector('[data-outage-review-state]');
  if (review) {
    if (!review.value) { showToast('Choose a review decision.'); return; }
    record.state = review.value;
    record.outageId = editingRow['Outage ID'];
    record.externalId = editingRow['External Event ID'];
    record.reviewedAt = editingRow['Reviewed At'];
    record.linkedId = form.querySelector('[data-outage-link-id]').value;
    if (record.state === 'Linked' && !record.linkedId) { showToast('Choose a manual incident.'); return; }
  }

  const saveButton =
    setActionWorking(
      document.getElementById(
        'saveRecordButton'
      ),
      editingRow
        ? 'Updating...'
        : 'Creating...'
    );

  scriptRunPromise_(
    review ? 'appReviewOutage' : 'appSaveOutage',
    runner => review ? runner.appReviewOutage(record) : runner.appSaveOutage(record)
  )
    .then(function(data) {

      setActionSuccess(
        saveButton,
        'Saved'
      );

      recordModal.hide();

      currentPageData =
        data;

      setClientCache(
        'outages',
        data,
        {
          source: 'outage-save'
        }
      );

      updateOutagesPage_(data);
      showToast(review ? 'Review saved.' : 'Outage saved.');

    })
    .catch(function(error) {
      setActionError(
        saveButton,
        'Save Failed'
      );
      handleFailure(
        error,
        'save outage'
      );
    });
}

function formatOutageDateDisplay_(
  value
) {
  return formatAppDate_(value, true);
}


function formatOutageDurationClient_(minutes) {
  minutes = Math.max(0, Math.round(Number(minutes || 0)));
  const days = Math.floor(minutes / 1440);
  const hours = Math.floor((minutes % 1440) / 60);
  const mins = minutes % 60;
  const parts = [];
  if (days) parts.push(days + 'd');
  if (hours) parts.push(hours + 'h');
  if (mins || !parts.length) parts.push(mins + 'm');
  return parts.join(' ');
}


function formatOutageDateInput_(
  value
) {
  return formatAppDateTimeInput_(value);
}


function refreshOutagesPageSummary_(data) {
  setPageHeader(
    'Outages',
    appBootstrap?.demoPresentation
      ? 'Downtime log. Link UptimeRobot and map active monitors to supported WAN circuits to sync available incident history; review imported events before confirming outages.'
      : 'Confirmed incident history and monitoring review'
  );
  const summary = document.querySelector('.outages-summary');
  if (summary) summary.innerHTML = outageSummaryMarkup_(data.summary);
  const views = document.getElementById('outageViews');
  if (views) views.innerHTML = outageViewControls_(data);
}

async function updateOutagesPage_(data) {
  const table = tableInstance;
  currentPageData = data;

  refreshOutagesPageSummary_(data);
  const select = document.getElementById('outageCircuitFilter');
  if (select) {
    const selected = select.value;
    select.innerHTML = '<option value="">All circuits</option>' + (data.circuits || []).map(circuit =>
      '<option value="' + escapeAttribute(circuit.circuitId) + '">' +
      escapeHtml(formatOutageCircuitOption_(circuit)) + '</option>').join('');
    if (selected && !Array.from(select.options).some(option => option.value === selected)) {
      select.add(new Option(selected, selected));
    }
    select.value = selected;
  }
  await replaceTableRows_(table, data.rows);
  applyOutageFilters();
}

let outageReport_ = null;
let outageReportRequest_ = 0;

function openOutageHistoryReport_() {
  const request = ++outageReportRequest_;
  outageReport_ = null;
  const modal = document.getElementById('outageHistoryModal');
  const feedback = document.getElementById('outageHistoryFeedback');
  const preview = document.getElementById('outageHistoryPreview');
  const download = document.getElementById('outageHistoryDownload');
  const print = document.getElementById('outageHistoryPrint');
  const filters = getOutageFilters_();
  preview.replaceChildren();
  download.disabled = print.disabled = true;
  feedback.textContent = 'Preparing history…';
  bootstrap.Modal.getOrCreateInstance(modal).show();
  scriptRunPromise_('appGetOutageHistory', runner => runner.appGetOutageHistory(filters))
    .then(report => {
      if (request !== outageReportRequest_) return;
      outageReport_ = report;
      feedback.textContent = report.rows.length
        ? report.rows.length + ' confirmed record(s). Date filters use ' + report.timezone + '.'
        : 'No confirmed records match the current filters.';
      if (!report.rows.length) return;
      const previewRows = report.rows.slice(0, 50);
      preview.innerHTML = outageHistoryTable_(report.columns, previewRows) + (report.rows.length > 50
        ? '<p class="small text-muted">Showing the first 50 rows. The download and print include every matching row.</p>' : '');
      download.disabled = print.disabled = false;
    }).catch(error => {
      if (request === outageReportRequest_) feedback.textContent = getSafeErrorMessage_(error);
    });
}

function outageHistoryTable_(columns, rows) {
  return `<table class="table table-sm align-middle"><thead><tr>${columns.map(value =>
    '<th scope="col">' + escapeHtml(value) + '</th>').join('')}</tr></thead><tbody>${rows.map(row =>
      '<tr>' + row.map(value => '<td>' + escapeHtml(value || '') + '</td>').join('') + '</tr>').join('')}</tbody></table>`;
}

function downloadOutageHistory_() {
  const report = outageReport_;
  if (!report?.rows.length) return;
  const cell = value => '"' + String(value ?? '').replace(/"/g, '""') + '"';
  const csv = [report.columns, ...report.rows].map(row => row.map(cell).join(',')).join('\r\n') + '\r\n';
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'network-hq-outage-history.csv';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function printOutageHistory_() {
  const report = outageReport_;
  if (!report?.rows.length) return;
  const paper = document.getElementById('outageHistoryPaper');
  paper.innerHTML = `<h1>Confirmed Incident History</h1>
    <p>Generated: ${escapeHtml(report.generatedAt)}. Date filters: ${escapeHtml(report.timezone)}. Times shown in UTC.</p>
    ${outageHistoryTable_(report.columns, report.rows)}`;
  paper.hidden = false;
  document.body.classList.add('outage-history-print');
  window.addEventListener('afterprint', () => {
    document.body.classList.remove('outage-history-print');
    paper.hidden = true;
    paper.replaceChildren();
  }, { once: true });
  window.print();
}
