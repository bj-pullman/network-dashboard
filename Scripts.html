<script>

/*******************************************************
 * CONFIGURATION
 *******************************************************/


/*
 * Browser session cache policy.
 *
 * Fresh entries render without a server trip. Older entries
 * can still render immediately, then refresh quietly in the
 * background.
 */
const CLIENT_CACHE_FRESH_MS =
  60 * 1000;

const CLIENT_CACHE_TTL_MS =
  5 * 60 * 1000;


const PREFETCH_CONCURRENCY =
  2;


const PREFETCH_PAGE_PRIORITY = [
  'switches',
  'accessPoints',
  'servers',
  'internetWan',
  'outages',
  'routes',
  'securityCameras',
  'busCameras',
  'intercom',
  'backups',
  'uptimeRobot',
  'workflow',
  'users'
];


const ACTION_SUCCESS_RESET_MS =
  1200;


const NEXT_ROUTE_STORAGE_KEY =
  'networkDashboard.nextRoute';


/*******************************************************
 * STATE
 *******************************************************/

let appBootstrap =
  null;


let currentPageKey =
  'dashboard';


let navigationGeneration =
  0;


let clientCacheGeneration =
  0;


let currentPageData =
  null;


let currentTableData =
  null;


let currentStructuredData =
  null;


let currentHeaders =
  [];


let tableInstance =
  null;


let editingRow =
  null;


let recordModal =
  null;


let configModal =
  null;


let appWorkingModal =
  null;


let appWorkingModalRetry =
  null;


const clientPageCache =
  new Map();


const pageRendererPromises =
  new Map();


let prefetchStarted =
  false;


let prefetchQueue =
  [];


let prefetchActiveCount =
  0;


let uptimeRobotStartupRefreshStarted =
  false;


let uptimeRobotHealthRefreshInFlight =
  null;


const structuredTables =
  {};


const PAGE_RENDERER_FUNCTIONS = {
  dashboard: 'renderDashboard',
  table: 'renderTablePage',
  internetWan: 'renderInternetWanPage',
  outages: 'renderOutagesPage',
  uptimeRobot: 'renderUptimeRobotPage',
  structured: 'renderStructuredPage',
  workflow: 'renderWorkflowPage',
  users: 'renderUsersPage',
  settings: 'renderSettingsPage'
};


const loadedPageRendererTypes = {
  dashboard: true
};


const SCRIPT_RUN_TIMEOUT_MS =
  60000;


/*******************************************************
 * STARTUP
 *******************************************************/

window.addEventListener(
  'DOMContentLoaded',
  function() {


    recordModal =
      new bootstrap.Modal(
        document.getElementById(
          'recordModal'
        )
      );


    configModal =
      new bootstrap.Modal(
        document.getElementById(
          'configModal'
        )
      );


    if (window.INITIAL_APP_BOOTSTRAP) {

      try {

        initializeApplication(
          window.INITIAL_APP_BOOTSTRAP
        );

      } catch (error) {

        showBootstrapError(
          error
        );

        handleFailure(
          error,
          'initial bootstrap'
        );

      }

      return;
    }


    getBootstrapPromise_()
      .then(
        initializeApplication
      )
      .catch(function(error) {

        showBootstrapError(
          error
        );

        handleFailure(
          error,
          'bootstrap'
        );

      });

  }
);


/*******************************************************
 * APP INITIALIZATION
 *******************************************************/

function initializeApplication(
  data
) {

  applyBootstrapShell(
    data
  );


  navigateTo(
    getInitialRoute_()
  );
}


function getInitialRoute_() {

  const pages =
    appBootstrap &&
    appBootstrap.pages
      ? appBootstrap.pages
      : [];

  const allowed = {};

  pages.forEach(page => {
    allowed[page.key] = true;
  });

  let storedRoute =
    '';

  try {
    storedRoute =
      sessionStorage.getItem(
        NEXT_ROUTE_STORAGE_KEY
      ) || '';

    if (storedRoute) {
      sessionStorage.removeItem(
        NEXT_ROUTE_STORAGE_KEY
      );
    }
  } catch (error) {
    storedRoute =
      '';
  }

  if (
    storedRoute &&
    allowed[storedRoute]
  ) {
    return storedRoute;
  }

  if (
    allowed[currentPageKey]
  ) {
    return currentPageKey;
  }

  return allowed.dashboard
    ? 'dashboard'
    : (
        pages[0] &&
        pages[0].key
      ) ||
      'dashboard';
}


function requestNextInitialRoute_(
  pageKey
) {

  try {
    sessionStorage.setItem(
      NEXT_ROUTE_STORAGE_KEY,
      pageKey
    );
  } catch (error) {}
}


function applyBootstrapShell(
  data
) {

  data =
    data || {};

  appBootstrap =
    data;


  applyBranding(
    data.config || {}
  );


  const user =
    data.user || {};

  document.getElementById(
    'sidebarUserName'
  ).textContent =
    user.name ||
    user.email ||
    '';


  document.getElementById(
    'sidebarUserRole'
  ).textContent =
    user.admin
      ? (
          user.breakglass
            ? 'Break-glass Administrator'
            : 'Administrator'
        )
      : 'Authorized User';


  const pages =
    data.pages || [];

  if (
    !pages.some(
      page =>
        page.key === currentPageKey
    )
  ) {
    currentPageKey =
      'dashboard';
  }


  buildNavigation(
    pages
  );
}


function applyBranding(
  config
) {

  config =
    config || {};

  const branding =
    config.branding || {};

  const organization =
    config.organization || {};

  const root =
    document.documentElement;

  const primary =
    branding.primaryColor || '#17345f';

  const secondary =
    branding.secondaryColor || '#0d2342';

  const accent =
    branding.accentColor || '#f4c430';

  const headerFont =
    branding.headerFontColor || '#0d2342';


  root.style.setProperty(
    '--brand-primary',
    primary
  );

  root.style.setProperty(
    '--brand-secondary',
    secondary
  );

  root.style.setProperty(
    '--brand-accent',
    accent
  );

  root.style.setProperty(
    '--header-font-color',
    headerFont
  );

  root.style.setProperty(
    '--navy-800',
    primary
  );

  root.style.setProperty(
    '--navy-900',
    secondary
  );

  root.style.setProperty(
    '--gold',
    accent
  );


  document.title =
    config.appName ||
    'Network Dashboard';


  const brandTitle =
    document.getElementById(
      'brandTitle'
    );

  if (brandTitle) {
    brandTitle.textContent =
      (
        organization.shortName ||
        config.appName ||
        'Network Dashboard'
      ).toUpperCase();
  }


  const brandSubtitle =
    document.getElementById(
      'brandSubtitle'
    );

  if (brandSubtitle) {
    brandSubtitle.textContent =
      'INFRASTRUCTURE';
  }


  const eyebrow =
    document.getElementById(
      'pageEyebrow'
    );

  if (eyebrow) {
    eyebrow.textContent =
      (
        organization.name ||
        config.appName ||
        'Network Dashboard'
      ).toUpperCase();
  }


  const logo =
    document.getElementById(
      'brandLogo'
    );

  const fallback =
    document.getElementById(
      'brandLogoFallback'
    );

  if (
    logo &&
    fallback
  ) {

    if (branding.logoUrl) {
      logo.src = branding.logoUrl;
      logo.hidden = false;
      fallback.hidden = true;
    } else {
      logo.hidden = true;
      fallback.hidden = false;
    }

  }

  applyFavicon_(
    branding.faviconUrl
  );
}


function applyFavicon_(
  faviconUrl
) {

  const url =
    String(
      faviconUrl || ''
    ).trim();

  let link =
    document.getElementById(
      'appFavicon'
    );

  if (!url) {
    if (link) {
      link.removeAttribute(
        'href'
      );
    }
    return;
  }

  if (
    !/^https?:\/\//i.test(
      url
    )
  ) {
    return;
  }

  if (!link) {
    link =
      document.createElement(
        'link'
      );
    link.id =
      'appFavicon';
    link.rel =
      'icon';
    document.head.appendChild(
      link
    );
  }

  link.href =
    url;
}


/*******************************************************
 * NAVIGATION
 *******************************************************/

function buildNavigation(
  pages
) {

  const container =
    document.getElementById(
      'navigation'
    );


  const groups =
    {};


  pages.forEach(
    page => {

      if (!groups[page.group]) {
        groups[page.group] = [];
      }


      groups[
        page.group
      ].push(page);

    }
  );


  container.innerHTML =
    '';


  Object.entries(groups)
    .forEach(
      ([group, groupPages]) => {

        const section =
          document.createElement(
            'div'
          );


        section.className =
          'nav-group';


        const title =
          document.createElement(
            'div'
          );


        title.className =
          'nav-group-title';


        title.textContent =
          group.toUpperCase();


        section.appendChild(
          title
        );


        groupPages.forEach(
          page => {

            const button =
              document.createElement(
                'button'
              );


            button.className =
              'app-nav-item' +
              (
                page.key === currentPageKey
                  ? ' active'
                  : ''
              );


            button.dataset.page =
              page.key;


            const icon =
              document.createElement(
                'i'
              );


            icon.className =
              'fa-solid ' +
              page.icon;


            const label =
              document.createElement(
                'span'
              );


            label.textContent =
              page.label;


            button.appendChild(
              icon
            );


            button.appendChild(
              label
            );


            button.addEventListener(
              'click',
              function() {

                navigateTo(
                  page.key
                );

              }
            );


            section.appendChild(
              button
            );

          }
        );


        container.appendChild(
          section
        );

      }
    );
}


function navigateTo(
  pageKey
) {

  if (
    !appBootstrap ||
    !appBootstrap.pages.some(
      page =>
        page.key === pageKey
    )
  ) {
    return;
  }


  currentPageKey =
    pageKey;

  const generation =
    nextNavigationGeneration_();


  prioritizePrefetchForNavigation_(
    pageKey
  );


  document
    .querySelectorAll(
      '.app-nav-item'
    )
    .forEach(
      button => {

        button.classList.toggle(
          'active',
          button.dataset.page === pageKey
        );

      }
    );


  loadPage(
    pageKey,
    false,
    {
      generation: generation,
      reason: 'navigation'
    }
  );
}


/*******************************************************
 * CLIENT CACHE
 *******************************************************/

function getClientCache(
  pageKey
) {

  const entry =
    getClientCacheEntry_(
      pageKey
    );


  return entry && entry.data
    ? entry.data
    : null;
}


function getClientCacheEntry_(
  pageKey
) {

  const entry =
    clientPageCache.get(
      pageKey
    );

  if (
    !entry
  ) {
    return null;
  }

  if (
    entry.loadedAt &&
    Date.now() -
    entry.loadedAt >
    CLIENT_CACHE_TTL_MS
  ) {

    clientPageCache.delete(
      pageKey
    );

    return null;

  }


  return entry;
}


function getOrCreateClientCacheEntry_(
  pageKey
) {

  let entry =
    clientPageCache.get(
      pageKey
    );

  if (!entry) {

    entry = {
      pageKey: pageKey,
      status: 'idle',
      data: null,
      loadedAt: 0,
      timestamp: 0,
      inFlight: null,
      error: null,
      metadata: {}
    };

    clientPageCache.set(
      pageKey,
      entry
    );

  }

  return entry;
}


function isClientCacheFresh_(
  entry
) {

  return !!(
    entry &&
    entry.data &&
    entry.loadedAt &&
    Date.now() -
      entry.loadedAt <=
      CLIENT_CACHE_FRESH_MS
  );
}


function isClientCacheStale_(
  entry
) {

  return !!(
    entry &&
    entry.data &&
    !isClientCacheFresh_(
      entry
    )
  );
}


function setClientCache(
  pageKey,
  data,
  metadata
) {

  const now =
    Date.now();

  const entry =
    getOrCreateClientCacheEntry_(
      pageKey
    );

  entry.status =
    'loaded';

  entry.timestamp =
    now;

  entry.loadedAt =
    now;

  entry.data =
    data;

  entry.error =
    null;

  entry.inFlight =
    null;

  entry.metadata =
    Object.assign(
      {},
      entry.metadata || {},
      metadata || {}
    );

  clientPageCache.set(
    pageKey,
    entry
  );
}


function setClientPageInFlight_(
  pageKey,
  promise,
  metadata
) {

  const entry =
    getOrCreateClientCacheEntry_(
      pageKey
    );

  entry.status =
    'loading';

  entry.inFlight =
    promise;

  entry.error =
    null;

  entry.metadata =
    Object.assign(
      {},
      entry.metadata || {},
      metadata || {}
    );

  clientPageCache.set(
    pageKey,
    entry
  );
}


function clearClientPageInFlight_(
  pageKey,
  promise
) {

  const entry =
    clientPageCache.get(
      pageKey
    );

  if (
    entry &&
    entry.inFlight === promise
  ) {

    entry.inFlight =
      null;

    if (
      entry.status === 'loading'
    ) {
      entry.status =
        entry.data
          ? 'loaded'
          : 'idle';
    }

  }
}


function setClientPageError_(
  pageKey,
  error,
  metadata
) {

  const entry =
    getOrCreateClientCacheEntry_(
      pageKey
    );

  entry.status =
    entry.data
      ? 'loaded'
      : 'error';

  entry.error =
    error;

  entry.inFlight =
    null;

  entry.metadata =
    Object.assign(
      {},
      entry.metadata || {},
      metadata || {}
    );
}


function invalidateClientPage(
  pageKey
) {

  clientPageCache.delete(
    pageKey
  );


  if (
    pageKey !== 'dashboard'
  ) {

    clientPageCache.delete(
      'dashboard'
    );

  }
}


function clearClientPageCache_() {

  clientCacheGeneration +=
    1;

  clientPageCache.clear();

  prefetchStarted =
    false;

  prefetchQueue =
    [];

  prefetchActiveCount =
    0;

  uptimeRobotStartupRefreshStarted =
    false;
}


function markClientPageWritten(
  pageKey,
  data
) {

  setClientCache(
    pageKey,
    data,
    {
      source: 'write'
    }
  );

  if (
    pageKey !== 'dashboard'
  ) {
    invalidateClientPage(
      'dashboard'
    );
  }
}


function logCacheEvent_(
  pageKey,
  message
) {

  const page =
    getBootstrapPage_(
      pageKey
    );

  console.log(
    '[Cache] ' +
    (
      page && page.label
        ? page.label
        : pageKey
    ) +
    ': ' +
    message
  );
}


function closeRowActionMenu() {

  const menu =
    document.getElementById(
      'rowActionMenu'
    );


  if (menu) {
    menu.remove();
  }
}


/*******************************************************
 * ACTION STATE
 *******************************************************/

function setActionWorking(
  button,
  label
) {

  button =
    resolveActionButton_(
      button
    );

  if (!button) {
    return null;
  }

  captureActionState_(
    button
  );

  button.disabled =
    true;

  button.setAttribute(
    'aria-busy',
    'true'
  );

  button.innerHTML =
    '<i class="fa-solid fa-circle-notch fa-spin me-2 action-state-icon"></i>' +
    escapeHtml(
      label || 'Working...'
    );

  return button;
}


function setActionSuccess(
  button,
  label
) {

  button =
    resolveActionButton_(
      button
    );

  if (!button) {
    return null;
  }

  captureActionState_(
    button
  );

  button.disabled =
    true;

  button.removeAttribute(
    'aria-busy'
  );

  button.innerHTML =
    '<i class="fa-solid fa-check me-2 action-state-icon"></i>' +
    escapeHtml(
      label || 'Done'
    );

  scheduleActionRestore_(
    button
  );

  return button;
}


function setActionError(
  button,
  label
) {

  button =
    resolveActionButton_(
      button
    );

  if (!button) {
    return null;
  }

  captureActionState_(
    button
  );

  button.disabled =
    false;

  button.removeAttribute(
    'aria-busy'
  );

  button.innerHTML =
    '<i class="fa-solid fa-triangle-exclamation me-2 action-state-icon"></i>' +
    escapeHtml(
      label || 'Failed'
    );

  scheduleActionRestore_(
    button
  );

  return button;
}


function restoreAction(
  button
) {

  button =
    resolveActionButton_(
      button
    );

  if (
    !button ||
    !button._networkDashboardActionState
  ) {
    return;
  }

  const state =
    button._networkDashboardActionState;

  if (state.restoreTimer) {
    clearTimeout(
      state.restoreTimer
    );
  }

  button.innerHTML =
    state.html;

  button.disabled =
    state.disabled;

  button.style.minWidth =
    state.minWidth;

  button.removeAttribute(
    'aria-busy'
  );

  delete button._networkDashboardActionState;
}


function resolveActionButton_(
  button
) {

  if (button) {
    return button;
  }

  const active =
    document.activeElement;

  return active &&
    active.tagName === 'BUTTON'
    ? active
    : null;
}


function captureActionState_(
  button
) {

  if (
    button._networkDashboardActionState
  ) {
    if (
      button._networkDashboardActionState.restoreTimer
    ) {
      clearTimeout(
        button._networkDashboardActionState.restoreTimer
      );
      button._networkDashboardActionState.restoreTimer =
        null;
    }
    return;
  }

  const width =
    button.offsetWidth || 0;

  button._networkDashboardActionState = {
    html:
      button.innerHTML,
    disabled:
      button.disabled,
    minWidth:
      button.style.minWidth || '',
    restoreTimer:
      null
  };

  if (width) {
    button.style.minWidth =
      width + 'px';
  }
}


function scheduleActionRestore_(
  button
) {

  if (
    !button ||
    !button._networkDashboardActionState
  ) {
    return;
  }

  button._networkDashboardActionState.restoreTimer =
    setTimeout(
      function() {
        restoreAction(
          button
        );
      },
      ACTION_SUCCESS_RESET_MS
    );
}


/*******************************************************
 * APPLICATION WORKING MODAL
 *******************************************************/

function showAppWorkingModal(
  options
) {

  options =
    options || {};

  hideAppWorkingModal();

  const overlay =
    document.createElement(
      'div'
    );

  overlay.id =
    'appWorkingModal';

  overlay.className =
    'app-working-modal-backdrop';

  overlay.innerHTML = `
    <div
      class="app-working-modal"
      role="status"
      aria-live="polite"
      aria-modal="true"
    >
      <div class="app-working-modal-icon">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
      </div>
      <div class="app-working-modal-title">
        ${escapeHtml(options.title || 'Working...')}
      </div>
      <div class="app-working-modal-message">
        ${escapeHtml(options.message || '')}
      </div>
      <div
        class="app-working-modal-error"
        hidden
      ></div>
      <div
        class="app-working-modal-actions"
        hidden
      >
        <button
          type="button"
          class="btn btn-sm btn-light border"
          data-working-modal-close
        >
          Close
        </button>
        <button
          type="button"
          class="btn btn-sm btn-brand"
          data-working-modal-retry
          hidden
        >
          Try Again
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(
    overlay
  );

  const close =
    overlay.querySelector(
      '[data-working-modal-close]'
    );

  if (close) {
    close.addEventListener(
      'click',
      hideAppWorkingModal
    );
  }

  const retry =
    overlay.querySelector(
      '[data-working-modal-retry]'
    );

  if (retry) {
    retry.addEventListener(
      'click',
      function() {
        if (typeof appWorkingModalRetry === 'function') {
          appWorkingModalRetry();
        }
      }
    );
  }

  appWorkingModal =
    overlay;

  document.body.classList.add(
    'app-working-modal-open'
  );

  return overlay;
}


function updateAppWorkingModal(
  options
) {

  options =
    options || {};

  const overlay =
    appWorkingModal ||
    document.getElementById(
      'appWorkingModal'
    );

  if (!overlay) {
    return null;
  }

  const icon =
    overlay.querySelector(
      '.app-working-modal-icon'
    );

  const title =
    overlay.querySelector(
      '.app-working-modal-title'
    );

  const message =
    overlay.querySelector(
      '.app-working-modal-message'
    );

  const error =
    overlay.querySelector(
      '.app-working-modal-error'
    );

  const actions =
    overlay.querySelector(
      '.app-working-modal-actions'
    );

  const retry =
    overlay.querySelector(
      '[data-working-modal-retry]'
    );

  if (icon) {
    icon.innerHTML =
      options.state === 'success'
        ? '<i class="fa-solid fa-check"></i>'
        : options.state === 'error'
          ? '<i class="fa-solid fa-triangle-exclamation"></i>'
          : '<i class="fa-solid fa-circle-notch fa-spin"></i>';

    icon.classList.toggle(
      'is-success',
      options.state === 'success'
    );

    icon.classList.toggle(
      'is-error',
      options.state === 'error'
    );
  }

  if (
    title &&
    options.title !== undefined
  ) {
    title.textContent =
      options.title;
  }

  if (
    message &&
    options.message !== undefined
  ) {
    message.textContent =
      options.message;
  }

  if (error) {
    const errorMessage =
      options.error
        ? getSafeErrorMessage_(
            options.error
          )
        : '';

    error.textContent =
      errorMessage;

    error.hidden =
      !errorMessage;
  }

  if (actions) {
    actions.hidden =
      options.state !== 'error';
  }

  appWorkingModalRetry =
    typeof options.retry === 'function'
      ? options.retry
      : null;

  if (retry) {
    retry.hidden =
      options.state !== 'error' ||
      !appWorkingModalRetry;
  }

  return overlay;
}


function hideAppWorkingModal() {

  const overlay =
    appWorkingModal ||
    document.getElementById(
      'appWorkingModal'
    );

  if (overlay) {
    overlay.remove();
  }

  appWorkingModal =
    null;

  appWorkingModalRetry =
    null;

  document.body.classList.remove(
    'app-working-modal-open'
  );
}


/*******************************************************
 * PAGE LOADING
 *******************************************************/

function nextNavigationGeneration_() {

  navigationGeneration += 1;

  return navigationGeneration;
}


function getBootstrapPage_(
  pageKey
) {

  return appBootstrap &&
    appBootstrap.pages
      ? appBootstrap.pages.find(
          item =>
            item.key === pageKey
        )
      : null;
}


function isActivePageRequest_(
  pageKey,
  generation
) {

  return currentPageKey === pageKey &&
    generation === navigationGeneration;
}


function loadPage(
  pageKey,
  forceRefresh,
  options
) {

  options =
    options || {};

  closeRowActionMenu();


  const page =
    getBootstrapPage_(
      pageKey
    );


  if (!page) {
    return;
  }

  if (
    currentPageKey !== pageKey
  ) {
    console.log(
      '[Navigation] inactive load ignored for ' +
      pageKey
    );
    return;
  }

  const generation =
    options.generation ||
    nextNavigationGeneration_();

  const requestReason =
    options.reason ||
    (
      forceRefresh
        ? 'refresh'
        : 'navigation'
    );

  const actionButton =
    options.actionButton || null;

  const cacheEntry =
    forceRefresh ||
    !shouldClientCachePage_(
      pageKey
    )
      ? null
      : getClientCacheEntry_(
          pageKey
        );

  if (
    cacheEntry &&
    cacheEntry.data
  ) {

    const cacheState =
      isClientCacheFresh_(cacheEntry)
        ? 'hit'
        : 'stale';

    logCacheEvent_(
      pageKey,
      cacheState
    );

    const renderStart =
      nowClient_();

    Promise
      .resolve()
      .then(() =>
        ensurePageRendererPromise_(
          pageKey,
          page
        )
      )
      .then(() => {

        if (
          !isActivePageRequest_(
            pageKey,
            generation
          )
        ) {
          console.log(
            '[Navigation] stale cached render ignored for ' +
            pageKey
          );
          return;
        }

        currentPageData =
          cacheEntry.data;

        renderPage(
          pageKey,
          cacheEntry.data
        );

        logClientPerformance_(
          pageKey,
          'cache=' +
            cacheState +
            ' render=' +
            Math.round(
              nowClient_() - renderStart
            ) +
            'ms'
        );

        scheduleOperationalPrefetch_();

        scheduleUptimeRobotStartupRefresh_();

        if (
          isClientCacheStale_(
            cacheEntry
          )
        ) {
          refreshPageQuietly_(
            pageKey,
            generation,
            requestReason
          );
        }

      })
      .catch(error => {

        if (
          isActivePageRequest_(
            pageKey,
            generation
          )
        ) {
          showPageError(
            pageKey,
            error
          );

          handleFailure(
            error,
            'cached page render: ' + pageKey
          );
        } else {
          console.warn(
            '[Navigation] stale cached render failed for ' +
            pageKey,
            error
          );
        }

      });

    return;

  }


  showPageLoading();

  logCacheEvent_(
    pageKey,
    forceRefresh
      ? 'refresh'
      : 'miss'
  );

  const requestStart =
    nowClient_();

  requestPageData_(
    pageKey,
    !!forceRefresh,
    {
      mode: 'foreground',
      reason: requestReason
    }
  )
    .then(data => {

      if (
        !isActivePageRequest_(
          pageKey,
          generation
        )
      ) {
        console.log(
          '[Navigation] stale response ignored for ' +
          pageKey
        );
        return;
      }

      currentPageData =
        data;

      const renderStart =
        nowClient_();

      renderPage(
        pageKey,
        data
      );

      logClientPerformance_(
        pageKey,
        'cache=miss roundTrip=' +
          Math.round(
            renderStart - requestStart
          ) +
          'ms render=' +
          Math.round(
            nowClient_() - renderStart
          ) +
          'ms'
      );

      scheduleOperationalPrefetch_();

      scheduleUptimeRobotStartupRefresh_();

      if (actionButton) {
        setActionSuccess(
          actionButton,
          'Refreshed'
        );
      }

    })
    .catch(error => {

      if (
        isActivePageRequest_(
          pageKey,
          generation
        )
      ) {
        showPageError(
          pageKey,
          error
        );

        handleFailure(
          error,
          'page load: ' + pageKey
        );
      } else {
        console.warn(
          '[Navigation] stale request failed for ' +
          pageKey,
          error
        );
      }

      if (actionButton) {
        setActionError(
          actionButton,
          'Refresh Failed'
        );
      }

    });
}


function refreshPageQuietly_(
  pageKey,
  generation,
  reason
) {

  console.log(
    '[Cache] ' +
    pageKey +
    ': stale-while-revalidate'
  );

  const requestStart =
    nowClient_();

  requestPageData_(
    pageKey,
    true,
    {
      mode: 'quiet-refresh',
      reason: reason || 'stale'
    }
  )
    .then(data => {

      if (
        !isActivePageRequest_(
          pageKey,
          generation
        )
      ) {
        console.log(
          '[Navigation] quiet refresh cached stale page ' +
          pageKey
        );
        return;
      }

      currentPageData =
        data;

      const renderStart =
        nowClient_();

      renderPage(
        pageKey,
        data
      );

      logClientPerformance_(
        pageKey,
        'cache=stale roundTrip=' +
          Math.round(
            renderStart - requestStart
          ) +
          'ms render=' +
          Math.round(
            nowClient_() - renderStart
          ) +
          'ms'
      );

    })
    .catch(error => {
      console.warn(
        '[Cache] quiet refresh failed for ' +
        pageKey,
        error
      );
    });
}


function shouldClientCachePage_(
  pageKey
) {

  return !!pageKey;
}


function scheduleOperationalPrefetch_() {

  if (
    prefetchStarted ||
    !appBootstrap ||
    !appBootstrap.pages
  ) {
    return;
  }

  setTimeout(
    startOperationalPrefetch_,
    250
  );
}


function scheduleUptimeRobotStartupRefresh_() {

  if (
    uptimeRobotStartupRefreshStarted ||
    !appBootstrap ||
    !appBootstrap.startupTasks
  ) {
    return;
  }

  const task =
    appBootstrap.startupTasks
      .uptimeRobotHealthRefresh;

  if (
    !task ||
    !task.enabled
  ) {
    return;
  }

  uptimeRobotStartupRefreshStarted =
    true;

  setTimeout(
    function() {
      runUptimeRobotHealthRefresh_({
        reason: 'startup',
        silent: true
      })
        .catch(function(error) {
          console.warn(
            '[UptimeRobot] startup health refresh failed',
            error
          );
        });
    },
    600
  );
}


function runUptimeRobotHealthRefresh_(
  options
) {

  options =
    options || {};

  if (uptimeRobotHealthRefreshInFlight) {
    console.log(
      '[UptimeRobot] reusing in-flight health refresh'
    );
    return uptimeRobotHealthRefreshInFlight;
  }

  const requestStart =
    nowClient_();

  uptimeRobotHealthRefreshInFlight =
    scriptRunPromise_(
      'appRefreshInternetWanHealth:' +
        (options.reason || 'manual'),
      runner =>
        runner.appRefreshInternetWanHealth()
    )
      .then(function(monitoring) {

        logClientPerformance_(
          'uptimeRobot',
          'health-refresh reason=' +
            (options.reason || 'manual') +
            ' roundTrip=' +
            Math.round(
              nowClient_() - requestStart
            ) +
            'ms'
        );

        applyUptimeRobotHealthRefreshResult_(
          monitoring,
          options
        );

        return monitoring;

      })
      .catch(function(error) {

        if (!options.silent) {
          handleFailure(
            error,
            'sync WAN health'
          );
        }

        throw error;

      })
      .finally(function() {
        uptimeRobotHealthRefreshInFlight =
          null;
      });

  return uptimeRobotHealthRefreshInFlight;
}


function applyUptimeRobotHealthRefreshResult_(
  monitoring,
  options
) {

  options =
    options || {};

  const isStartupRefresh =
    options.reason === 'startup';

  if (
    currentPageKey === 'internetWan' &&
    !isStartupRefresh &&
    currentPageData &&
    typeof applyInternetWanHealthToData_ === 'function' &&
    typeof renderInternetWanPage === 'function'
  ) {
    applyInternetWanHealthToData_(
      currentPageData,
      monitoring
    );

    markClientPageWritten(
      'internetWan',
      currentPageData
    );

    renderInternetWanPage(
      currentPageData
    );
  } else {
    invalidateClientPage(
      'internetWan'
    );
  }

  if (
    currentPageKey === 'uptimeRobot' &&
    !isStartupRefresh
  ) {
    loadPage(
      'uptimeRobot',
      true,
      {
        reason:
          options.reason || 'uptimerobot-health-refresh'
      }
    );
  } else {
    invalidateClientPage(
      'uptimeRobot'
    );
  }

  if (
    currentPageKey === 'dashboard' &&
    isStartupRefresh &&
    typeof refreshDashboardUptimeRobotWidgets_ === 'function'
  ) {
    refreshDashboardUptimeRobotWidgets_(
      monitoring
    );
    invalidateClientPage(
      'dashboard'
    );
    return;
  }

  if (
    currentPageKey === 'dashboard' &&
    !isStartupRefresh
  ) {
    loadPage(
      'dashboard',
      true,
      {
        reason:
          options.reason || 'uptimerobot-health-refresh'
      }
    );
  } else {
    invalidateClientPage(
      'dashboard'
    );
  }
}


function startOperationalPrefetch_() {

  if (
    prefetchStarted ||
    !appBootstrap ||
    !appBootstrap.pages
  ) {
    return;
  }

  prefetchStarted =
    true;

  prefetchQueue =
    buildPrefetchQueue_();

  if (!prefetchQueue.length) {
    return;
  }

  console.log(
    '[Prefetch] queued ' +
    prefetchQueue.length +
    ' page(s)'
  );

  drainPrefetchQueue_();
}


function buildPrefetchQueue_() {

  const pages =
    appBootstrap.pages || [];

  const keyed = {};

  pages.forEach(page => {
    keyed[page.key] = page;
  });

  const queue = [];

  PREFETCH_PAGE_PRIORITY
    .forEach(pageKey => {

      const page =
        keyed[pageKey];

      if (
        shouldPrefetchPage_(page) &&
        !queue.includes(pageKey)
      ) {
        queue.push(pageKey);
      }

    });

  pages.forEach(page => {

    if (
      shouldPrefetchPage_(page) &&
      !queue.includes(page.key)
    ) {
      queue.push(page.key);
    }

  });

  return queue.filter(pageKey => {

    const entry =
      getClientCacheEntry_(
        pageKey
      );

    return !(
      entry &&
      (
        entry.data ||
        entry.inFlight
      )
    );

  });
}


function shouldPrefetchPage_(
  page
) {

  if (
    !page ||
    page.key === 'dashboard' ||
    page.key === 'settings'
  ) {
    return false;
  }

  return page.type === 'table' ||
    page.type === 'internetWan' ||
    page.type === 'uptimeRobot' ||
    page.type === 'structured' ||
    page.type === 'workflow' ||
    page.type === 'users';
}


function prioritizePrefetchForNavigation_(
  pageKey
) {

  const index =
    prefetchQueue.indexOf(
      pageKey
    );

  if (index >= 0) {
    prefetchQueue.splice(
      index,
      1
    );

    console.log(
      '[Prefetch] foreground navigation claimed ' +
      pageKey
    );
  }
}


function drainPrefetchQueue_() {

  while (
    prefetchActiveCount <
      PREFETCH_CONCURRENCY &&
    prefetchQueue.length
  ) {

    const pageKey =
      prefetchQueue.shift();

    const page =
      getBootstrapPage_(
        pageKey
      );

    if (
      !shouldPrefetchPage_(page)
    ) {
      continue;
    }

    const entry =
      getClientCacheEntry_(
        pageKey
      );

    if (
      entry &&
      (
        entry.data ||
        entry.inFlight
      )
    ) {
      continue;
    }

    prefetchActiveCount += 1;

    console.log(
      '[Prefetch] starting ' +
      page.label
    );

    requestPageData_(
      pageKey,
      false,
      {
        mode: 'prefetch',
        reason: 'startup-prefetch'
      }
    )
      .then(() => {
        console.log(
          '[Prefetch] cached ' +
          page.label
        );
      })
      .catch(error => {
        console.warn(
          '[Prefetch] failed ' +
          page.label,
          error
        );
      })
      .then(() => {

        prefetchActiveCount =
          Math.max(
            0,
            prefetchActiveCount - 1
          );

        drainPrefetchQueue_();

      });

  }
}


function nowClient_() {

  return window.performance &&
    typeof window.performance.now === 'function'
    ? window.performance.now()
    : Date.now();
}


function runAfterNextPaint_(
  callback
) {

  const run =
    typeof callback === 'function'
      ? callback
      : function() {};

  if (
    typeof window !== 'undefined' &&
    typeof window.requestAnimationFrame === 'function'
  ) {

    window.requestAnimationFrame(function() {
      window.requestAnimationFrame(run);
    });

    return;

  }

  setTimeout(
    run,
    0
  );
}


function logClientPerformance_(
  pageKey,
  message
) {

  const page =
    getBootstrapPage_(
      pageKey
    );

  console.log(
    '[Performance] ' +
    (
      page && page.label
        ? page.label
        : pageKey
    ) +
    ' ' +
    message
  );
}


function getBootstrapPromise_() {

  return scriptRunPromise_(
    'getAppBootstrap',
    runner =>
      runner.getAppBootstrap()
  );
}


function getPageDataPromise_(
  pageKey,
  forceRefresh
) {

  return scriptRunPromise_(
    'appGetPageData:' + pageKey,
    runner =>
      runner.appGetPageData(
        pageKey,
        !!forceRefresh
      )
  );
}


function requestPageData_(
  pageKey,
  forceRefresh,
  metadata
) {

  metadata =
    metadata || {};

  const page =
    getBootstrapPage_(
      pageKey
    );

  if (!page) {
    return Promise.reject(
      new Error(
        'Unknown application page.'
      )
    );
  }

  const entry =
    getClientCacheEntry_(
      pageKey
    );

  if (
    entry &&
    entry.inFlight &&
    (
      !forceRefresh ||
      metadata.mode === 'quiet-refresh' ||
      metadata.mode === 'prefetch'
    )
  ) {

    logCacheEvent_(
      pageKey,
      'reusing in-flight request'
    );

    return entry.inFlight;
  }

  const requestStart =
    nowClient_();

  const cacheGeneration =
    clientCacheGeneration;

  const promise =
    Promise
      .all([
        ensurePageRendererPromise_(
          pageKey,
          page
        ),
        getPageDataPromise_(
          pageKey,
          !!forceRefresh
        )
      ])
      .then(results => {

        const data =
          results[1];

        if (
          cacheGeneration ===
            clientCacheGeneration &&
          shouldClientCachePage_(
            pageKey
          )
        ) {
          setClientCache(
            pageKey,
            data,
            metadata
          );
        }

        if (
          metadata.mode !== 'foreground'
        ) {
          logClientPerformance_(
            pageKey,
            (metadata.mode || 'request') +
              ' roundTrip=' +
              Math.round(
                nowClient_() - requestStart
              ) +
              'ms'
          );
        }

        return data;

      })
      .catch(error => {

        if (
          cacheGeneration ===
            clientCacheGeneration
        ) {
          setClientPageError_(
            pageKey,
            error,
            metadata
          );
        }

        throw error;

      })
      .then(
        data => {
          clearClientPageInFlight_(
            pageKey,
            promise
          );
          return data;
        },
        error => {
          clearClientPageInFlight_(
            pageKey,
            promise
          );
          throw error;
        }
      );

  setClientPageInFlight_(
    pageKey,
    promise,
    metadata
  );

  return promise;
}


function ensurePageRendererPromise_(
  pageKey,
  page
) {

  if (
    isPageRendererReady_(page)
  ) {

    loadedPageRendererTypes[page.type] =
      true;

    return Promise.resolve();

  }


  if (
    loadedPageRendererTypes[page.type]
  ) {
    return Promise.resolve();
  }

  const rendererKey =
    page.type;

  if (
    pageRendererPromises.has(
      rendererKey
    )
  ) {
    return pageRendererPromises.get(
      rendererKey
    );
  }

  const promise =
    scriptRunPromise_(
    'appGetPageClientTemplate:' + pageKey,
    runner =>
      runner.appGetPageClientTemplate(
        pageKey
      )
  )
    .then(function(html) {

        try {

          installPageRendererTemplate_(
            html
          );

          if (
            !isPageRendererReady_(page)
          ) {
            throw new Error(
              'Page renderer failed to load: ' +
                page.type
            );
          }

          loadedPageRendererTypes[page.type] =
            true;

          return true;

        } catch (error) {

          throw error;

        }

    })
    .then(
      result => {
        pageRendererPromises.delete(
          rendererKey
        );
        return result;
      },
      error => {
        pageRendererPromises.delete(
          rendererKey
        );
        throw error;
      }
    );

  pageRendererPromises.set(
    rendererKey,
    promise
  );

  return promise;
}


function scriptRunPromise_(
  label,
  invoke,
  timeoutMs
) {

  return new Promise((resolve, reject) => {

    let settled =
      false;

    const timer =
      setTimeout(
        function() {

          if (settled) {
            return;
          }

          settled =
            true;

          reject(
            new Error(
              label +
              ' timed out.'
            )
          );

        },
        timeoutMs ||
          SCRIPT_RUN_TIMEOUT_MS
      );


    const finish =
      callback =>
        value => {

          if (settled) {
            return;
          }

          settled =
            true;

          clearTimeout(
            timer
          );

          callback(
            value
          );

        };


    try {

      const runner =
        google.script.run
          .withSuccessHandler(
            finish(resolve)
          )
          .withFailureHandler(
            finish(reject)
          );

      invoke(
        runner
      );

    } catch (error) {

      finish(reject)(
        error
      );

    }

  });
}


function isPageRendererReady_(
  page
) {

  const functionName =
    PAGE_RENDERER_FUNCTIONS[
      page.type
    ];

  return (
    !functionName ||
    typeof window[functionName] === 'function'
  );
}


function installPageRendererTemplate_(
  html
) {

  const wrapper =
    document.createElement(
      'div'
    );

  wrapper.innerHTML =
    html || '';


  wrapper
    .querySelectorAll(
      'script'
    )
    .forEach(source => {

      const script =
        document.createElement(
          'script'
        );

      script.textContent =
        source.textContent || '';

      document.body.appendChild(
        script
      );

      source.remove();

    });
}


function refreshCurrentPage(
  button
) {

  const actionButton =
    button
      ? setActionWorking(

  invalidateClientPage(
    currentPageKey
  );


  loadPage(
    currentPageKey,
    true,
    {
      generation:
        nextNavigationGeneration_(),
      reason: 'refresh',
      actionButton:
        actionButton
    }
  );
}

  pageKey,
  error

  const page =
    appBootstrap &&
    appBootstrap.pages
      ? appBootstrap.pages.find(item =>
          item.key === pageKey
        )

  );

function showPageErrorPanel_(
  title,
  error,
  retryAction
) {

  const content =
    document.getElementById(
      'pageContent'
    );

  if (!content) {
    return;
  }

  content.innerHTML = `
    <div class="app-card page-error-card">
      <div class="page-error-icon">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <div class="page-error-body">
        <h2>${escapeHtml(title)}</h2>
        <p>
          Network Dashboard could not retrieve the requested information.
        </p>
        <div class="page-error-detail">
          ${escapeHtml(getSafeErrorMessage_(error))}
        </div>
        <button
          class="btn btn-sm btn-brand"
          onclick="${retryAction}"
        >
          <i class="fa-solid fa-rotate me-2"></i>
          Retry
        </button>
      </div>
    </div>
  `;
}


function getSafeErrorMessage_(
  error
) {

  const message =
    error &&
    error.message
      ? error.message
      : String(
          error ||
          'Unknown error'
        );

  if (
    !message ||
    /password|token|secret|credential/i.test(
      message
    )
  ) {
    return 'Request failed. See browser console for diagnostics.';
  }

  return message;
}


/*******************************************************
 * RENDER ROUTER
 *******************************************************/

function renderPage(
  pageKey,
  data
) {

  destroyActiveTables();


  const page =
    appBootstrap.pages.find(
      item =>
        item.key === pageKey
    );


  if (!page) {
    return;
  }


  if (
    page.type === 'dashboard'
  ) {

    renderDashboard(
      data
    );

    return;

  }


  if (
    page.type === 'workflow'
  ) {

    renderWorkflowPage(
      data
    );

    return;

  }


  if (
    page.type === 'internetWan'
  ) {

    renderInternetWanPage(
      data
    );

    return;

  }


  if (
    page.type === 'outages'
  ) {

    renderOutagesPage(
      data
    );

    return;

  }


  if (
    page.type === 'uptimeRobot'
  ) {

    renderUptimeRobotPage(
      data
    );

    return;

  }


  if (
    page.type === 'users'
  ) {

    renderUsersPage(
      data
    );

    return;

  }


  if (
    page.type === 'settings'
  ) {

    renderSettingsPage(
      data
    );

    return;

  }


  if (
    page.type === 'structured'
  ) {

    renderStructuredPage(
      data
    );

    return;

  }


  renderTablePage(
    data
  );
}


function destroyActiveTables() {

  if (tableInstance) {

    try {
      tableInstance.destroy();
    } catch (error) {}


    tableInstance =
      null;

  }


  Object.keys(
    structuredTables
  ).forEach(
    key => {

      try {

        structuredTables[
          key
        ].destroy();

      } catch (error) {}

    }
  );


  Object.keys(
    structuredTables
  ).forEach(
    key => {

      delete structuredTables[
        key
      ];

    }
  );
}

    {}
  );
}


function openEditRecord(
  row
) {

  editingRow =
    row;


  openRecordModal(
    'Edit Record',
    row
  );
}


function openRecordModal(
  title,
  record
) {

  const saveButton =
    document.getElementById(
      'saveRecordButton'
    );

  if (saveButton) {
    saveButton.style.display =
      '';
  }

  document.getElementById(
    'recordModalTitle'
  ).textContent =
    title;


  const body =
    document.getElementById(
      'recordModalBody'
    );


  body.innerHTML =
    '';

  const requiredFields =
    typeof getRequiredVisibleColumns_ === 'function'
      ? getRequiredVisibleColumns_(
          currentPageData || {}
        )
      : {};

  if (
    Object.keys(requiredFields)
      .length
  ) {
    const note =
      document.createElement(
        'div'
      );

    note.className =
      'form-required-note';

    note.innerHTML =
      '<span class="required-marker">*</span> Required';

    body.appendChild(
      note
    );
  }


  const row =
    document.createElement(
      'div'
    );


  row.className =
    'row g-3';


  currentHeaders.forEach(
    (header, index) => {

      const column =
        document.createElement(
          'div'
        );


      column.className =
        'col-md-6';


      const label =
        document.createElement(
          'label'
        );


      label.className =
        'form-label';


      label.innerHTML =
        escapeHtml(
          header.toUpperCase()
        ) +
        (
          requiredFields[header]
            ? ' <span class="required-marker">*</span>'
            : ''
        );


      const options =
        currentPageData &&
        currentPageData.controlledOptions
          ? currentPageData.controlledOptions[header] || []
          : [];

      const credentialField =
        typeof isPasswordHeaderClient === 'function' &&
        isPasswordHeaderClient(
          header
        ) &&
        currentPageData &&
        currentPageData.hasCredentials &&
        currentPageData.permission === 'edit';

      const input =
        options.length
          ? document.createElement(
              'select'
            )
          : document.createElement(
              'input'
            );


      input.className =
        options.length
          ? 'form-select'
          : 'form-control';

      if (
        credentialField &&
        input.tagName === 'INPUT'
      ) {
        input.type =
          'password';
        input.autocomplete =
          'new-password';
        input.placeholder =
          editingRow
            ? 'Leave blank to keep current password'
            : 'Optional password';
      }


      input.dataset.header =
        header;


      input.id =
        'recordField_' +
        index;


      if (requiredFields[header]) {
        input.required =
          true;
        input.setAttribute(
          'aria-required',
          'true'
        );
      }


      if (options.length) {

        const currentValue =
          String(
            record[header] || ''
          ).trim();

        const optionList =
          currentValue &&
          !options.some(option =>
            String(option).toLowerCase() ===
            currentValue.toLowerCase()
          )
            ? [currentValue].concat(options)
            : options;

        optionList.forEach(option => {

          const item =
            document.createElement(
              'option'
            );

          item.value =
            option;

          item.textContent =
            option;

          input.appendChild(
            item
          );

        });

        input.value =
          currentValue ||
          options[0];

      } else {

        input.value =
          credentialField &&
          editingRow
            ? ''
            : record[header] || '';

      }


      column.appendChild(
        label
      );


      column.appendChild(
        input
      );

      if (
        credentialField &&
        editingRow
      ) {

        const help =
          document.createElement(
            'div'
          );

        help.className =
          'form-text';

        help.textContent =
          'Leave blank to keep the saved password.';

        column.appendChild(
          help
        );

      }


      row.appendChild(
        column
      );

    }
  );


  body.appendChild(
    row
  );


  document.getElementById(
    'saveRecordButton'
  ).onclick =
    saveRecordFromModal;


  recordModal.show();
}


function saveRecordFromModal() {

  const record =
    {};


  document
    .querySelectorAll(
      '#recordModalBody [data-header]'
    )
    .forEach(
      input => {

        record[
          input.dataset.header
        ] =
          input.value;

      }
    );


  const pageKey =
    currentPageKey;

  const saveButton =
    setActionWorking(
      document.getElementById(
        'saveRecordButton'
      ),
      editingRow
        ? 'Updating...'
        : 'Creating...'
    );


  if (editingRow) {

    scriptRunPromise_(
      'appUpdateRecord:' + pageKey,
      runner =>
        runner.appUpdateRecord(
          pageKey,
          editingRow._row,
          record,
          editingRow._sourceSheet || ''
        )
    )
      .then(function() {

        setActionSuccess(
          saveButton,
          'Saved'
        );

        recordModal.hide();

        invalidateClientPage(
          pageKey
        );

        loadPage(
          pageKey,
          true
        );

        showToast(
          'Record saved.'
        );

      })
      .catch(function(error) {
        setActionError(
          saveButton,
          'Save Failed'
        );
        handleFailure(
          error,
          'save record: ' + pageKey
        );
      });

  } else {

    scriptRunPromise_(
      'appAddRecord:' + pageKey,
      runner =>
        runner.appAddRecord(
          pageKey,
          record
        )
    )
      .then(function() {

        setActionSuccess(
          saveButton,
          'Saved'
        );

        recordModal.hide();

        invalidateClientPage(
          pageKey
        );

        loadPage(
          pageKey,
          true
        );

        showToast(
          'Record saved.'
        );

      })
      .catch(function(error) {
        setActionError(
          saveButton,
          'Save Failed'
        );
        handleFailure(
          error,
          'add record: ' + pageKey
        );
      });

  }
}


function confirmDeleteRecord(
  row,
  button
) {

  if (
    !confirm(
      'Delete this record permanently?'
    )
  ) {

    return;

  }


  const pageKey =
    currentPageKey;

  const actionButton =
    setActionWorking(
      button,
      'Deleting...'
    );

  scriptRunPromise_(
    'appDeleteRecord:' + pageKey,
    runner =>
      runner.appDeleteRecord(
        pageKey,
        row._row,
        row._sourceSheet || ''
      )
  )
    .then(function() {

      setActionSuccess(
        actionButton,
        'Deleted'
      );

      invalidateClientPage(
        pageKey
      );

      loadPage(
        pageKey,
        true
      );

      showToast(
        'Record deleted.'
      );

    })
    .catch(function(error) {
      setActionError(
        actionButton,
        'Delete Failed'
      );
      handleFailure(
        error,
        'delete record: ' + pageKey
      );
    });
}


/*******************************************************
 * ARUBA
 *******************************************************/

function runCentralSync(
  button
) {

  showToast(
    'Synchronizing with Aruba Central...'
  );

  const actionButton =
    setActionWorking(
      button,
      'Syncing...'
    );

  scriptRunPromise_(
    'syncArubaCentralToSheet',
    runner =>

      /*
       * EXISTING WORKING FUNCTION IN Code.gs.
       * DO NOT CHANGE THE ARUBA API IMPLEMENTATION.
       */
      runner.syncArubaCentralToSheet()
  )
    .then(function(result) {
        invalidateClientPage(
          'switches'
        );


        invalidateClientPage(
          'accessPoints'
        );


        clientPageCache.delete(
          'dashboard'
        );

        setActionSuccess(
          actionButton,
          'Synced'
        );

        showToast(

          'Central sync complete: ' +

          (
            result.switchesSynced || 0
          ) +

          ' switches, ' +

          (
            result.apsSynced || 0
          ) +

          ' APs.'

        );


        loadPage(
          currentPageKey,
          true
        );

    })
    .catch(function(error) {
      setActionError(
        actionButton,
        'Sync Failed'
      );
      handleFailure(
        error,
        'Aruba Central sync'
      );
    });
}


function viewRunningConfig(
  serial
) {

  document.getElementById(
    'configDisplay'
  ).textContent =
    'Retrieving configuration from Aruba Central...';


  configModal.show();


  scriptRunPromise_(
    'fetchSwitchRunningConfig',
    runner =>
      runner.fetchSwitchRunningConfig(
        serial
      )
  )
    .then(function(result) {

        document.getElementById(
          'configDisplay'
        ).textContent =
          result.status === 'success'
            ? result.config
            : result.message;

    })
    .catch(function(error) {
      handleFailure(
        error,
        'fetch running config'
      );
    });
}


/*******************************************************
 * STATUS
 *******************************************************/

function isStatusColumn(
  header
) {

  const value =
    String(header || '')
      .toLowerCase();


  return (
    value === 'status' ||
    value.includes('installed') ||
    value.includes('update?') ||
    value === 'tier'
  );
}


function statusPill(
  value
) {

  const original =
    String(
      value ?? ''
    ).trim();


  const normalized =
    original.toLowerCase();


  const success = [
    'up',
    'online',
    'operational',
    'normal',
    'healthy',
    'active',
    'true',
    'yes',
    'installed',
    'success',
    'successful',
    'completed',
    'configured',
    'enabled',
    'connected',
    'synced',
    'available'
  ];


  const danger = [
    'down',
    'offline',
    'failed',
    'failure',
    'false',
    'not installed',
    'critical',
    'inactive',
    'error',
    'missing',
    'not configured',
    'connection failed',
    'sync failed'
  ];


  const warning = [
    'warning',
    'needs attention',
    'degraded',
    'maintenance',
    'paused',
    'needs update',
    'pending',
    'not synced',
    'testing',
    'syncing',
    'disabled',
    'partial'
  ];


  let className =
    'status-neutral';


  let icon =
    'fa-circle';


  if (
    success.includes(
      normalized
    )
  ) {

    className =
      'status-success';

    icon =
      'fa-circle-check';

  } else if (
    danger.includes(
      normalized
    )
  ) {

    className =
      'status-danger';

    icon =
      'fa-circle-xmark';

  } else if (
    warning.includes(
      normalized
    )
  ) {

    className =
      'status-warning';

    icon =
      'fa-triangle-exclamation';

  } else if (
    normalized.startsWith(
      'tier '
    )
  ) {

    className =
      'status-info';

    icon =
      'fa-layer-group';

  }


  return `

    <span
      class="status-pill ${className}"
    >

      <i class="fa-solid ${icon}"></i>

      ${escapeHtml(
        original || 'Unknown'
      )}

    </span>

  `;
}


/*******************************************************
 * ERROR / TOAST
 *******************************************************/

function handleFailure(
  error,
  context
) {

  console.error(
    'Network Dashboard request failed:',
    context || 'unknown operation',
    error
  );


  showToast(
    getSafeErrorMessage_(
      error
    ),
    true
  );
}


function showToast(
  message,
  error
) {

  const container =
    document.getElementById(
      'toastContainer'
    );


  const toast =
    document.createElement(
      'div'
    );


  toast.className =
    'app-toast';


  if (error) {

    toast.style.background =
      '#8e2929';

  }


  toast.textContent =
    message;


  container.appendChild(
    toast
  );


  setTimeout(
    function() {

      toast.remove();

    },
    4000
  );
}


/*******************************************************
 * ESCAPING
 *******************************************************/

function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )
    .replaceAll(
      '&',
      '&amp;'
    )
    .replaceAll(
      '<',
      '&lt;'
    )
    .replaceAll(
      '>',
      '&gt;'
    )
    .replaceAll(
      '"',
      '&quot;'
    )
    .replaceAll(
      "'",
      '&#039;'
    );
}


function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );
}


function safeJson(
  value
) {

  return JSON
    .stringify(value)
    .replace(
      /</g,
      '\\u003c'
    )
    .replace(
      />/g,
      '\\u003e'
    )
    .replace(
      /&/g,
      '\\u0026'
    );
}
