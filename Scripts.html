<script>

/*******************************************************
 * CONFIGURATION
 *******************************************************/


/*
 * Browser session cache policy.
 *
 * Fresh entries render without a server trip. Older entries
 * can still render immediately, then refresh quietly in the
 * background.
 */
const CLIENT_CACHE_FRESH_MS =
  60 * 1000;

const CLIENT_CACHE_TTL_MS =
  5 * 60 * 1000;


const ACTION_SUCCESS_RESET_MS =
  1200;


const NEXT_ROUTE_STORAGE_KEY =
  'networkDashboard.nextRoute';


/*******************************************************
 * STATE
 *******************************************************/

let appBootstrap =
  null;


let currentPageKey =
  'dashboard';


let navigationGeneration =
  0;


let clientCacheGeneration =
  0;


let currentPageData =
  null;


let currentTableData =
  null;


let currentStructuredData =
  null;


let currentHeaders =
  [];


let tableInstance =
  null;


let editingRow =
  null;


let recordModal =
  null;


let configModal =
  null;


let appWorkingModal =
  null;


let appWorkingModalRetry =
  null;


const clientPageCache =
  new Map();


let uptimeRobotStartupRefreshStarted =
  false;


let uptimeRobotHealthRefreshInFlight =
  null;


const structuredTables =
  {};


const PAGE_RENDERER_FUNCTIONS = {
  dashboard: 'renderDashboard', switches: 'renderSwitchesPage',
  accessPoints: 'renderAccessPointsPage', servers: 'renderServersPage',
  routes: 'renderRoutesPage', securityCameras: 'renderSecurityCamerasPage',
  busCameras: 'renderBusCamerasPage', intercom: 'renderIntercomPage',
  backups: 'renderBackupsPage', internetWan: 'renderInternetWanPage',
  outages: 'renderOutagesPage', uptimeRobot: 'renderUptimeRobotPage',
  workflow: 'renderWorkflowPage', users: 'renderUsersPage', settings: 'renderSettingsPage'
};

const PAGE_UPDATE_FUNCTIONS = {
  switches: 'updateRecordTablePage_', accessPoints: 'updateRecordTablePage_',
  servers: 'updateRecordTablePage_', routes: 'updateRecordTablePage_',
  securityCameras: 'updateRecordTablePage_', backups: 'updateRecordTablePage_',
  busCameras: 'updateStructuredTables_', intercom: 'updateStructuredTables_',
  internetWan: 'updateInternetWanPage_', outages: 'updateOutagesPage_',
  uptimeRobot: 'updateUptimeRobotPage_', workflow: 'updateWorkflowPage_'
};

const pageRequestVersions = new Map();
const activeAppTables = new Set();
let activePagePerformance = null;
let renderedPageKey = '';
let pageDataRequests = 0;
let uptimeRobotStartupTimer = null;

const SCRIPT_RUN_TIMEOUT_MS =
  60000;


/*******************************************************
 * STARTUP
 *******************************************************/

window.addEventListener(
  'DOMContentLoaded',
  function() {


    recordModal =
      new bootstrap.Modal(
        document.getElementById(
          'recordModal'
        )
      );


    configModal =
      new bootstrap.Modal(
        document.getElementById(
          'configModal'
        )
      );


    if (window.INITIAL_APP_BOOTSTRAP) {

      try {

        initializeApplication(
          window.INITIAL_APP_BOOTSTRAP
        );

      } catch (error) {

        showBootstrapError(
          error
        );

        handleFailure(
          error,
          'initial bootstrap'
        );

      }

      return;
    }


    getBootstrapPromise_()
      .then(
        initializeApplication
      )
      .catch(function(error) {

        showBootstrapError(
          error
        );

        handleFailure(
          error,
          'bootstrap'
        );

      });

  }
);


/*******************************************************
 * APP INITIALIZATION
 *******************************************************/

function initializeApplication(
  data
) {

  applyBootstrapShell(
    data
  );


  navigateTo(
    getInitialRoute_()
  );
}


function getInitialRoute_() {

  const pages =
    appBootstrap &&
    appBootstrap.pages
      ? appBootstrap.pages
      : [];

  const allowed = {};

  pages.forEach(page => {
    allowed[page.key] = true;
  });

  let storedRoute =
    '';

  try {
    storedRoute =
      sessionStorage.getItem(
        NEXT_ROUTE_STORAGE_KEY
      ) || '';

    if (storedRoute) {
      sessionStorage.removeItem(
        NEXT_ROUTE_STORAGE_KEY
      );
    }
  } catch (error) {
    storedRoute =
      '';
  }

  if (
    storedRoute &&
    allowed[storedRoute]
  ) {
    return storedRoute;
  }

  if (
    allowed[currentPageKey]
  ) {
    return currentPageKey;
  }

  return allowed.dashboard
    ? 'dashboard'
    : (
        pages[0] &&
        pages[0].key
      ) ||
      'dashboard';
}


function requestNextInitialRoute_(
  pageKey
) {

  try {
    sessionStorage.setItem(
      NEXT_ROUTE_STORAGE_KEY,
      pageKey
    );
  } catch (error) {}
}


function applyBootstrapShell(
  data
) {

  data =
    data || {};

  appBootstrap =
    data;


  applyBranding(
    data.config || {}
  );


  const user =
    data.user || {};

  document.getElementById(
    'sidebarUserName'
  ).textContent =
    user.name ||
    user.email ||
    '';


  document.getElementById(
    'sidebarUserRole'
  ).textContent =
    user.admin
      ? (
          user.breakglass
            ? 'Break-glass Administrator'
            : 'Administrator'
        )
      : 'Authorized User';


  const pages =
    data.pages || [];

  if (
    !pages.some(
      page =>
        page.key === currentPageKey
    )
  ) {
    currentPageKey =
      'dashboard';
  }


  buildNavigation(
    pages
  );

  buildGlobalHelpMenu_();
}


function getSafeExternalUrl_(value) {
  const text = String(value || '').trim();
  if (!text) return '';
  try {
    const url = new URL(text);
    return url.protocol === 'http:' || url.protocol === 'https:'
      ? text
      : '';
  } catch (error) {
    return '';
  }
}


function helpExternalItem_(label, value) {
  const url = getSafeExternalUrl_(value);
  if (!url) {
    return `<span class="dropdown-item help-menu-unavailable" title="This documentation link is not configured or is invalid.">${escapeHtml(label)} <small>(Unavailable)</small></span>`;
  }
  return `<a class="dropdown-item" href="${escapeAttribute(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`;
}


function buildGlobalHelpMenu_() {
  const menu = document.getElementById('globalHelpMenu');
  if (!menu) return;
  const config = appBootstrap && appBootstrap.config || {};
  const docs = config.documentation || {};
  const admin = !!(appBootstrap && appBootstrap.user && appBootstrap.user.admin);
  menu.innerHTML = `
    <div class="help-menu-heading">Help</div>
    <div class="dropdown-divider"></div>
    ${helpExternalItem_('Frequently Asked Questions', docs.faqUrl)}
    ${admin ? helpExternalItem_('Update & Maintenance Guide', docs.updateGuideUrl) : ''}
    ${admin ? helpExternalItem_('Setup & Deployment Guide', docs.setupGuideUrl) : ''}
    ${admin ? '<div class="dropdown-divider"></div>' : ''}
    <button class="dropdown-item" type="button" onclick="showNetworkDashboardAbout_()">About Network Dashboard</button>
  `;
}


function aboutExternalValue_(label, value) {
  const url = getSafeExternalUrl_(value);
  return url
    ? `<a href="${escapeAttribute(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`
    : '<span class="text-muted">Not configured</span>';
}


function showNetworkDashboardAbout_() {
  const config = appBootstrap && appBootstrap.config || {};
  const docs = config.documentation || {};
  const organization = config.organization || {};
  const admin = !!(appBootstrap && appBootstrap.user && appBootstrap.user.admin);
  const body = document.getElementById('aboutModalBody');
  if (!body) return;
  body.innerHTML = `
    <dl class="about-details">
      <dt>Application Name</dt><dd>${escapeHtml(config.appName || 'Network Dashboard')}</dd>
      <dt>Application Version</dt><dd>${escapeHtml(config.applicationVersion || '')}</dd>
      <dt>Schema Version</dt><dd>${escapeHtml(config.schemaVersion || '')}</dd>
      <dt>Organization Name</dt><dd>${escapeHtml(organization.name || 'Not configured')}</dd>
      <dt>FAQ</dt><dd>${aboutExternalValue_('Open FAQ', docs.faqUrl)}</dd>
      ${admin ? `<dt>Update Guide</dt><dd>${aboutExternalValue_('Open Update & Maintenance Guide', docs.updateGuideUrl)}</dd>` : ''}
      ${admin ? `<dt>Setup Guide</dt><dd>${aboutExternalValue_('Open Setup & Deployment Guide', docs.setupGuideUrl)}</dd>` : ''}
      <dt>GitHub Repository</dt><dd>${aboutExternalValue_('bj-pullman/network-dashboard', 'https://github.com/bj-pullman/network-dashboard')}</dd>
    </dl>
  `;
  bootstrap.Modal.getOrCreateInstance(document.getElementById('aboutModal')).show();
}


function applyBranding(
  config
) {

  config =
    config || {};

  const branding =
    config.branding || {};

  const organization =
    config.organization || {};

  const root =
    document.documentElement;

  const primary =
    branding.primaryColor || '#17345f';

  const secondary =
    branding.secondaryColor || '#0d2342';

  const accent =
    branding.accentColor || '#f4c430';

  const headerFont =
    branding.headerFontColor || '#0d2342';


  root.style.setProperty(
    '--brand-primary',
    primary
  );

  root.style.setProperty(
    '--brand-secondary',
    secondary
  );

  root.style.setProperty(
    '--brand-accent',
    accent
  );

  root.style.setProperty(
    '--header-font-color',
    headerFont
  );

  root.style.setProperty(
    '--navy-800',
    primary
  );

  root.style.setProperty(
    '--navy-900',
    secondary
  );

  root.style.setProperty(
    '--gold',
    accent
  );


  document.title =
    config.appName ||
    'Network Dashboard';


  const brandTitle =
    document.getElementById(
      'brandTitle'
    );

  if (brandTitle) {
    brandTitle.textContent =
      (
        organization.shortName ||
        config.appName ||
        'Network Dashboard'
      ).toUpperCase();
  }


  const brandSubtitle =
    document.getElementById(
      'brandSubtitle'
    );

  if (brandSubtitle) {
    brandSubtitle.textContent =
      'INFRASTRUCTURE';
  }


  const eyebrow =
    document.getElementById(
      'pageEyebrow'
    );

  if (eyebrow) {
    eyebrow.textContent =
      (
        organization.name ||
        config.appName ||
        'Network Dashboard'
      ).toUpperCase();
  }


  const logo =
    document.getElementById(
      'brandLogo'
    );

  const fallback =
    document.getElementById(
      'brandLogoFallback'
    );

  if (
    logo &&
    fallback
  ) {

    if (branding.logoUrl) {
      logo.src = branding.logoUrl;
      logo.hidden = false;
      fallback.hidden = true;
    } else {
      logo.hidden = true;
      fallback.hidden = false;
    }

  }

  applyFavicon_(
    branding.faviconUrl
  );
}


function applyFavicon_(
  faviconUrl
) {

  const url =
    String(
      faviconUrl || ''
    ).trim();

  let link =
    document.getElementById(
      'appFavicon'
    );

  if (!url) {
    if (link) {
      link.removeAttribute(
        'href'
      );
    }
    return;
  }

  if (
    !/^https?:\/\//i.test(
      url
    )
  ) {
    return;
  }

  if (!link) {
    link =
      document.createElement(
        'link'
      );
    link.id =
      'appFavicon';
    link.rel =
      'icon';
    document.head.appendChild(
      link
    );
  }

  link.href =
    url;
}


/*******************************************************
 * NAVIGATION
 *******************************************************/

function buildNavigation(
  pages
) {

  const container =
    document.getElementById(
      'navigation'
    );


  const groups =
    {};


  pages.forEach(
    page => {

      if (!groups[page.group]) {
        groups[page.group] = [];
      }


      groups[
        page.group
      ].push(page);

    }
  );


  container.innerHTML =
    '';


  Object.entries(groups)
    .forEach(
      ([group, groupPages]) => {

        const section =
          document.createElement(
            'div'
          );


        section.className =
          'nav-group';


        const title =
          document.createElement(
            'div'
          );


        title.className =
          'nav-group-title';


        title.textContent =
          group.toUpperCase();


        section.appendChild(
          title
        );


        groupPages.forEach(
          page => {

            const button =
              document.createElement(
                'button'
              );


            button.className =
              'app-nav-item' +
              (
                page.key === currentPageKey
                  ? ' active'
                  : ''
              );


            button.dataset.page =
              page.key;


            const icon =
              document.createElement(
                'i'
              );


            icon.className =
              'fa-solid ' +
              page.icon;


            const label =
              document.createElement(
                'span'
              );


            label.textContent =
              page.label;


            button.appendChild(
              icon
            );


            button.appendChild(
              label
            );


            button.addEventListener(
              'click',
              function() {

                navigateTo(
                  page.key
                );

              }
            );


            section.appendChild(
              button
            );

          }
        );


        container.appendChild(
          section
        );

      }
    );
}


function navigateTo(
  pageKey
) {
  const started = nowClient_();

  if (
    !appBootstrap ||
    !appBootstrap.pages.some(
      page =>
        page.key === pageKey
    )
  ) {
    return;
  }


  currentPageKey =
    pageKey;

  const generation =
    nextNavigationGeneration_();


  cancelUptimeRobotStartupTimer_();


  document
    .querySelectorAll(
      '.app-nav-item'
    )
    .forEach(
      button => {

        button.classList.toggle(
          'active',
          button.dataset.page === pageKey
        );

      }
    );


  loadPage(
    pageKey,
    false,
    {
      generation: generation,
      started: started,
      reason: 'navigation'
    }
  );
}


/*******************************************************
 * CLIENT CACHE
 *******************************************************/

function getClientCache(
  pageKey
) {

  const entry =
    getClientCacheEntry_(
      pageKey
    );


  return entry && entry.data
    ? entry.data
    : null;
}


function getClientCacheEntry_(
  pageKey
) {

  const entry =
    clientPageCache.get(
      pageKey
    );

  if (
    !entry
  ) {
    return null;
  }

  if (
    entry.loadedAt &&
    Date.now() -
    entry.loadedAt >
    CLIENT_CACHE_TTL_MS
  ) {

    clientPageCache.delete(
      pageKey
    );

    return null;

  }


  return entry;
}


function getOrCreateClientCacheEntry_(
  pageKey
) {

  let entry =
    clientPageCache.get(
      pageKey
    );

  if (!entry) {

    entry = {
      pageKey: pageKey,
      status: 'idle',
      data: null,
      loadedAt: 0,
      timestamp: 0,
      inFlight: null,
      error: null,
      metadata: {}
    };

    clientPageCache.set(
      pageKey,
      entry
    );

  }

  return entry;
}


function isClientCacheFresh_(
  entry
) {

  return !!(
    entry &&
    entry.data &&
    entry.loadedAt &&
    Date.now() -
      entry.loadedAt <=
      CLIENT_CACHE_FRESH_MS
  );
}




function setClientCache(
  pageKey,
  data,
  metadata
) {

  const now =
    Date.now();

  const entry =
    getOrCreateClientCacheEntry_(
      pageKey
    );

  entry.status =
    'loaded';

  entry.timestamp =
    now;

  entry.loadedAt =
    now;

  entry.data =
    data;

  entry.error =
    null;

  entry.inFlight =
    null;

  entry.metadata =
    Object.assign(
      {},
      entry.metadata || {},
      metadata || {}
    );

  clientPageCache.set(
    pageKey,
    entry
  );
}


function setClientPageInFlight_(
  pageKey,
  promise,
  metadata
) {

  const entry =
    getOrCreateClientCacheEntry_(
      pageKey
    );

  entry.status =
    'loading';

  entry.inFlight =
    promise;

  entry.error =
    null;

  entry.metadata =
    Object.assign(
      {},
      entry.metadata || {},
      metadata || {}
    );

  clientPageCache.set(
    pageKey,
    entry
  );
}


function clearClientPageInFlight_(
  pageKey,
  promise
) {

  const entry =
    clientPageCache.get(
      pageKey
    );

  if (
    entry &&
    entry.inFlight === promise
  ) {

    entry.inFlight =
      null;

    if (
      entry.status === 'loading'
    ) {
      entry.status =
        entry.data
          ? 'loaded'
          : 'idle';
    }

  }
}


function setClientPageError_(
  pageKey,
  error,
  metadata
) {

  const entry =
    getOrCreateClientCacheEntry_(
      pageKey
    );

  entry.status =
    entry.data
      ? 'loaded'
      : 'error';

  entry.error =
    error;

  entry.inFlight =
    null;

  entry.metadata =
    Object.assign(
      {},
      entry.metadata || {},
      metadata || {}
    );
}


function invalidateClientPage(pageKey) {
  const keys = pageKey === 'dashboard' ? [pageKey] : [pageKey, 'dashboard'];
  keys.forEach(key => {
    pageRequestVersions.set(key, (pageRequestVersions.get(key) || 0) + 1);
    clientPageCache.delete(key);
  });
}


function clearClientPageCache_() {

  clientCacheGeneration +=
    1;

  clientPageCache.clear();

  cancelUptimeRobotStartupTimer_();

  uptimeRobotStartupRefreshStarted =
    false;
}


function markClientPageWritten(
  pageKey,
  data
) {

  pageRequestVersions.set(pageKey, (pageRequestVersions.get(pageKey) || 0) + 1);
  setClientCache(
    pageKey,
    data,
    {
      source: 'write'
    }
  );

  if (
    pageKey !== 'dashboard'
  ) {
    invalidateClientPage(
      'dashboard'
    );
  }
}




function closeRowActionMenu() {

  const menu =
    document.getElementById(
      'rowActionMenu'
    );


  if (menu) {
    menu.remove();
  }
}


/*******************************************************
 * ACTION STATE
 *******************************************************/

function setActionWorking(
  button,
  label
) {

  button =
    resolveActionButton_(
      button
    );

  if (!button) {
    return null;
  }

  captureActionState_(
    button
  );

  button.disabled =
    true;

  button.setAttribute(
    'aria-busy',
    'true'
  );

  button.innerHTML =
    '<span>' + escapeHtml(/^(creating|updating|saving)/i.test(label || '') ? 'Saving...' : label || 'Working...') +
    '</span><span class="action-progress" role="progressbar" aria-label="Working"></span>';

  return button;
}


function setActionSuccess(button) {
  restoreAction(button);
  return button;
}

function setActionError(button) {
  restoreAction(button);
  return button;
}

function restoreAction(
  button
) {

  button =
    resolveActionButton_(
      button
    );

  if (
    !button ||
    !button._networkDashboardActionState
  ) {
    return;
  }

  const state =
    button._networkDashboardActionState;

  if (state.restoreTimer) {
    clearTimeout(
      state.restoreTimer
    );
  }

  button.innerHTML =
    state.html;

  button.disabled =
    state.disabled;

  button.style.minWidth =
    state.minWidth;

  button.removeAttribute(
    'aria-busy'
  );

  delete button._networkDashboardActionState;
}


function resolveActionButton_(
  button
) {

  if (button) {
    return button;
  }

  const active =
    document.activeElement;

  return active &&
    active.tagName === 'BUTTON'
    ? active
    : null;
}


function captureActionState_(
  button
) {

  if (
    button._networkDashboardActionState
  ) {
    if (
      button._networkDashboardActionState.restoreTimer
    ) {
      clearTimeout(
        button._networkDashboardActionState.restoreTimer
      );
      button._networkDashboardActionState.restoreTimer =
        null;
    }
    return;
  }

  const width =
    button.offsetWidth || 0;

  button._networkDashboardActionState = {
    html:
      button.innerHTML,
    disabled:
      button.disabled,
    minWidth:
      button.style.minWidth || '',
    restoreTimer:
      null
  };

  if (width) {
    button.style.minWidth =
      width + 'px';
  }
}


function scheduleActionRestore_(
  button
) {

  if (
    !button ||
    !button._networkDashboardActionState
  ) {
    return;
  }

  button._networkDashboardActionState.restoreTimer =
    setTimeout(
      function() {
        restoreAction(
          button
        );
      },
      ACTION_SUCCESS_RESET_MS
    );
}


/*******************************************************
 * APPLICATION WORKING MODAL
 *******************************************************/

function showAppWorkingModal(
  options
) {

  options =
    options || {};

  hideAppWorkingModal();

  const overlay =
    document.createElement(
      'div'
    );

  overlay.id =
    'appWorkingModal';

  overlay.className =
    'app-working-modal-backdrop';

  overlay.innerHTML = `
    <div
      class="app-working-modal"
      role="status"
      aria-live="polite"
      aria-modal="true"
    >
      <div class="app-working-modal-icon">
        <span class="action-progress" role="progressbar" aria-label="Saving"></span>
      </div>
      <div class="app-working-modal-title">
        ${escapeHtml(options.title || 'Working...')}
      </div>
      <div class="app-working-modal-message">
        ${escapeHtml(options.message || '')}
      </div>
      <div
        class="app-working-modal-error"
        hidden
      ></div>
      <div
        class="app-working-modal-actions"
        hidden
      >
        <button
          type="button"
          class="btn btn-sm btn-light border"
          data-working-modal-close
        >
          Close
        </button>
        <button
          type="button"
          class="btn btn-sm btn-brand"
          data-working-modal-retry
          hidden
        >
          Try Again
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(
    overlay
  );

  const close =
    overlay.querySelector(
      '[data-working-modal-close]'
    );

  if (close) {
    close.addEventListener(
      'click',
      hideAppWorkingModal
    );
  }

  const retry =
    overlay.querySelector(
      '[data-working-modal-retry]'
    );

  if (retry) {
    retry.addEventListener(
      'click',
      function() {
        if (typeof appWorkingModalRetry === 'function') {
          appWorkingModalRetry();
        }
      }
    );
  }

  appWorkingModal =
    overlay;

  document.body.classList.add(
    'app-working-modal-open'
  );

  return overlay;
}


function updateAppWorkingModal(
  options
) {

  options =
    options || {};

  const overlay =
    appWorkingModal ||
    document.getElementById(
      'appWorkingModal'
    );

  if (!overlay) {
    return null;
  }

  const icon =
    overlay.querySelector(
      '.app-working-modal-icon'
    );

  const title =
    overlay.querySelector(
      '.app-working-modal-title'
    );

  const message =
    overlay.querySelector(
      '.app-working-modal-message'
    );

  const error =
    overlay.querySelector(
      '.app-working-modal-error'
    );

  const actions =
    overlay.querySelector(
      '.app-working-modal-actions'
    );

  const retry =
    overlay.querySelector(
      '[data-working-modal-retry]'
    );

  if (icon) {
    icon.innerHTML =
      options.state === 'success'
        ? '<i class="fa-solid fa-check"></i>'
        : options.state === 'error'
          ? '<i class="fa-solid fa-triangle-exclamation"></i>'
          : '<span class="action-progress" role="progressbar" aria-label="Working"></span>';

    icon.classList.toggle(
      'is-success',
      options.state === 'success'
    );

    icon.classList.toggle(
      'is-error',
      options.state === 'error'
    );
  }

  if (
    title &&
    options.title !== undefined
  ) {
    title.textContent =
      options.title;
  }

  if (
    message &&
    options.message !== undefined
  ) {
    message.textContent =
      options.message;
  }

  if (error) {
    const errorMessage =
      options.error
        ? getSafeErrorMessage_(
            options.error
          )
        : '';

    error.textContent =
      errorMessage;

    error.hidden =
      !errorMessage;
  }

  if (actions) {
    actions.hidden =
      options.state !== 'error';
  }

  appWorkingModalRetry =
    typeof options.retry === 'function'
      ? options.retry
      : null;

  if (retry) {
    retry.hidden =
      options.state !== 'error' ||
      !appWorkingModalRetry;
  }

  return overlay;
}


function hideAppWorkingModal() {

  const overlay =
    appWorkingModal ||
    document.getElementById(
      'appWorkingModal'
    );

  if (overlay) {
    overlay.remove();
  }

  appWorkingModal =
    null;

  appWorkingModalRetry =
    null;

  document.body.classList.remove(
    'app-working-modal-open'
  );
}


/*******************************************************
 * PAGE LOADING
 *******************************************************/

function nextNavigationGeneration_() {

  navigationGeneration += 1;

  return navigationGeneration;
}


function getBootstrapPage_(
  pageKey
) {

  return appBootstrap &&
    appBootstrap.pages
      ? appBootstrap.pages.find(
          item =>
            item.key === pageKey
        )
      : null;
}


function isActivePageRequest_(
  pageKey,
  generation
) {

  return currentPageKey === pageKey &&
    generation === navigationGeneration;
}


async function loadPage(pageKey, forceRefresh, options) {
  options = options || {};
  closeRowActionMenu();
  const page = getBootstrapPage_(pageKey);
  if (!page || currentPageKey !== pageKey) return;
  const generation = options.generation || nextNavigationGeneration_();
  const entry = forceRefresh ? null : getClientCacheEntry_(pageKey);
  const cacheState = entry && entry.data ? (isClientCacheFresh_(entry) ? 'hit' : 'stale') : 'miss';
  const trace = beginPagePerformance_(pageKey, generation, cacheState);
  if (options.started !== undefined) trace.started = options.started;
  activePagePerformance = trace;
  try {
    getPageRenderer_(pageKey);
    trace.renderer = nowClient_() - trace.started;
    let data;
    if (entry && entry.data) {
      data = entry.data;
    } else {
      showPageLoading();
      data = await requestPageData_(pageKey, !!forceRefresh, {
        mode: 'foreground', reason: options.reason || 'navigation', trace: trace
      });
    }
    if (!isActivePageRequest_(pageKey, generation)) return;
    trace.dataReceived = nowClient_() - trace.started;
    renderPage(pageKey, data, trace);
    if (cacheState === 'stale') refreshPageQuietly_(pageKey, generation, options.reason);
    if (options.actionButton) setActionSuccess(options.actionButton, 'Refreshed');
    return data;
  } catch (error) {
    if (isActivePageRequest_(pageKey, generation)) {
      trace.failed = true;
      showPageError(pageKey, error);
      handleFailure(error, 'page load: ' + pageKey);
    }
    if (options.actionButton) setActionError(options.actionButton, 'Refresh Failed');
  }
}


async function refreshPageQuietly_(pageKey, generation, reason) {
  const trace = beginPagePerformance_(pageKey, generation, 'revalidate');
  try {
    const data = await requestPageData_(pageKey, true, {
      mode: 'quiet-refresh', reason: reason || 'stale', trace: trace
    });
    if (!isActivePageRequest_(pageKey, generation)) return;
    const update = window[PAGE_UPDATE_FUNCTIONS[pageKey]];
    trace.dataReceived = nowClient_() - trace.started;
    if (renderedPageKey === pageKey && typeof update === 'function' &&
        pageStructureSignature_(currentPageData) === pageStructureSignature_(data)) {
      const started = nowClient_();
      await update(data);
      if (!isActivePageRequest_(pageKey, generation)) return;
      trace.tableRender = nowClient_() - started;
      trace.update = 'in-place';
      currentPageData = data;
      trace.shellReady = true;
      finishPagePerformanceAfterPaint_(trace);
    } else {
      activePagePerformance = trace;
      renderPage(pageKey, data, trace);
    }
  } catch (error) {
    console.warn('[Cache] quiet refresh failed for ' + pageKey);
  }
}




function cancelUptimeRobotStartupTimer_() {
  if (uptimeRobotStartupTimer !== null) clearTimeout(uptimeRobotStartupTimer);
  uptimeRobotStartupTimer = null;
}

function scheduleUptimeRobotStartupRefresh_() {
  const task = appBootstrap && appBootstrap.startupTasks &&
    appBootstrap.startupTasks.uptimeRobotHealthRefresh;
  if (uptimeRobotStartupRefreshStarted || uptimeRobotStartupTimer !== null ||
      !task || !task.enabled || currentPageKey !== 'dashboard' || pageDataRequests) return;
  // Dispatch only after Dashboard is usable and navigation has remained idle.
  uptimeRobotStartupTimer = setTimeout(function() {
    uptimeRobotStartupTimer = null;
    if (currentPageKey !== 'dashboard' || pageDataRequests) return;
    uptimeRobotStartupRefreshStarted = true;
    runUptimeRobotHealthRefresh_({ reason: 'startup', silent: true })
      .catch(function() { console.warn('[UptimeRobot] startup health refresh failed'); });
  }, 600);
}


function runUptimeRobotHealthRefresh_(
  options
) {

  options =
    options || {};

  if (uptimeRobotHealthRefreshInFlight) {
    console.log(
      '[UptimeRobot] reusing in-flight health refresh'
    );
    return uptimeRobotHealthRefreshInFlight;
  }

  const requestStart =
    nowClient_();

  uptimeRobotHealthRefreshInFlight =
    scriptRunPromise_(
      'appRefreshInternetWanHealth:' +
        (options.reason || 'manual'),
      runner =>
        runner.appRefreshInternetWanHealth()
    )
      .then(function(monitoring) {

        logClientPerformance_(
          'uptimeRobot',
          'health-refresh reason=' +
            (options.reason || 'manual') +
            ' roundTrip=' +
            Math.round(
              nowClient_() - requestStart
            ) +
            'ms'
        );

        applyUptimeRobotHealthRefreshResult_(
          monitoring,
          options
        );

        return monitoring;

      })
      .catch(function(error) {

        if (!options.silent) {
          handleFailure(
            error,
            'sync WAN health'
          );
        }

        throw error;

      })
      .finally(function() {
        uptimeRobotHealthRefreshInFlight =
          null;
      });

  return uptimeRobotHealthRefreshInFlight;
}


function applyUptimeRobotHealthRefreshResult_(
  monitoring,
  options
) {

  options =
    options || {};

  const isStartupRefresh =
    options.reason === 'startup';

  if (
    currentPageKey === 'internetWan' &&
    !isStartupRefresh &&
    currentPageData &&
    typeof applyInternetWanHealthToData_ === 'function' &&
    typeof renderInternetWanPage === 'function'
  ) {
    applyInternetWanHealthToData_(
      currentPageData,
      monitoring
    );

    markClientPageWritten(
      'internetWan',
      currentPageData
    );

    renderInternetWanPage(
      currentPageData
    );
  } else {
    invalidateClientPage(
      'internetWan'
    );
  }

  if (
    currentPageKey === 'uptimeRobot' &&
    !isStartupRefresh
  ) {
    loadPage(
      'uptimeRobot',
      true,
      {
        reason:
          options.reason || 'uptimerobot-health-refresh'
      }
    );
  } else {
    invalidateClientPage(
      'uptimeRobot'
    );
  }

  if (
    currentPageKey === 'dashboard' &&
    isStartupRefresh &&
    typeof refreshDashboardUptimeRobotWidgets_ === 'function'
  ) {
    refreshDashboardUptimeRobotWidgets_(
      monitoring
    );
    invalidateClientPage(
      'dashboard'
    );
    return;
  }

  if (
    currentPageKey === 'dashboard' &&
    !isStartupRefresh
  ) {
    loadPage(
      'dashboard',
      true,
      {
        reason:
          options.reason || 'uptimerobot-health-refresh'
      }
    );
  } else {
    invalidateClientPage(
      'dashboard'
    );
  }
}


function nowClient_() {

  return window.performance &&
    typeof window.performance.now === 'function'
    ? window.performance.now()
    : Date.now();
}


function runAfterNextPaint_(
  callback
) {

  const run =
    typeof callback === 'function'
      ? callback
      : function() {};

  if (
    typeof window !== 'undefined' &&
    typeof window.requestAnimationFrame === 'function'
  ) {

    window.requestAnimationFrame(function() {
      window.requestAnimationFrame(run);
    });

    return;

  }

  setTimeout(
    run,
    0
  );
}


function logClientPerformance_(pageKey, message) {
  console.log('[Performance][' + pageKey + '] ' + message);
}


function getBootstrapPromise_() {

  return scriptRunPromise_(
    'getAppBootstrap',
    runner =>
      runner.getAppBootstrap()
  );
}


function getPageDataPromise_(
  pageKey,
  forceRefresh
) {

  return scriptRunPromise_(
    'appGetPageData:' + pageKey,
    runner =>
      runner.appGetPageData(
        pageKey,
        !!forceRefresh
      )
  );
}


function requestPageData_(pageKey, forceRefresh, metadata) {
  metadata = metadata || {};
  if (!getBootstrapPage_(pageKey)) return Promise.reject(new Error('Unknown application page.'));
  const entry = getClientCacheEntry_(pageKey);
  if (entry && entry.inFlight && (!forceRefresh || metadata.mode === 'quiet-refresh')) {
    const waiting = nowClient_();
    return entry.inFlight.then(data => {
      if (metadata.trace) {
        metadata.trace.roundTrip = nowClient_() - (entry.metadata.requestStarted || waiting);
        metadata.trace.server = data.performance || null;
        metadata.trace.request = 'reused';
      }
      return data;
    });
  }
  const version = (pageRequestVersions.get(pageKey) || 0) + 1;
  pageRequestVersions.set(pageKey, version);
  const cacheGeneration = clientCacheGeneration;
  const started = nowClient_();
  pageDataRequests += 1;
  const isCurrent = () => cacheGeneration === clientCacheGeneration &&
    pageRequestVersions.get(pageKey) === version;
  const promise = getPageDataPromise_(pageKey, !!forceRefresh).then(data => {
    if (metadata.trace) {
      metadata.trace.roundTrip = nowClient_() - started;
      metadata.trace.server = data.performance || null;
    }
    if (isCurrent()) {
      setClientCache(pageKey, data, { mode: metadata.mode, reason: metadata.reason });
    }
    return data;
  }).catch(error => {
    if (isCurrent()) setClientPageError_(pageKey, error);
    throw error;
  }).finally(() => {
    pageDataRequests = Math.max(0, pageDataRequests - 1);
    clearClientPageInFlight_(pageKey, promise);
  });
  setClientPageInFlight_(pageKey, promise, { mode: metadata.mode, requestStarted: started });
  return promise;
}


function scriptRunPromise_(
  label,
  invoke,
  timeoutMs
) {

  return new Promise((resolve, reject) => {

    let settled =
      false;

    const timer =
      setTimeout(
        function() {

          if (settled) {
            return;
          }

          settled =
            true;

          reject(
            new Error(
              label +
              ' timed out.'
            )
          );

        },
        timeoutMs ||
          SCRIPT_RUN_TIMEOUT_MS
      );


    const finish =
      callback =>
        value => {

          if (settled) {
            return;
          }

          settled =
            true;

          clearTimeout(
            timer
          );

          callback(
            value
          );

        };


    try {

      const runner =
        google.script.run
          .withSuccessHandler(
            finish(resolve)
          )
          .withFailureHandler(
            finish(reject)
          );

      invoke(
        runner
      );

    } catch (error) {

      finish(reject)(
        error
      );

    }

  });
}


function refreshCurrentPage(
  button

  const actionButton =
    button
      ? setActionWorking(

          'Refreshing...'

      : null;

  invalidateClientPage(

  loadPage(

    true,
    {
      generation:
        nextNavigationGeneration_(),
      reason: 'refresh',
      actionButton:

    }
  );
}

function getSafeErrorMessage_(
  error
) {

  const message =

  if (
    !message ||
    /password|token|secret|credential/i.test(
      message
    )
  ) {
    return 'Request failed. See browser console for diagnostics.';
  }

  return message;
}


/*******************************************************
 * RENDER ROUTER
 *******************************************************/

function getPageRenderer_(pageKey) {
  const render = window[PAGE_RENDERER_FUNCTIONS[pageKey]];
  if (typeof render !== 'function') throw new Error('Page renderer is unavailable: ' + pageKey);
  return render;
}

function renderPage(pageKey, data, trace) {
  destroyActiveTables();
  currentPageData = data;
  renderedPageKey = pageKey;
  const started = nowClient_();
  getPageRenderer_(pageKey)(data);
  if (trace) {
    trace.shell = nowClient_() - started;
    trace.shellReady = true;
    finishPagePerformanceAfterPaint_(trace);
  }
}

function pageStructureSignature_(data) {
  data = data || {};
  return JSON.stringify({
    pageKey: data.pageKey, headers: data.headers, permission: data.permission,
    credentials: data.credentialColumns, hasCredentials: data.hasCredentials,
    options: data.controlledOptions,
    integrationControls: [data.integration, data.monitoring].map(item => item && [
      item.enabled, item.configurationComplete, item.canSync, item.canRefresh
    ]),
    workflowReference: data.workflows && [data.groups, data.tiers, data.ticketSteps, data.priorities],
    sections: (data.sections || []).map(section => {
      const shape = Object.assign({}, section);
      delete shape.rows;
      delete shape.totalCount;
      shape.paginated = (section.rows || []).length > 15;
      return shape;
    })
  });
}


function destroyActiveTables() {
  if (tableInstance) activeAppTables.add(tableInstance);
  if (window.workflowMatrixInstance) activeAppTables.add(window.workflowMatrixInstance);
  Object.values(structuredTables).forEach(table => activeAppTables.add(table));
  activeAppTables.forEach(table => { try { table.destroy(); } catch (error) {} });
  activeAppTables.clear();
  tableInstance = null;
  window.workflowMatrixInstance = null;
  Object.keys(structuredTables).forEach(key => delete structuredTables[key]);
  currentTableData = null;
  currentStructuredData = null;
  renderedPageKey = '';
}

    runner =>

      /*
       * EXISTING WORKING FUNCTION IN Code.gs.
       * DO NOT CHANGE THE ARUBA API IMPLEMENTATION.
       */
      runner.syncArubaCentralToSheet()
  )
    .then(function(result) {
        invalidateClientPage(
          'switches'
        );


        invalidateClientPage(
          'accessPoints'
        );


        clientPageCache.delete(
          'dashboard'
        );

        setActionSuccess(
          actionButton,
          'Synced'
        );

        showToast(

          'Central sync complete: ' +

          (
            result.switchesSynced || 0
          ) +

          ' switches, ' +

          (
            result.apsSynced || 0
          ) +

          ' APs.'

        );


        loadPage(
          currentPageKey,
          true
        );

    })
    .catch(function(error) {
      setActionError(
        actionButton,
        'Sync Failed'
      );
      handleFailure(
        error,
        'Aruba Central sync'
      );
    });
}

/*******************************************************
 * STATUS
 *******************************************************/

function isStatusColumn(
  header
) {

  const value =
    String(header || '')
      .toLowerCase();


  return (
    value === 'status' ||
    value.includes('installed') ||
    value.includes('update?') ||
    value === 'tier'
  );
}


function statusPill(
  value
) {

  const original =
    String(
      value ?? ''
    ).trim();


  const normalized =
    original.toLowerCase();


  const success = [
    'up',
    'online',
    'operational',
    'normal',
    'healthy',
    'active',
    'true',
    'yes',
    'installed',
    'success',
    'successful',
    'completed',
    'configured',
    'enabled',
    'connected',
    'synced',
    'available'
  ];


  const danger = [
    'down',
    'offline',
    'failed',
    'failure',
    'false',
    'not installed',
    'critical',
    'inactive',
    'error',
    'missing',
    'not configured',
    'connection failed',
    'sync failed'
  ];


  const warning = [
    'warning',
    'needs attention',
    'degraded',
    'maintenance',
    'paused',
    'needs update',
    'pending',
    'not synced',
    'testing',
    'syncing',
    'disabled',
    'partial'
  ];


  let className =
    'status-neutral';


  let icon =
    'fa-circle';


  if (
    success.includes(
      normalized
    )
  ) {

    className =
      'status-success';

    icon =
      'fa-circle-check';

  } else if (
    danger.includes(
      normalized
    )
  ) {

    className =
      'status-danger';

    icon =
      'fa-circle-xmark';

  } else if (
    warning.includes(
      normalized
    )
  ) {

    className =
      'status-warning';

    icon =
      'fa-triangle-exclamation';

  } else if (
    normalized.startsWith(
      'tier '
    )
  ) {

    className =
      'status-info';

    icon =
      'fa-layer-group';

  }


  return `

    <span
      class="status-pill ${className}"
    >

      <i class="fa-solid ${icon}"></i>

      ${escapeHtml(
        original || 'Unknown'
      )}

    </span>

  `;
}


/*******************************************************
 * ERROR / TOAST
 *******************************************************/

function handleFailure(
  error,
  context
) {

  console.error(
    'Network Dashboard request failed:',
    context || 'unknown operation',
    error
  );


  showToast(
    getSafeErrorMessage_(
      error
    ),
    true
  );
}


function showToast(
  message,
  error
) {

  const container =
    document.getElementById(
      'toastContainer'
    );


  const toast =
    document.createElement(
      'div'
    );


  toast.className =
    'app-toast';


  if (error) {

    toast.style.background =
      '#8e2929';

  }


  toast.textContent =
    message;


  container.appendChild(
    toast
  );


  setTimeout(
    function() {

      toast.remove();

    },
    4000
  );
}


/*******************************************************
 * ESCAPING
 *******************************************************/

function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )
    .replaceAll(
      '&',
      '&amp;'
    )
    .replaceAll(
      '<',
      '&lt;'
    )
    .replaceAll(
      '>',
      '&gt;'
    )
    .replaceAll(
      '"',
      '&quot;'
    )
    .replaceAll(
      "'",
      '&#039;'
    );
}


function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );
}


function safeJson(
  value
) {

  return JSON
    .stringify(value)
    .replace(
      /</g,
      '\\u003c'
    )
    .replace(
      />/g,
      '\\u003e'
    )
    .replace(
      /&/g,
      '\\u0026'
    );
}


function beginPagePerformance_(pageKey, generation, cache) {
  return { pageKey: pageKey, generation: generation, cache: cache,
    started: nowClient_(), navigationStart: Date.now(), pendingTables: 0 };
}

function finishPagePerformanceAfterPaint_(trace) {
  runAfterNextPaint_(function() {
    if (!trace || trace.finished || trace.failed || !trace.shellReady ||
        trace.pendingTables || !isActivePageRequest_(trace.pageKey, trace.generation)) return;
    trace.finished = true;
    const report = { pageKey: trace.pageKey, cache: trace.cache,
      navigationStart: trace.navigationStart, update: trace.update || 'render' };
    ['renderer', 'roundTrip', 'dataReceived', 'shell', 'tableInit', 'tableBuilt', 'tableRender'].forEach(key => {
      report[key] = Math.round(trace[key] || 0);
    });
    report.total = Math.round(nowClient_() - trace.started);
    report.server = trace.server || null;
    const history = window.networkDashboardPerformance || (window.networkDashboardPerformance = []);
    history.push(report);
    if (history.length > 60) history.shift();
    logClientPerformance_(trace.pageKey, 'cache=' + report.cache + ' ' +
      ['renderer', 'roundTrip', 'dataReceived', 'shell', 'tableInit', 'tableBuilt', 'tableRender', 'total']
        .map(key => key + '=' + report[key] + 'ms').join(' ') + ' update=' + report.update);
    if (report.server) console.log('[Performance][' + trace.pageKey + '][server]', report.server);
    scheduleUptimeRobotStartupRefresh_();
  });
}

function createAppTable_(host, options) {
  const trace = activePagePerformance;
  const started = nowClient_();
  if (trace && !trace.finished) trace.pendingTables += 1;
  // Tabulator 6.3 has no per-column "movable" option. Keep action columns
  // anchored with the supported columnMoved event instead.
  const fixedFields = (options.columns || []).filter(column => column.movable === false).map(column => column.field);
  options.columns = (options.columns || []).map(column => {
    const definition = Object.assign({}, column);
    delete definition.movable;
    return definition;
  });
  const table = new Tabulator(host, options);
  if (fixedFields.length) {
    let restoringOrder = false;
    table.on('columnMoved', function() {
      if (restoringOrder) return;
      const columns = table.getColumns();
      const fixed = columns.filter(column => fixedFields.includes(column.getField()));
      const movable = columns.filter(column => !fixedFields.includes(column.getField()));
      if (!fixed.length || !movable.length) return;
      if (fixed.every((column, index) => columns[columns.length - fixed.length + index] === column)) return;
      restoringOrder = true;
      let anchor = movable[movable.length - 1];
      fixed.forEach(column => { column.move(anchor, true); anchor = column; });
      restoringOrder = false;
    });
  }
  activeAppTables.add(table);
  table.on('tableDestroyed', function() { activeAppTables.delete(table); });
  if (trace && !trace.finished) {
    trace.tableInit = (trace.tableInit || 0) + nowClient_() - started;
    table.on('tableBuilt', function() {
      trace.tableBuilt = Math.max(trace.tableBuilt || 0, nowClient_() - started);
    });
    let renderStarted = started;
    table.on('renderStarted', function() { renderStarted = nowClient_(); });
    const rendered = function() {
      table.off('renderComplete', rendered);
      trace.tableRender = Math.max(trace.tableRender || 0, nowClient_() - renderStarted);
      trace.pendingTables = Math.max(0, trace.pendingTables - 1);
      finishPagePerformanceAfterPaint_(trace);
    };
    table.on('renderComplete', rendered);
  }
  return table;
}

async function replaceTableRows_(table, rows) {
  const holder = table.element.querySelector('.tabulator-tableholder');
  const scrollers = [holder, document.getElementById('main'), document.scrollingElement]
    .filter(Boolean).map(element => ({ element: element, top: element.scrollTop, left: element.scrollLeft }));
  const widths = table.getColumns().map(column => ({ column: column, width: column.getWidth() }));
  const page = table.options.pagination ? table.getPage() : false;
  await table.replaceData(rows || []);
  if (!activeAppTables.has(table)) return;
  const targetPage = page && Math.min(page, table.getPageMax());
  if (targetPage && table.getPage() !== targetPage) await table.setPage(targetPage);
  widths.forEach(item => {
    if (item.width > 0 && item.column.getWidth() !== item.width) item.column.setWidth(item.width);
  });
  scrollers.forEach(scroll => {
    if (!scroll.element.isConnected) return;
    scroll.element.scrollTop = scroll.top;
    scroll.element.scrollLeft = scroll.left;
  });
}
