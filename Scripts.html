<script>

/*******************************************************
 * CONFIGURATION
 *******************************************************/


/*
 * Browser cache lifetime.
 *
 * 5 minutes means clicking back to a page you've already
 * visited does NOT make another Apps Script request.
 */
const CLIENT_CACHE_TTL_MS =
  5 * 60 * 1000;


/*******************************************************
 * STATE
 *******************************************************/

let appBootstrap =
  null;


let currentPageKey =
  'dashboard';


let currentPageData =
  null;


let currentTableData =
  null;


let currentStructuredData =
  null;


let currentHeaders =
  [];


let tableInstance =
  null;


let editingRow =
  null;


let recordModal =
  null;


let configModal =
  null;


const clientPageCache =
  new Map();


const structuredTables =
  {};


const PAGE_RENDERER_FUNCTIONS = {
  dashboard: 'renderDashboard',
  table: 'renderTablePage',
  internetWan: 'renderInternetWanPage',
  structured: 'renderStructuredPage',
  workflow: 'renderWorkflowPage',
  users: 'renderUsersPage',
  settings: 'renderSettingsPage'
};


const loadedPageRendererTypes = {
  dashboard: true
};


const SCRIPT_RUN_TIMEOUT_MS =
  60000;


/*******************************************************
 * STARTUP
 *******************************************************/

window.addEventListener(
  'DOMContentLoaded',
  function() {


    recordModal =
      new bootstrap.Modal(
        document.getElementById(
          'recordModal'
        )
      );


    configModal =
      new bootstrap.Modal(
        document.getElementById(
          'configModal'
        )
      );


    if (window.INITIAL_APP_BOOTSTRAP) {

      try {

        initializeApplication(
          window.INITIAL_APP_BOOTSTRAP
        );

      } catch (error) {

        showBootstrapError(
          error
        );

        handleFailure(
          error,
          'initial bootstrap'
        );

      }

      return;
    }


    getBootstrapPromise_()
      .then(
        initializeApplication
      )
      .catch(function(error) {

        showBootstrapError(
          error
        );

        handleFailure(
          error,
          'bootstrap'
        );

      });

  }
);


/*******************************************************
 * APP INITIALIZATION
 *******************************************************/

function initializeApplication(
  data
) {

  applyBootstrapShell(
    data
  );


  navigateTo(
    'dashboard'
  );
}


function applyBootstrapShell(
  data
) {

  data =
    data || {};

  appBootstrap =
    data;


  applyBranding(
    data.config || {}
  );


  const user =
    data.user || {};

  document.getElementById(
    'sidebarUserName'
  ).textContent =
    user.name ||
    user.email ||
    '';


  document.getElementById(
    'sidebarUserRole'
  ).textContent =
    user.admin
      ? (
          user.breakglass
            ? 'Break-glass Administrator'
            : 'Administrator'
        )
      : 'Authorized User';


  const pages =
    data.pages || [];

  if (
    !pages.some(
      page =>
        page.key === currentPageKey
    )
  ) {
    currentPageKey =
      'dashboard';
  }


  buildNavigation(
    pages
  );
}


function applyBranding(
  config
) {

  config =
    config || {};

  const branding =
    config.branding || {};

  const organization =
    config.organization || {};

  const root =
    document.documentElement;

  const primary =
    branding.primaryColor || '#17345f';

  const secondary =
    branding.secondaryColor || '#0d2342';

  const accent =
    branding.accentColor || '#f4c430';


  root.style.setProperty(
    '--brand-primary',
    primary
  );

  root.style.setProperty(
    '--brand-secondary',
    secondary
  );

  root.style.setProperty(
    '--brand-accent',
    accent
  );

  root.style.setProperty(
    '--navy-800',
    primary
  );

  root.style.setProperty(
    '--navy-900',
    secondary
  );

  root.style.setProperty(
    '--gold',
    accent
  );


  document.title =
    config.appName ||
    'Network Dashboard';


  const brandTitle =
    document.getElementById(
      'brandTitle'
    );

  if (brandTitle) {
    brandTitle.textContent =
      (
        organization.shortName ||
        config.appName ||
        'Network Dashboard'
      ).toUpperCase();
  }


  const brandSubtitle =
    document.getElementById(
      'brandSubtitle'
    );

  if (brandSubtitle) {
    brandSubtitle.textContent =
      'INFRASTRUCTURE';
  }


  const eyebrow =
    document.getElementById(
      'pageEyebrow'
    );

  if (eyebrow) {
    eyebrow.textContent =
      (
        organization.name ||
        config.appName ||
        'Network Dashboard'
      ).toUpperCase();
  }


  const logo =
    document.getElementById(
      'brandLogo'
    );

  const fallback =
    document.getElementById(
      'brandLogoFallback'
    );

  if (
    logo &&
    fallback
  ) {

    if (branding.logoUrl) {
      logo.src = branding.logoUrl;
      logo.hidden = false;
      fallback.hidden = true;
    } else {
      logo.hidden = true;
      fallback.hidden = false;
    }

  }
}


/*******************************************************
 * NAVIGATION
 *******************************************************/

function buildNavigation(
  pages
) {

  const container =
    document.getElementById(
      'navigation'
    );


  const groups =
    {};


  pages.forEach(
    page => {

      if (!groups[page.group]) {
        groups[page.group] = [];
      }


      groups[
        page.group
      ].push(page);

    }
  );


  container.innerHTML =
    '';


  Object.entries(groups)
    .forEach(
      ([group, groupPages]) => {

        const section =
          document.createElement(
            'div'
          );


        section.className =
          'nav-group';


        const title =
          document.createElement(
            'div'
          );


        title.className =
          'nav-group-title';


        title.textContent =
          group.toUpperCase();


        section.appendChild(
          title
        );


        groupPages.forEach(
          page => {

            const button =
              document.createElement(
                'button'
              );


            button.className =
              'app-nav-item' +
              (
                page.key === currentPageKey
                  ? ' active'
                  : ''
              );


            button.dataset.page =
              page.key;


            const icon =
              document.createElement(
                'i'
              );


            icon.className =
              'fa-solid ' +
              page.icon;


            const label =
              document.createElement(
                'span'
              );


            label.textContent =
              page.label;


            button.appendChild(
              icon
            );


            button.appendChild(
              label
            );


            button.addEventListener(
              'click',
              function() {

                navigateTo(
                  page.key
                );

              }
            );


            section.appendChild(
              button
            );

          }
        );


        container.appendChild(
          section
        );

      }
    );
}


function navigateTo(
  pageKey
) {

  if (
    !appBootstrap ||
    !appBootstrap.pages.some(
      page =>
        page.key === pageKey
    )
  ) {
    return;
  }


  currentPageKey =
    pageKey;


  document
    .querySelectorAll(
      '.app-nav-item'
    )
    .forEach(
      button => {

        button.classList.toggle(
          'active',
          button.dataset.page === pageKey
        );

      }
    );


  loadPage(
    pageKey,
    false
  );
}


/*******************************************************
 * CLIENT CACHE
 *******************************************************/

function getClientCache(
  pageKey
) {

  const entry =
    clientPageCache.get(
      pageKey
    );


  if (!entry) {
    return null;
  }


  if (
    Date.now() -
    entry.timestamp >
    CLIENT_CACHE_TTL_MS
  ) {

    clientPageCache.delete(
      pageKey
    );

    return null;

  }


  return entry.data;
}


function setClientCache(
  pageKey,
  data
) {

  clientPageCache.set(
    pageKey,
    {
      timestamp:
        Date.now(),

      data:
        data
    }
  );
}


function invalidateClientPage(
  pageKey
) {

  clientPageCache.delete(
    pageKey
  );


  if (
    pageKey !== 'dashboard'
  ) {

    clientPageCache.delete(
      'dashboard'
    );

  }
}


function closeRowActionMenu() {

  const menu =
    document.getElementById(
      'rowActionMenu'
    );


  if (menu) {
    menu.remove();
  }
}


/*******************************************************
 * PAGE LOADING
 *******************************************************/

function loadPage(
  pageKey,
  forceRefresh
) {

  closeRowActionMenu();


  const page =
    appBootstrap.pages.find(
      item =>
        item.key === pageKey
    );


  if (!page) {
    return;
  }


  const cached =
    forceRefresh ||
    !shouldClientCachePage_(
      pageKey
    )
      ? null
      : getClientCache(
          pageKey
        );


  if (cached) {

    Promise
      .all([
        ensurePageRendererPromise_(
          pageKey,
          page
        ),
        Promise.resolve(cached)
      ])
      .then(results => {

        if (currentPageKey !== pageKey) {
          return;
        }

        currentPageData =
          results[1];

        renderPage(
          pageKey,
          results[1]
        );

      })
      .catch(error => {

        if (currentPageKey === pageKey) {
          showPageError(
            pageKey,
            error
          );
        }

        handleFailure(
          error,
          'page load: ' + pageKey
        );

      });

    return;

  }


  showPageLoading();


  Promise
    .all([
      ensurePageRendererPromise_(
        pageKey,
        page
      ),
      getPageDataPromise_(
        pageKey,
        !!forceRefresh
      )
    ])
    .then(results => {

      if (currentPageKey !== pageKey) {
        return;
      }

      const data =
        results[1];

      if (
        shouldClientCachePage_(
          pageKey
        )
      ) {
        setClientCache(
          pageKey,
          data
        );
      }


      currentPageData =
        data;


      renderPage(
        pageKey,
        data
      );

    })
    .catch(error => {

      if (currentPageKey === pageKey) {
        showPageError(
          pageKey,
          error
        );
      }

      handleFailure(
        error,
        'page load: ' + pageKey
      );

    });
}


function shouldClientCachePage_(
  pageKey
) {

  return pageKey !== 'dashboard';
}


function getBootstrapPromise_() {

  return scriptRunPromise_(
    'getAppBootstrap',
    runner =>
      runner.getAppBootstrap()
  );
}


function getPageDataPromise_(
  pageKey,
  forceRefresh
) {

  return scriptRunPromise_(
    'appGetPageData:' + pageKey,
    runner =>
      runner.appGetPageData(
        pageKey,
        !!forceRefresh
      )
  );
}


function ensurePageRendererPromise_(
  pageKey,
  page
) {

  if (
    isPageRendererReady_(page)
  ) {

    loadedPageRendererTypes[page.type] =
      true;

    return Promise.resolve();

  }


  if (
    loadedPageRendererTypes[page.type]
  ) {
    return Promise.resolve();
  }


  return scriptRunPromise_(
    'appGetPageClientTemplate:' + pageKey,
    runner =>
      runner.appGetPageClientTemplate(
        pageKey
      )
  )
    .then(function(html) {

        try {

          installPageRendererTemplate_(
            html
          );

          if (
            !isPageRendererReady_(page)
          ) {
            throw new Error(
              'Page renderer failed to load: ' +
                page.type
            );
          }

          loadedPageRendererTypes[page.type] =
            true;

          return true;

        } catch (error) {

          throw error;

        }

    });
}


function scriptRunPromise_(
  label,
  invoke,
  timeoutMs
) {

  return new Promise((resolve, reject) => {

    let settled =
      false;

    const timer =
      setTimeout(
        function() {

          if (settled) {
            return;
          }

          settled =
            true;

          reject(
            new Error(
              label +
              ' timed out.'
            )
          );

        },
        timeoutMs ||
          SCRIPT_RUN_TIMEOUT_MS
      );


    const finish =
      callback =>
        value => {

          if (settled) {
            return;
          }

          settled =
            true;

          clearTimeout(
            timer
          );

          callback(
            value
          );

        };


    try {

      const runner =
        google.script.run
          .withSuccessHandler(
            finish(resolve)
          )
          .withFailureHandler(
            finish(reject)
          );

      invoke(
        runner
      );

    } catch (error) {

      finish(reject)(
        error
      );

    }

  });
}


function isPageRendererReady_(
  page
) {

  const functionName =
    PAGE_RENDERER_FUNCTIONS[
      page.type
    ];

  return (
    !functionName ||
    typeof window[functionName] === 'function'
  );
}


function installPageRendererTemplate_(
  html
) {

  const wrapper =
    document.createElement(
      'div'
    );

  wrapper.innerHTML =
    html || '';


  wrapper
    .querySelectorAll(
      'script'
    )
    .forEach(source => {

      const script =
        document.createElement(
          'script'
        );

      script.textContent =
        source.textContent || '';

      document.body.appendChild(
        script
      );

      source.remove();

    });
}


function refreshCurrentPage() {

  invalidateClientPage(
    currentPageKey
  );


  loadPage(
    currentPageKey,
    true
  );
}


/*******************************************************
 * LOADING
 *******************************************************/

function showPageLoading() {

  document.getElementById(
    'pageContent'
  ).innerHTML = `

    <div class="app-loading">

      <div
        class="spinner-border spinner-border-sm"
      ></div>

      <span>
        Loading...
      </span>

    </div>

  `;


  document.getElementById(
    'pageActions'
  ).innerHTML =
    '';
}


function showBootstrapError(
  error
) {

  setPageHeader(
    'Unable to Start',
    'Network Dashboard could not initialize.'
  );

  showPageErrorPanel_(
    'Unable to load Network Dashboard',
    error,
    'location.reload()'
  );
}


function showPageError(
  pageKey,
  error
) {

  const page =
    appBootstrap &&
    appBootstrap.pages
      ? appBootstrap.pages.find(item =>
          item.key === pageKey
        )
      : null;

  const label =
    page && page.label
      ? page.label
      : 'this page';

  showPageErrorPanel_(
    'Unable to load ' + label,
    error,
    "loadPage('" +
      escapeAttribute(pageKey) +
      "', true)"
  );
}


function showPageErrorPanel_(
  title,
  error,
  retryAction
) {

  const content =
    document.getElementById(
      'pageContent'
    );

  if (!content) {
    return;
  }

  content.innerHTML = `
    <div class="app-card page-error-card">
      <div class="page-error-icon">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <div class="page-error-body">
        <h2>${escapeHtml(title)}</h2>
        <p>
          Network Dashboard could not retrieve the requested information.
        </p>
        <div class="page-error-detail">
          ${escapeHtml(getSafeErrorMessage_(error))}
        </div>
        <button
          class="btn btn-sm btn-brand"
          onclick="${retryAction}"
        >
          <i class="fa-solid fa-rotate me-2"></i>
          Retry
        </button>
      </div>
    </div>
  `;
}


function getSafeErrorMessage_(
  error
) {

  const message =
    error &&
    error.message
      ? error.message
      : String(
          error ||
          'Unknown error'
        );

  if (
    !message ||
    /password|token|secret|credential/i.test(
      message
    )
  ) {
    return 'Request failed. See browser console for diagnostics.';
  }

  return message;
}


/*******************************************************
 * RENDER ROUTER
 *******************************************************/

function renderPage(
  pageKey,
  data
) {

  destroyActiveTables();


  const page =
    appBootstrap.pages.find(
      item =>
        item.key === pageKey
    );


  if (!page) {
    return;
  }


  if (
    page.type === 'dashboard'
  ) {

    renderDashboard(
      data
    );

    return;

  }


  if (
    page.type === 'workflow'
  ) {

    renderWorkflowPage(
      data
    );

    return;

  }


  if (
    page.type === 'internetWan'
  ) {

    renderInternetWanPage(
      data
    );

    return;

  }


  if (
    page.type === 'users'
  ) {

    renderUsersPage(
      data
    );

    return;

  }


  if (
    page.type === 'settings'
  ) {

    renderSettingsPage(
      data
    );

    return;

  }


  if (
    page.type === 'structured'
  ) {

    renderStructuredPage(
      data
    );

    return;

  }


  renderTablePage(
    data
  );
}


function destroyActiveTables() {

  if (tableInstance) {

    try {
      tableInstance.destroy();
    } catch (error) {}


    tableInstance =
      null;

  }


  Object.keys(
    structuredTables
  ).forEach(
    key => {

      try {

        structuredTables[
          key
        ].destroy();

      } catch (error) {}

    }
  );


  Object.keys(
    structuredTables
  ).forEach(
    key => {

      delete structuredTables[
        key
      ];

    }
  );
}


/*******************************************************
 * HEADER
 *******************************************************/

function setPageHeader(
  title,
  subtitle
) {

  document.getElementById(
    'pageTitle'
  ).textContent =
    title || '';


  document.getElementById(
    'pageSubtitle'
  ).textContent =
    subtitle || '';
}


/*******************************************************
 * STANDARD RECORD EDITOR
 *******************************************************/

function openAddRecord() {

  editingRow =
    null;


  openRecordModal(
    'Add Record',
    {}
  );
}


function openEditRecord(
  row
) {

  editingRow =
    row;


  openRecordModal(
    'Edit Record',
    row
  );
}


function openRecordModal(
  title,
  record
) {

  document.getElementById(
    'recordModalTitle'
  ).textContent =
    title;


  const body =
    document.getElementById(
      'recordModalBody'
    );


  body.innerHTML =
    '';


  const row =
    document.createElement(
      'div'
    );


  row.className =
    'row g-3';


  currentHeaders.forEach(
    (header, index) => {

      const column =
        document.createElement(
          'div'
        );


      column.className =
        'col-md-6';


      const label =
        document.createElement(
          'label'
        );


      label.className =
        'form-label';


      label.textContent =
        header.toUpperCase();


      const input =
        document.createElement(
          'input'
        );


      input.className =
        'form-control';


      input.dataset.header =
        header;


      input.id =
        'recordField_' +
        index;


      input.value =
        record[header] || '';


      column.appendChild(
        label
      );


      column.appendChild(
        input
      );


      row.appendChild(
        column
      );

    }
  );


  body.appendChild(
    row
  );


  document.getElementById(
    'saveRecordButton'
  ).onclick =
    saveRecordFromModal;


  recordModal.show();
}


function saveRecordFromModal() {

  const record =
    {};


  document
    .querySelectorAll(
      '#recordModalBody [data-header]'
    )
    .forEach(
      input => {

        record[
          input.dataset.header
        ] =
          input.value;

      }
    );


  const runner =
    google.script.run

      .withSuccessHandler(
        function() {

          recordModal.hide();


          invalidateClientPage(
            currentPageKey
          );


          loadPage(
            currentPageKey,
            true
          );


          showToast(
            'Record saved.'
          );

        }
      )

      .withFailureHandler(
        handleFailure
      );


  if (editingRow) {

    runner.appUpdateRecord(
      currentPageKey,
      editingRow._row,
      record,
      editingRow._sourceSheet || ''
    );

  } else {

    runner.appAddRecord(
      currentPageKey,
      record
    );

  }
}


function confirmDeleteRecord(
  row
) {

  if (
    !confirm(
      'Delete this record permanently?'
    )
  ) {

    return;

  }


  google.script.run

    .withSuccessHandler(
      function() {

        invalidateClientPage(
          currentPageKey
        );


        loadPage(
          currentPageKey,
          true
        );


        showToast(
          'Record deleted.'
        );

      }
    )

    .withFailureHandler(
      handleFailure
    )

    .appDeleteRecord(
      currentPageKey,
      row._row,
      row._sourceSheet || ''
    );
}


/*******************************************************
 * ARUBA
 *******************************************************/

function runCentralSync() {

  showToast(
    'Synchronizing with Aruba Central...'
  );


  google.script.run

    .withSuccessHandler(
      function(result) {

        invalidateClientPage(
          'switches'
        );


        invalidateClientPage(
          'accessPoints'
        );


        clientPageCache.delete(
          'dashboard'
        );


        showToast(

          'Central sync complete: ' +

          (
            result.switchesSynced || 0
          ) +

          ' switches, ' +

          (
            result.apsSynced || 0
          ) +

          ' APs.'

        );


        loadPage(
          currentPageKey,
          true
        );

      }
    )

    .withFailureHandler(
      handleFailure
    )

    /*
     * EXISTING WORKING FUNCTION IN Code.gs.
     * DO NOT CHANGE THE ARUBA API IMPLEMENTATION.
     */
    .syncArubaCentralToSheet();
}


function viewRunningConfig(
  serial
) {

  document.getElementById(
    'configDisplay'
  ).textContent =
    'Retrieving configuration from Aruba Central...';


  configModal.show();


  google.script.run

    .withSuccessHandler(
      function(result) {

        document.getElementById(
          'configDisplay'
        ).textContent =
          result.status === 'success'
            ? result.config
            : result.message;

      }
    )

    .withFailureHandler(
      handleFailure
    )

    .fetchSwitchRunningConfig(
      serial
    );
}


/*******************************************************
 * STATUS
 *******************************************************/

function isStatusColumn(
  header
) {

  const value =
    String(header || '')
      .toLowerCase();


  return (
    value === 'status' ||
    value.includes('installed') ||
    value.includes('update?') ||
    value === 'tier'
  );
}


function statusPill(
  value
) {

  const original =
    String(
      value ?? ''
    ).trim();


  const normalized =
    original.toLowerCase();


  const success = [
    'up',
    'online',
    'operational',
    'normal',
    'healthy',
    'active',
    'true',
    'yes',
    'installed',
    'success',
    'successful',
    'completed',
    'configured',
    'available'
  ];


  const danger = [
    'down',
    'offline',
    'failed',
    'failure',
    'false',
    'not installed',
    'critical',
    'inactive',
    'error',
    'missing',
    'not configured'
  ];


  const warning = [
    'warning',
    'needs attention',
    'degraded',
    'needs update',
    'pending',
    'partial'
  ];


  let className =
    'status-neutral';


  let icon =
    'fa-circle';


  if (
    success.includes(
      normalized
    )
  ) {

    className =
      'status-success';

    icon =
      'fa-circle-check';

  } else if (
    danger.includes(
      normalized
    )
  ) {

    className =
      'status-danger';

    icon =
      'fa-circle-xmark';

  } else if (
    warning.includes(
      normalized
    )
  ) {

    className =
      'status-warning';

    icon =
      'fa-triangle-exclamation';

  } else if (
    normalized.startsWith(
      'tier '
    )
  ) {

    className =
      'status-info';

    icon =
      'fa-layer-group';

  }


  return `

    <span
      class="status-pill ${className}"
    >

      <i class="fa-solid ${icon}"></i>

      ${escapeHtml(
        original || 'Unknown'
      )}

    </span>

  `;
}


/*******************************************************
 * ERROR / TOAST
 *******************************************************/

function handleFailure(
  error,
  context
) {

  console.error(
    'Network Dashboard request failed:',
    context || 'unknown operation',
    error
  );


  showToast(
    getSafeErrorMessage_(
      error
    ),
    true
  );
}


function showToast(
  message,
  error
) {

  const container =
    document.getElementById(
      'toastContainer'
    );


  const toast =
    document.createElement(
      'div'
    );


  toast.className =
    'app-toast';


  if (error) {

    toast.style.background =
      '#8e2929';

  }


  toast.textContent =
    message;


  container.appendChild(
    toast
  );


  setTimeout(
    function() {

      toast.remove();

    },
    4000
  );
}


/*******************************************************
 * ESCAPING
 *******************************************************/

function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )
    .replaceAll(
      '&',
      '&amp;'
    )
    .replaceAll(
      '<',
      '&lt;'
    )
    .replaceAll(
      '>',
      '&gt;'
    )
    .replaceAll(
      '"',
      '&quot;'
    )
    .replaceAll(
      "'",
      '&#039;'
    );
}


function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );
}


function safeJson(
  value
) {

  return JSON
    .stringify(value)
    .replace(
      /</g,
      '\\u003c'
    )
    .replace(
      />/g,
      '\\u003e'
    )
    .replace(
      /&/g,
      '\\u0026'
    );
}
