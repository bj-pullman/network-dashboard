<script>

let settingsSaveInProgress =
  false;


function renderSettingsPage(data) {

  currentPageData =
    data;

  setPageHeader(
    'Settings',
    'Instance configuration, modules, branding, user policy and integrations'
  );

  document.getElementById('pageActions').innerHTML = `

    <button
      type="button"
      class="btn btn-sm btn-brand"
      onclick="saveSettingsForm(this)"
    >
      <i class="fa-solid fa-floppy-disk me-2"></i>
      Save Settings
    </button>

    <button
      type="button"
      class="btn btn-sm btn-light border"
      onclick="runSettingsValidation(this)"
    >
      <i class="fa-solid fa-shield-halved me-2"></i>
      Validate
    </button>

    <button
      type="button"
      class="btn btn-sm btn-light border"
      onclick="refreshCurrentPage(this)"
    >
      <i class="fa-solid fa-rotate me-2"></i>
      Refresh
    </button>
  `;

  const values =
    (data.settings && data.settings.values) || {};

  const integrations =
    data.integrations || [];

  const modules =
    data.modules || [];

  document.getElementById('pageContent').innerHTML = `

    <div class="settings-layout">

      <section class="app-card settings-panel">

        <div class="card-header-clean">
          <div>
            <h2 class="card-title-clean">General</h2>
            <div class="settings-card-subtitle">
              Application and organization identity.
            </div>
          </div>
        </div>

        <div class="settings-grid">
          ${settingsTextField('app.name', 'Application Name', values)}
          ${settingsTextField('organization.name', 'Organization Name', values)}
          ${settingsTextField('organization.short_name', 'Organization Short Name', values)}
          ${settingsTextField('app.web_app_url', 'Web App URL', values)}
        </div>

      </section>


      ${renderModuleSection(modules)}


      <section class="app-card settings-panel">

        <div class="card-header-clean">
          <div>
            <h2 class="card-title-clean">Branding</h2>
            <div class="settings-card-subtitle">
              Logo and colors used by the web application.
            </div>
          </div>
        </div>

        <div class="settings-grid">
          ${settingsTextField('branding.logo_url', 'Logo URL', values)}
          ${settingsColorField('branding.primary_color', 'Primary Color', values)}
          ${settingsColorField('branding.secondary_color', 'Secondary Color', values)}
          ${settingsColorField('branding.accent_color', 'Accent Color', values)}
        </div>

        <div
          id="settingsBrandPreview"
          class="settings-brand-preview"
        >
          <div class="settings-preview-mark">
            <img
              id="settingsPreviewLogo"
              class="settings-preview-logo"
              alt=""
              hidden
            >
            <i
              id="settingsPreviewFallbackIcon"
              class="fa-solid fa-network-wired"
            ></i>
          </div>
          <div>
            <div
              id="settingsPreviewTitle"
              class="settings-preview-title"
            >
              ${escapeHtml(values['organization.short_name'] || values['app.name'] || 'Network Dashboard')}
            </div>
            <div
              id="settingsPreviewSubtitle"
              class="settings-preview-subtitle"
            >
              Network infrastructure overview
            </div>
          </div>
        </div>

      </section>


      <section class="app-card settings-panel">

        <div class="card-header-clean">
          <div>
            <h2 class="card-title-clean">Regional</h2>
            <div class="settings-card-subtitle">
              Timezone and display preferences.
            </div>
          </div>
        </div>

        <div class="settings-grid">
          ${settingsTextField('regional.timezone', 'Timezone', values)}
          ${settingsSelectField('regional.date_format', 'Date Format', values, ['yyyy-MM-dd', 'MM/dd/yyyy', 'dd/MM/yyyy'])}
          ${settingsSelectField('regional.time_format', 'Time Format', values, ['HH:mm', 'h:mm a'])}
        </div>

      </section>


      <section class="app-card settings-panel">

        <div class="card-header-clean">
          <div>
            <h2 class="card-title-clean">User Policy</h2>
            <div class="settings-card-subtitle">
              Optional domain restriction for newly added users.
            </div>
          </div>
        </div>

        <div class="settings-grid">
          ${settingsBooleanField('users.domain_restriction_enabled', 'Restrict users to one domain', values)}
          ${settingsTextField('users.allowed_domain', 'Allowed Email Domain', values)}
        </div>

      </section>


      <section class="app-card settings-panel">

        <div class="card-header-clean">
          <div>
            <h2 class="card-title-clean">Integrations</h2>
            <div class="settings-card-subtitle">
              Integration status and non-secret configuration.
            </div>
          </div>
        </div>

        <div class="integration-help">
          Add credentials in Apps Script -> Project Settings -> Script Properties.
          Property names are case-sensitive. Secret values are never shown here.
        </div>

        <div class="integration-list">
          ${integrations.map(renderIntegrationCard).join('')}
        </div>

      </section>


      <section class="app-card settings-panel">

        <div class="card-header-clean">
          <div>
            <h2 class="card-title-clean">Validation</h2>
            <div class="settings-card-subtitle">
              Run an installation health check without changing data.
            </div>
          </div>
        </div>

        <pre id="settingsValidationOutput" class="settings-validation-output">Validation has not been run in this session.</pre>

      </section>

    </div>
  `;

  attachSettingsPreviewHandlers_();
  updateSettingsBrandPreview_();
}


function renderModuleSection(modules) {

  if (
    !modules.length
  ) {
    return '';
  }


  return `
    <section class="app-card settings-panel">

      <div class="card-header-clean">
        <div>
          <h2 class="card-title-clean">Modules</h2>
          <div class="settings-card-subtitle">
            Optional pages and backing sheets preserved when disabled.
          </div>
        </div>
      </div>

      <div class="module-list">
        ${modules.map(renderModuleCard).join('')}
      </div>

    </section>
  `;
}


function renderModuleCard(module) {

  const sheets =
    module.requiredSheets || [];

  const sheetLabel =
    sheets.length
      ? sheets.join(', ')
      : 'No managed sheet';

  return `
    <article class="module-card">

      <label class="module-toggle">
        <input
          type="checkbox"
          data-setting-key="${escapeAttribute(module.settingKey)}"
          ${module.enabled ? 'checked' : ''}
        >
        <span>Enabled</span>
      </label>

      <div class="module-card-body">
        <div class="module-card-title-row">
          <h3>${escapeHtml(module.name)}</h3>
          ${statusPill(module.enabled ? 'Active' : 'Inactive')}
        </div>

        <p>${escapeHtml(module.description || '')}</p>

        <div class="module-meta">
          <span>
            <i class="fa-solid fa-compass"></i>
            ${escapeHtml(module.navigationTarget || module.pageKey || 'No navigation target')}
          </span>
          <span>
            <i class="fa-solid fa-table"></i>
            ${escapeHtml(sheetLabel)}
          </span>
        </div>
      </div>

    </article>
  `;
}


function settingsTextField(key, label, values) {

  return `
    <label class="settings-field">
      <span>${escapeHtml(label)}</span>
      <input
        class="form-control"
        data-setting-key="${escapeAttribute(key)}"
        value="${escapeAttribute(values[key] || '')}"
      >
    </label>
  `;
}


function settingsColorField(key, label, values) {

  const value =
    values[key] || '#17345f';

  return `
    <label class="settings-field">
      <span>${escapeHtml(label)}</span>
      <div class="settings-color-row">
        <input
          class="form-control form-control-color"
          type="color"
          data-setting-key="${escapeAttribute(key)}"
          value="${escapeAttribute(value)}"
          oninput="syncSettingsColorInputs(this)"
        >
        <input
          class="form-control"
          data-setting-key="${escapeAttribute(key)}"
          value="${escapeAttribute(value)}"
          oninput="syncSettingsColorInputs(this)"
        >
      </div>
    </label>
  `;
}


function syncSettingsColorInputs(input) {

  const wrapper =
    input.closest(
      '.settings-color-row'
    );

  if (!wrapper) {
    return;
  }

  const inputs =
    wrapper.querySelectorAll(
      'input[data-setting-key]'
    );

  inputs.forEach(item => {

    if (
      item !== input &&
      /^#[0-9a-fA-F]{6}$/.test(input.value)
    ) {
      item.value = input.value;
    }

  });

  updateSettingsBrandPreview_();
}


function settingsSelectField(key, label, values, options) {

  return `
    <label class="settings-field">
      <span>${escapeHtml(label)}</span>
      <select
        class="form-select"
        data-setting-key="${escapeAttribute(key)}"
      >
        ${options.map(option => `
          <option
            value="${escapeAttribute(option)}"
            ${values[key] === option ? 'selected' : ''}
          >
            ${escapeHtml(option)}
          </option>
        `).join('')}
      </select>
    </label>
  `;
}


function settingsBooleanField(key, label, values) {

  const checked =
    String(values[key] || '')
      .toLowerCase() === 'true';

  return `
    <label class="settings-switch-field">
      <input
        type="checkbox"
        data-setting-key="${escapeAttribute(key)}"
        ${checked ? 'checked' : ''}
      >
      <span>
        <strong>${escapeHtml(label)}</strong>
        <small>When enabled, User Management accepts only the configured domain.</small>
      </span>
    </label>
  `;
}


function renderIntegrationCard(integration) {

  const implementationLabel =
    integration.implementationStatus === 'available'
      ? 'Available'
      : integration.implementationStatus === 'partial'
        ? 'Partial'
        : integration.implementationStatus || 'Planned';

  const canRun =
    integration.configurationComplete;

  const canSync =
    integration.configurationComplete &&
    integration.enabled;

  return `
    <article class="integration-card">

      <div class="integration-card-main">
        <div>
          <div class="integration-card-title-row">
            <h3>${escapeHtml(integration.name)}</h3>
            ${statusPill(implementationLabel)}
            ${
              integration.configurationComplete
                ? statusPill('Configured')
                : statusPill('Missing')
            }
          </div>

          <p>${escapeHtml(integration.description || '')}</p>

          ${
            integration.capabilities &&
            integration.capabilities.length
              ? `
                <div class="integration-capability-list">
                  ${integration.capabilities.map(capability => `
                    <span>${escapeHtml(capability)}</span>
                  `).join('')}
                </div>
              `
              : ''
          }

          ${
            integration.notes
              ? `<div class="integration-note">${escapeHtml(integration.notes)}</div>`
              : ''
          }
        </div>

        <label class="integration-toggle">
          <input
            type="checkbox"
            ${integration.enabled ? 'checked' : ''}
            onchange="saveIntegrationEnabled('${escapeAttribute(integration.id)}', this.checked, this)"
          >
          <span>Enabled</span>
        </label>
      </div>

      <div class="integration-property-table">
        ${integration.requiredProperties.map(property => `
          <div>
            <code>${escapeHtml(property.key)}</code>
            ${
              property.configured
                ? statusPill('Configured')
                : statusPill('Missing')
            }
          </div>
        `).join('')}
      </div>

      ${renderIntegrationRuntimeSummary_(integration)}

      <div class="integration-actions">
        ${
          integration.supportsConnectionTest
            ? `
              <button
                type="button"
                class="btn btn-sm btn-light border"
                onclick="testSettingsIntegration('${escapeAttribute(integration.id)}', this, event)"
                ${canRun ? '' : 'disabled'}
              >
                <i class="fa-solid fa-plug-circle-check me-2"></i>
                Test
              </button>
            `
            : ''
        }

        ${
          integration.supportsSync
            ? `
              <button
                type="button"
                class="btn btn-sm btn-brand"
                onclick="syncSettingsIntegration('${escapeAttribute(integration.id)}', this, event)"
                ${canSync ? '' : 'disabled'}
              >
                <i class="fa-solid fa-cloud-arrow-down me-2"></i>
                Sync Now
              </button>
            `
            : ''
        }

        ${
          integration.hasOperationalPage &&
          integration.pageKey &&
          integration.enabled
            ? `
              <button
                type="button"
                class="btn btn-sm btn-light border"
                onclick="navigateTo('${escapeAttribute(integration.pageKey)}')"
              >
                <i class="fa-solid fa-arrow-up-right-from-square me-2"></i>
                Open
              </button>
            `
            : ''
        }

        <span class="integration-last-status">
          ${escapeHtml(integration.lastStatus || 'Not configured')}
          ${
            integration.lastSync
              ? ' - ' + escapeHtml(integration.lastSync)
              : ''
          }
        </span>
      </div>

    </article>
  `;
}


function renderIntegrationRuntimeSummary_(
  integration
) {

  const lastAttempt =
    integration.lastAttempt || '';

  const lastSuccessfulSync =
    integration.lastSuccessfulSync ||
    integration.lastSync ||
    '';

  return `
    <div class="integration-runtime-grid">
      <div>
        <span>Enabled</span>
        ${statusPill(integration.enabled ? 'Enabled' : 'Disabled')}
      </div>
      <div>
        <span>Connection</span>
        ${statusPill(formatIntegrationState_(integration.connectionStatus || 'unknown'))}
      </div>
      <div>
        <span>Data</span>
        ${statusPill(formatIntegrationState_(integration.dataStatus || 'not_synced'))}
      </div>
      <div>
        <span>Last Attempt</span>
        <strong>${escapeHtml(formatIntegrationTimestamp_(lastAttempt))}</strong>
      </div>
      <div>
        <span>Last Successful Sync</span>
        <strong>${escapeHtml(formatIntegrationTimestamp_(lastSuccessfulSync))}</strong>
      </div>
      <div>
        <span>Records</span>
        ${renderIntegrationRecordCounts_(integration)}
      </div>
      ${
        integration.latestError
          ? `
            <div class="integration-runtime-error">
              <span>Latest Error</span>
              <strong>${escapeHtml(integration.latestError)}</strong>
            </div>
          `
          : ''
      }
    </div>
  `;
}


function renderIntegrationRecordCounts_(
  integration
) {

  const counts =
    integration.recordCounts || {};

  if (integration.id === 'aruba_central') {
    return `
      <div class="integration-count-list">
        ${integrationCountButton_('Switches', counts.switches || 0, 'switches')}
        ${integrationCountButton_('APs', counts.accessPoints || 0, 'accessPoints')}
      </div>
    `;
  }

  if (
    integration.pageKey &&
    integration.recordCount !== undefined
  ) {
    return integrationCountButton_(
      String(integration.recordCount || 0),
      '',
      integration.pageKey
    );
  }

  const entries =
    Object.keys(counts)
      .filter(key =>
        counts[key] !== undefined &&
        counts[key] !== ''
      );

  if (!entries.length) {
    return `<strong>${escapeHtml(integration.recordCount || 0)}</strong>`;
  }

  return `
    <div class="integration-count-list">
      ${entries.map(key => `
        <span class="integration-count-chip">
          ${escapeHtml(formatIntegrationState_(key))}: ${escapeHtml(counts[key])}
        </span>
      `).join('')}
    </div>
  `;
}


function integrationCountButton_(
  label,
  value,
  pageKey
) {

  const text =
    value === ''
      ? label
      : label + ': ' + value;

  if (!pageKey) {
    return `
      <span class="integration-count-chip">
        ${escapeHtml(text)}
      </span>
    `;
  }

  return `
    <button
      type="button"
      class="integration-count-chip integration-count-button"
      onclick="navigateTo('${escapeAttribute(pageKey)}')"
    >
      ${escapeHtml(text)}
    </button>
  `;
}


function formatIntegrationState_(
  value
) {

  const text =
    String(value || '')
      .trim();

  if (!text) {
    return 'Unknown';
  }

  return text
    .replace(/([a-z])([A-Z])/g, '$1 $2')
    .replace(/[_-]+/g, ' ')
    .replace(/\b\w/g, letter =>
      letter.toUpperCase()
    );
}


function formatIntegrationTimestamp_(
  value
) {

  const text =
    String(value || '')
      .trim();

  if (!text) {
    return 'Never';
  }

  try {
    return new Date(text).toLocaleString();
  } catch (error) {
    return text;
  }
}


function attachSettingsPreviewHandlers_() {

  document
    .querySelectorAll(
      '[data-setting-key]'
    )
    .forEach(input => {

      input.addEventListener(
        'input',
        handleSettingsFormInput_
      );

      input.addEventListener(
        'change',
        handleSettingsFormInput_
      );

    });
}


function handleSettingsFormInput_() {

  updateSettingsBrandPreview_();
}


function collectSettingsFormValues_() {

  const values = {};

  document
    .querySelectorAll('[data-setting-key]')
    .forEach(input => {

      const key =
        input.dataset.settingKey;

      if (!key) {
        return;
      }

      if (input.type === 'checkbox') {
        values[key] =
          input.checked
            ? 'true'
            : 'false';
      } else {
        values[key] =
          input.value;
      }

    });

  return values;
}


function normalizeSettingsPreviewColor_(
  value,
  fallback
) {

  const text =
    String(value || '').trim();

  return /^#[0-9a-fA-F]{6}$/.test(text)
    ? text
    : fallback;
}


function updateSettingsBrandPreview_() {

  const preview =
    document.getElementById(
      'settingsBrandPreview'
    );

  if (!preview) {
    return;
  }

  const values =
    collectSettingsFormValues_();

  const title =
    values['organization.short_name'] ||
    values['app.name'] ||
    'Network Dashboard';

  const subtitle =
    values['organization.name'] ||
    'Network infrastructure overview';

  preview.style.setProperty(
    '--settings-preview-primary',
    normalizeSettingsPreviewColor_(
      values['branding.primary_color'],
      '#17345f'
    )
  );

  preview.style.setProperty(
    '--settings-preview-secondary',
    normalizeSettingsPreviewColor_(
      values['branding.secondary_color'],
      '#0d2342'
    )
  );

  preview.style.setProperty(
    '--settings-preview-accent',
    normalizeSettingsPreviewColor_(
      values['branding.accent_color'],
      '#f4c430'
    )
  );

  const titleEl =
    document.getElementById(
      'settingsPreviewTitle'
    );

  if (titleEl) {
    titleEl.textContent =
      title;
  }

  const subtitleEl =
    document.getElementById(
      'settingsPreviewSubtitle'
    );

  if (subtitleEl) {
    subtitleEl.textContent =
      subtitle;
  }

  const logo =
    document.getElementById(
      'settingsPreviewLogo'
    );

  const fallback =
    document.getElementById(
      'settingsPreviewFallbackIcon'
    );

  const logoUrl =
    String(
      values['branding.logo_url'] || ''
    ).trim();

  if (
    logo &&
    fallback
  ) {

    if (logoUrl) {
      logo.onerror =
        function() {
          logo.hidden =
            true;
          fallback.hidden =
            false;
        };

      logo.onload =
        function() {
          logo.hidden =
            false;
          fallback.hidden =
            true;
        };

      logo.src =
        logoUrl;
      logo.hidden =
        false;
      fallback.hidden =
        true;
    } else {
      logo.onerror =
        null;
      logo.onload =
        null;

      logo.removeAttribute(
        'src'
      );
      logo.hidden =
        true;
      fallback.hidden =
        false;
    }

  }
}


function saveSettingsForm(
  button
) {

  if (settingsSaveInProgress) {
    return;
  }

  settingsSaveInProgress =
    true;

  const settings =
    collectSettingsFormValues_();

  const actionButton =
    setActionWorking(
      button,
      'Saving...'
    );

  showAppWorkingModal({
    title: 'Saving Settings...',
    message: 'Applying your configuration'
  });

  runAfterNextPaint_(function() {

    scriptRunPromise_(
      'saveAppSettings',
      runner =>
        runner.saveAppSettings(
          settings
        )
    )
      .then(function(data) {

        currentPageData =
          data;

        clearClientPageCache_();

        updateAppWorkingModal({
          state: 'success',
          title: 'Settings Saved',
          message: data.moduleStateChanged
            ? 'Refreshing enabled modules...'
            : 'Applying saved configuration'
        });

        if (
          data.bootstrap
        ) {

          applyBootstrapShell(
            data.bootstrap
          );

        } else {

          appBootstrap.config =
            data.config;

          applyBranding(
            data.config
          );

        }

        setActionSuccess(
          actionButton,
          'Saved'
        );

        showToast(
          'Settings saved.'
        );

        setTimeout(
          function() {
            renderSettingsPage(
              data
            );
            setClientCache(
              'settings',
              data,
              {
                source: 'settings-save'
              }
            );
            scheduleOperationalPrefetch_();
            settingsSaveInProgress =
              false;
            hideAppWorkingModal();
          },
          data.moduleStateChanged
            ? 650
            : 450
        );

      })
      .catch(function(error) {
        settingsSaveInProgress =
          false;

        updateAppWorkingModal({
          state: 'error',
          title: 'Settings Save Failed',
          message: 'Review the issue and try again.',
          error: error,
          retry: function() {
            hideAppWorkingModal();
            saveSettingsForm(
              button
            );
          }
        });

        setActionError(
          actionButton,
          'Save Failed'
        );
        handleFailure(
          error,
          'save settings'
        );
      });

  });
}


function saveIntegrationEnabled(
  id,
  enabled,
  input
) {

  if (input) {
    input.disabled =
      true;
    input.setAttribute(
      'aria-busy',
      'true'
    );
  }

  scriptRunPromise_(
    'saveIntegrationConfig:' + id,
    runner =>
      runner.saveIntegrationConfig(
        id,
        {
          enabled: enabled,
          settings: {}
        }
      )
  )
    .then(function(data) {

      currentPageData =
        data;

      clearClientPageCache_();

      if (data.bootstrap) {
        applyBootstrapShell(
          data.bootstrap
        );
      }

      renderSettingsPage(
        data
      );

      setClientCache(
        'settings',
        data,
        {
          source: 'integration-config'
        }
      );

      scheduleOperationalPrefetch_();

      showToast(
        'Integration setting saved.'
      );

      if (input) {
        input.disabled =
          false;
        input.removeAttribute(
          'aria-busy'
        );
      }

    })
    .catch(function(error) {

      if (input) {
        input.checked =
          !enabled;
        input.disabled =
          false;
        input.removeAttribute(
          'aria-busy'
        );
      }

      handleFailure(
        error,
        'save integration setting: ' + id
      );

    });
}


function updateSettingsIntegrationFromResult_(
  result,
  source
) {

  if (
    result &&
    result.settings
  ) {

    currentPageData =
      result.settings;

    if (
      result.settings.bootstrap
    ) {
      applyBootstrapShell(
        result.settings.bootstrap
      );
    }

    renderSettingsPage(
      result.settings
    );

    setClientCache(
      'settings',
      result.settings,
      {
        source:
          source || 'integration-action'
      }
    );

    return;

  }

  if (
    !result ||
    !result.integration ||
    !currentPageData ||
    !Array.isArray(
      currentPageData.integrations
    )
  ) {
    return;
  }

  currentPageData.integrations =
    currentPageData.integrations.map(
      integration =>
        integration.id === result.integration.id
          ? result.integration
          : integration
    );

  renderSettingsPage(
    currentPageData
  );

  setClientCache(
    'settings',
    currentPageData,
    {
      source:
        source || 'integration-action'
    }
  );
}


function invalidateIntegrationClientCaches_(
  id,
  result
) {

  const fallback = {
    aruba_central: [
      'switches',
      'accessPoints',
      'dashboard'
    ],
    threatdown: [
      'servers',
      'dashboard'
    ],
    uptimerobot: [
      'uptimeRobot',
      'internetWan',
      'dashboard'
    ]
  };

  const pages =
    result &&
    Array.isArray(result.invalidatePages)
      ? result.invalidatePages
      : fallback[id] || [
          'dashboard'
        ];

  pages.forEach(pageKey => {
    invalidateClientPage(
      pageKey
    );
  });
}


function testSettingsIntegration(
  id,
  button,
  event
) {

  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  const actionButton =
    setActionWorking(
      button,
      'Testing...'
    );

  scriptRunPromise_(
    'testIntegrationConnection:' + id,
    runner =>
      runner.testIntegrationConnection(
        id
      )
  )
    .then(function(result) {

      if (
        result.status === 'success' ||
        result.status === 'connected'
      ) {
        setActionSuccess(
          actionButton,
          'Connected'
        );
      } else {
        setActionError(
          actionButton,
          result.status === 'not_configured'
            ? 'Not Configured'
            : 'Test Failed'
        );
      }

      showToast(
        result.message ||
        result.status ||
        'Connection test complete.'
      );

      setTimeout(
        function() {
          updateSettingsIntegrationFromResult_(
            result,
            'integration-test'
          );
        },
        250
      );

    })
    .catch(function(error) {
      setActionError(
        actionButton,
        'Test Failed'
      );
      handleFailure(
        error,
        'test integration: ' + id
      );
    });
}


function syncSettingsIntegration(
  id,
  button,
  event
) {

  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  const actionButton =
    setActionWorking(
      button,
      'Syncing...'
    );

  scriptRunPromise_(
    'runIntegrationSync:' + id,
    runner =>
      runner.runIntegrationSync(
        id
      )
  )
    .then(function(result) {

      setActionSuccess(
        actionButton,
        'Synced'
      );

      invalidateIntegrationClientCaches_(
        id,
        result
      );

      showToast(
        result.message ||
        (
          result.status === 'success'
            ? 'Integration sync complete.'
            : 'Integration sync finished: ' + result.status
        )
      );

      setTimeout(
        function() {
          updateSettingsIntegrationFromResult_(
            result,
            'integration-sync'
          );
        },
        250
      );

    })
    .catch(function(error) {
      setActionError(
        actionButton,
        'Sync Failed'
      );
      handleFailure(
        error,
        'sync integration: ' + id
      );
    });
}


function runSettingsValidation(
  button
) {

  const actionButton =
    setActionWorking(
      button,
      'Validating...'
    );

  const output =
    document.getElementById(
      'settingsValidationOutput'
    );

  if (output) {
    output.textContent =
      'Running validation...';
  }

  scriptRunPromise_(
    'appValidateNetworkDashboard',
    runner =>
      runner.appValidateNetworkDashboard()
  )
    .then(function(result) {

      if (output) {
        output.textContent =
          formatClientValidationResult(result);
      }

      setActionSuccess(
        actionButton,
        'Validation Complete'
      );

      showToast(
        result.healthy
          ? 'Installation is healthy.'
          : 'Validation found issues.'
      );

    })
    .catch(function(error) {

      if (output) {
        output.textContent =
          getSafeErrorMessage_(
            error
          );
      }

      setActionError(
        actionButton,
        'Validation Failed'
      );

      handleFailure(
        error,
        'validate installation'
      );

    });
}


function formatClientValidationResult(result) {

  return [
    'Application: ' + result.applicationVersion,
    'Schema: ' + result.schemaVersion,
    'Status: ' + (result.healthy ? 'Healthy' : 'Needs attention'),
    '',
    'Sheets checked: ' + (result.sheets || []).length,
    'Protections checked: ' + (result.protections || []).length,
    'Unmanaged sheets: ' + (result.unmanagedSheets || []).length,
    '',
    'Errors:',
    result.errors && result.errors.length
      ? result.errors.join('\n')
      : 'None',
    '',
    'Warnings:',
    result.warnings && result.warnings.length
      ? result.warnings.join('\n')
      : 'None',
    '',
    'Unmanaged Sheets:',
    result.unmanagedSheets && result.unmanagedSheets.length
      ? result.unmanagedSheets
          .map(item =>
            item.sheet +
            ': ' +
            item.reason
          )
          .join('\n')
      : 'None'
  ].join('\n');
}
