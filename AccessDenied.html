<!DOCTYPE html>
<html>
<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>

    :root {
      --navy:<?= branding.primaryColor ?>;
      --navy-dark:<?= branding.secondaryColor ?>;
      --gold:<?= branding.accentColor ?>;
      --surface:#f5f4f0;
      --muted:#6b7582;
    }


    * {
      box-sizing:border-box;
    }


    body {
      min-height:100vh;

      margin:0;

      display:grid;
      place-items:center;

      padding:25px;

      background:
        linear-gradient(
          145deg,
          var(--navy-dark),
          var(--navy)
        );

      font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;
    }


    .login-card {
      width:100%;
      max-width:480px;

      overflow:hidden;

      border-radius:18px;

      background:white;

      box-shadow:
        0 25px 70px rgba(0,0,0,.28);
    }


    .brand-bar {
      height:7px;

      background:var(--gold);
    }


    .content {
      padding:38px;
    }


    .brand {
      display:flex;
      align-items:center;

      gap:13px;

      margin-bottom:35px;
    }


    .brand-icon {
      width:46px;
      height:46px;

      display:grid;
      place-items:center;

      border-radius:11px;

      background:var(--navy);
      color:var(--gold);

      font-size:19px;
    }


    .brand-title {
      color:var(--navy);

      font-size:15px;
      font-weight:800;

      letter-spacing:.06em;
    }


    .brand-subtitle {
      margin-top:2px;

      color:var(--muted);

      font-size:9px;
      font-weight:750;

      letter-spacing:.17em;
    }


    h1 {
      margin:0 0 10px;

      color:var(--navy);

      font-size:27px;
      font-weight:800;

      letter-spacing:-.025em;
    }


    p {
      margin:0;

      color:var(--muted);

      font-size:13px;
      line-height:1.6;
    }


    .account {
      margin:24px 0;

      padding:13px 15px;

      border:1px solid #e3e7eb;
      border-radius:9px;

      background:#f7f8fa;

      color:#344150;

      font-size:12px;
    }


    .account i {
      margin-right:8px;

      color:var(--navy);
    }


    .button {
      width:100%;

      display:flex;
      align-items:center;
      justify-content:center;

      gap:9px;

      padding:12px 16px;

      border:1px solid #d9dee4;
      border-radius:9px;

      background:white;

      color:var(--navy);

      font-size:12px;
      font-weight:700;

      text-decoration:none;
    }


    .button:hover {
      background:#f7f8fa;
    }


    .footer {
      margin-top:25px;

      color:#98a0a9;

      font-size:10px;

      text-align:center;
    }

  </style>

</head>

<body>

  <div class="login-card">

    <div class="brand-bar"></div>

    <div class="content">

      <div class="brand">

        <div class="brand-icon">
          <i class="fa-solid fa-network-wired"></i>
        </div>

        <div>
          <div class="brand-title">
            <?= appName ?>
          </div>

          <div class="brand-subtitle">
            ACCESS CONTROL
          </div>
        </div>

      </div>


      <h1>Access Restricted</h1>

      <p>
        This application is restricted to authorized
        <?= organizationName ?> personnel.
      </p>


      <div class="account">

        <i class="fa-solid fa-circle-user"></i>

        Signed in as

        <strong>
          <?= userEmail ?>
        </strong>

      </div>


      <a
        class="button"
        href="https://accounts.google.com/Logout"
      >
        <i class="fa-brands fa-google"></i>

        Sign in with a different Google account
      </a>


      <div class="footer">
        Network Dashboard
      </div>

    </div>

  </div>

</body>
</html>
