<script>

const RECORD_PAGE_DEFINITIONS = {};
let currentRecordDefinition = null;

function resolveRecordDefaultColumns_(
  data,
  definition
) {
  const headers =
    Array.isArray(data.headers)
      ? data.headers
      : [];

  const serverDefaults =
    Array.isArray(data.defaultColumns)
      ? data.defaultColumns
      : [];

  const clientDefaults =
    definition && Array.isArray(definition.defaultColumns)
      ? definition.defaultColumns
      : [];

  const configured =
    serverDefaults.length
      ? serverDefaults
      : clientDefaults.length
        ? clientDefaults
        : headers.slice(0, 6);

  return Array.from(new Set(configured))
    .filter(field => headers.includes(field));
}

function renderRecordTable_(data, definition) {

  currentTableData =
    data;


  currentHeaders =
    data.headers || [];


  currentRecordDefinition = definition;
  data.defaultColumns = resolveRecordDefaultColumns_(data, definition);
  if (definition.onOpen) definition.onOpen(data);
  definition.header(data);
  definition.actions(data);
  const toolbarPrefix = definition.toolbar ? definition.toolbar(data) : '';

  document.getElementById(
    'pageContent'
  ).innerHTML = `

    <div class="table-toolbar">

      <div class="table-toolbar-left">

        ${toolbarPrefix}


        <div class="input-group input-group-sm table-search">

          <span class="input-group-text bg-white">

            <i class="fa-solid fa-magnifying-glass"></i>

          </span>

          <input
            id="tableSearch"
            type="search"
            class="form-control"
            placeholder="Search records..."
            oninput="applyTableSearch()"
          >

        </div>


        <div class="dropdown">

          <button
            type="button"
            class="btn btn-sm btn-light border dropdown-toggle"
            data-bs-toggle="dropdown"
          >

            <i class="fa-solid fa-table-columns me-2"></i>

            Columns

          </button>


          <div
            id="columnMenu"
            class="dropdown-menu table-column-menu p-2 shadow"
          ></div>

        </div>


        <button
          type="button"
          class="btn btn-sm btn-light border"
          onclick="clearTableFilters()"
        >

          <i class="fa-solid fa-filter-circle-xmark me-2"></i>

          Clear

        </button>

      </div>


      <div class="table-toolbar-right">

        <span
          id="recordCount"
          class="record-count"
        >
          ${definition.recordCount ? definition.recordCount(data) : data.totalCount} records
        </span>


        <select
          id="pageSizeSelect"
          class="form-select form-select-sm"
          style="width:80px;"
          onchange="changePageSize(this.value)"
        >

          <option value="15">
            15
          </option>

          <option
            value="25"
            selected
          >
            25
          </option>

          <option value="50">
            50
          </option>

          <option value="100">
            100
          </option>

        </select>

      </div>

    </div>


    <div id="tabulatorTable"></div>

  `;


  buildRecordTable_(
    data
  );


}




function renderRecordActions_(data, extraActions) {

  const canEdit =
    data.permission === 'edit';


  const addButton =
    canEdit
      ? `

        <button
          class="btn btn-sm btn-brand"
          onclick="openAddRecord()"
        >

          <i class="fa-solid fa-plus me-2"></i>

          Add Record

        </button>

      `
      : '';


  document.getElementById(
    'pageActions'
  ).innerHTML = `

    ${extraActions || ''}

    ${addButton}


    <button
      class="btn btn-sm btn-light border"
      onclick="exportCurrentTable()"
    >

      <i class="fa-solid fa-file-export me-2"></i>

      Export

    </button>


    <button
      class="btn btn-sm btn-light border"
      onclick="refreshCurrentPage(this)"
    >

      <i class="fa-solid fa-rotate me-2"></i>

      Refresh

    </button>

  `;
}


function buildRecordColumns_(data, definition) {




  const canEdit =
    data.permission === 'edit';


  const defaults =
    new Set(
      data.defaultColumns || []
    );

  const columnPreferences =
    reconcileColumnVisibilityPreferences_(
      data.pageKey,
      data.headers || []
    );

  const requiredColumns =
    getRequiredVisibleColumns_(
      data
    );


  let columns =
    data.headers.map(
      header => {



        if (
          typeof isPasswordHeaderClient === 'function' &&
          isPasswordHeaderClient(
            header
          ) &&
          data.hasCredentials
        ) {

          return createStandardPasswordColumnDefinition_(
            defaults,
            columnPreferences,
            canEdit
          );

        }

        const column = {

          title: header,

          field: header,

          visible:
            isTableColumnVisibleByPreference_(
              header,
              defaults,
              columnPreferences,
              requiredColumns
            ),

          headerSort: true,

          tooltip: true,

          minWidth: 110

        };


        Object.assign(column, definition.columns[header] || {});

        if (
          isStatusColumn(header)
        ) {

          column.formatter =
            function(cell) {

              return statusPill(
                cell.getValue()
              );

            };

        }

        applyColumnWidthPreference_(
          column,
          columnPreferences
        );


        return column;

      }
    );


  /*
   * ACTION MENU
   *
   * Dedicated column on EVERY table.
   * Fixed width and excluded from user ordering.
   */

  columns.push({

    title:
      'Actions',

    field:
      '_actions',

    width:
      82,

    minWidth:
      82,

    maxWidth:
      82,

    resizable:
      false,

    movable:
      false,

    frozen:
      false,

    hozAlign:
      'center',

    headerHozAlign:
      'center',

    headerSort:
      false,

    download:
      false,

    formatter:
      function(cell) {

        const rowData =
          cell
            .getRow()
            .getData();


        const wrapper =
          document.createElement(
            'div'
          );


        wrapper.className =
          'table-row-actions';


        /*
        * EDIT
        */
        if (canEdit) {

          const edit =
            document.createElement(
              'button'
            );


          edit.type =
            'button';


          edit.className =
            'table-row-action table-row-action-edit';


          edit.title =
            'Edit record';


          edit.innerHTML =
            '<i class="fa-solid fa-pen"></i>';


          edit.addEventListener(
            'click',
            function(event) {

              event.stopPropagation();


              openEditRecord(
                rowData
              );

            }
          );


          wrapper.appendChild(
            edit
          );


          /*
          * DELETE
          */
          const remove =
            document.createElement(
              'button'
            );


          remove.type =
            'button';


          remove.className =
            'table-row-action table-row-action-delete';


          remove.title =
            'Delete record';


          remove.innerHTML =
            '<i class="fa-regular fa-trash-can"></i>';


          remove.addEventListener(
            'click',
            function(event) {

              event.stopPropagation();

              confirmDeleteRecord(
                rowData,
                remove
              );

            }
          );


          wrapper.appendChild(
            remove
          );

        }


        return wrapper;

    }

  });

  columns = applyColumnOrderPreference_(columns, { order: data.defaultColumns || [] });
  columns = applyColumnOrderPreference_(columns, columnPreferences);


  return columns;
}

function buildRecordTable_(data) {
  const columns = currentRecordDefinition.buildColumns(data);
  tableInstance =
    createAppTable_(
      '#tabulatorTable',
      {

        data:
          data.rows,

        columns:
          columns,

        layout:
          getNativeTableLayout_(),

        responsiveLayout:
          false,

        pagination:
          true,

        paginationMode:
          'local',

        paginationSize:
          25,

        movableColumns:
          true,

        placeholder:
          'No records found',

        columnDefaults: {

          vertAlign:
            'middle'

        }

      }
    );

  bindTableColumnPreferenceEvents_(
    tableInstance,
    data.pageKey
  );


  tableInstance.on(
    'dataFiltered',
    updateFilteredRecordCount
  );


  const createdTable = tableInstance;
  createdTable.on('tableBuilt', function() {
    if (tableInstance !== createdTable) return;
    buildColumnMenu(data);
    applyTableSearch();
  });

  bindColumnMenuRefresh_(
    'columnMenu',
    function() {
      buildColumnMenu(
        data
      );
    }
  );
}


function buildColumnMenu(
  data
) {

  const menu =
    document.getElementById(
      'columnMenu'
    );


  if (
    !menu ||
    !tableInstance
  ) {
    return;
  }


  menu.innerHTML =
    '';

  const controls =
    document.createElement(
      'div'
    );

  controls.className =
    'column-menu-controls';

  const selectAll =
    document.createElement(
      'button'
    );

  selectAll.type =
    'button';
  selectAll.className =
    'btn btn-sm btn-light border';
  selectAll.textContent =
    'Select All';

  const clearAll =
    document.createElement(
      'button'
    );

  clearAll.type =
    'button';
  clearAll.className =
    'btn btn-sm btn-light border';
  clearAll.textContent =
    'Clear All';

  controls.appendChild(
    selectAll
  );

  controls.appendChild(
    clearAll
  );

  controls.appendChild(createColumnResetButton_(data.pageKey));
  menu.appendChild(
    controls
  );

  const defaults =
    new Set(
      data.defaultColumns || []
    );

  const requiredColumns =
    getRequiredVisibleColumns_(
      data
    );

  selectAll.addEventListener(
    'click',
    function(event) {
      event.stopPropagation();
      setAllTableColumnsVisible_(
        data,
        true,
        defaults,
        requiredColumns
      );
      buildColumnMenu(
        data
      );
    }
  );

  clearAll.addEventListener(
    'click',
    function(event) {
      event.stopPropagation();
      setAllTableColumnsVisible_(
        data,
        false,
        defaults,
        requiredColumns
      );
      buildColumnMenu(
        data
      );
    }
  );

  data.headers.forEach(
    header => {

      const column =
        tableInstance.getColumn(
          header
        );


      const wrapper =
        document.createElement(
          'label'
        );


      wrapper.className =
        'dropdown-item d-flex align-items-center gap-2';


      wrapper.addEventListener(
        'click',
        function(event) {
          event.stopPropagation();
        }
      );


      const checkbox =
        document.createElement(
          'input'
        );


      checkbox.type =
        'checkbox';


      checkbox.className =
        'form-check-input m-0';


      checkbox.checked =
        !!(
          column &&
          column.isVisible()
        );

      checkbox.disabled =
        !!requiredColumns[header];


      checkbox.addEventListener(
        'change',
        function(event) {

          event.stopPropagation();

          if (this.checked) {

            tableInstance.showColumn(
              header
            );

          } else {

            tableInstance.hideColumn(
              header
            );

          }

          persistColumnVisibilityPreference_(
            data.pageKey,
            header,
            this.checked,
            defaults
          );

        }
      );


      const text =
        document.createElement(
          'span'
        );


      text.textContent =
        requiredColumns[header]
          ? header + ' (required)'
          : header;


      wrapper.appendChild(
        checkbox
      );


      wrapper.appendChild(
        text
      );


      menu.appendChild(
        wrapper
      );

    }
  );
}


function createStandardPasswordColumnDefinition_(
  defaults,
  preferences,
  canEdit
) {

  const column = {

    title:
      'Password',

    field:
      'Password',

    visible:
      isTableColumnVisibleByPreference_(
        'Password',
        defaults,
        preferences,
        {}
      ),

    width:
      112,

    minWidth:
      112,

    resizable:
      true,

    headerSort:
      false,

    download:
      false,

    formatter:
      function(cell) {

        return restrictedPasswordFormatter(
          cell,
          {
            key: 'main'
          },
          canEdit
        );

      }

  };

  applyColumnWidthPreference_(
    column,
    preferences
  );

  return column;
}


function setAllTableColumnsVisible_(
  data,
  visible,
  defaults,
  requiredColumns
) {

  const preferences = {
    hidden: [],
    visible: []
  };

  data.headers.forEach(header => {

    const column =
      tableInstance.getColumn(
        header
      );

    const shouldShow =
      visible ||
      requiredColumns[header];

    if (column) {
      if (shouldShow) {
        tableInstance.showColumn(
          header
        );
      } else {
        tableInstance.hideColumn(
          header
        );
      }
    }

    if (requiredColumns[header]) {
      return;
    }

    const defaultVisible =
      defaults.size === 0 ||
      defaults.has(header);

    if (shouldShow) {
      if (!defaultVisible) {
        preferences.visible.push(
          header
        );
      }
    } else {
      preferences.hidden.push(
        header
      );
    }

  });

  setColumnVisibilityPreferences_(
    data.pageKey,
    preferences
  );
}


function getColumnStorageKey_(
  pageKey
) {

  return 'networkDashboard.columns.' +
    pageKey;
}


function getColumnPreferences_(
  pageKey
) {

  try {
    const raw =
      localStorage.getItem(
        getColumnStorageKey_(
          pageKey
        )
      );

    const parsed =
      raw
        ? JSON.parse(raw)
        : {};

    return {
      hidden:
        Array.isArray(parsed.hidden)
          ? parsed.hidden
          : [],
      visible:
        Array.isArray(parsed.visible)
          ? parsed.visible
          : [],
      widths:
        parsed.widths &&
        typeof parsed.widths === 'object'
          ? parsed.widths
          : {},
      order:
        Array.isArray(parsed.order)
          ? parsed.order
          : []
    };
  } catch (error) {
    return {
      hidden: [],
      visible: [],
      widths: {},
      order: []
    };
  }
}


function getColumnVisibilityPreferences_(
  pageKey
) {

  return getColumnPreferences_(
    pageKey
  );
}


function reconcileColumnVisibilityPreferences_(
  pageKey,
  availableFields
) {

  const available =
    new Set(
      availableFields || []
    );

  const current =
    getColumnPreferences_(
      pageKey
    );

  const hidden =
    (current.hidden || [])
      .filter(field =>
        available.has(field)
      );

  const visible =
    (current.visible || [])
      .filter(field =>
        available.has(field)
      );

  const widths = {};

  Object.keys(
    current.widths || {}
  ).forEach(field => {

    const width =
      normalizeColumnWidthPreference_(
        current.widths[field]
      );

    if (
      available.has(field) &&
      width
    ) {
      widths[field] =
        width;
    }

  });

  const order =
    (current.order || [])
      .filter(field =>
        available.has(field)
      );

  if (
    hidden.length !==
      (current.hidden || []).length ||
    visible.length !==
      (current.visible || []).length ||
    Object.keys(widths).length !==
      Object.keys(current.widths || {}).length ||
    order.length !==
      (current.order || []).length
  ) {
    setColumnPreferences_(
      pageKey,
      {
        hidden: hidden,
        visible: visible,
        widths: widths,
        order: order
      }
    );
  }

  return {
    hidden: hidden,
    visible: visible,
    widths: widths,
    order: order
  };
}


function bindColumnMenuRefresh_(
  menuId,
  callback
) {

  const menu =
    document.getElementById(
      menuId
    );

  if (
    !menu ||
    typeof callback !== 'function'
  ) {
    return;
  }

  const dropdown =
    menu.closest(
      '.dropdown'
    );

  if (
    !dropdown ||
    dropdown.dataset.columnMenuRefreshBound
  ) {
    return;
  }

  dropdown.dataset.columnMenuRefreshBound =
    'true';

  dropdown.addEventListener(
    'show.bs.dropdown',
    function() {
      callback();
    }
  );
}


function setColumnPreferences_(
  pageKey,
  preferences
) {

  const current =
    getColumnPreferences_(
      pageKey
    );

  const next =
    Object.assign(
      {},
      current,
      preferences || {}
    );

  try {
    localStorage.setItem(
      getColumnStorageKey_(
        pageKey
      ),
      JSON.stringify({
        hidden:
          next.hidden || [],
        visible:
          next.visible || [],
        widths:
          next.widths || {},
        order:
          next.order || []
      })
    );
  } catch (error) {}
}


function setColumnVisibilityPreferences_(
  pageKey,
  preferences
) {

  setColumnPreferences_(
    pageKey,
    {
      hidden:
        preferences.hidden || [],
      visible:
        preferences.visible || []
    }
  );
}


function normalizeColumnWidthPreference_(
  width
) {

  const value =
    Math.round(
      Number(width)
    );

  return Number.isFinite(value) &&
    value >= 40 &&
    value <= 1400
      ? value
      : 0;
}


function applyColumnWidthPreference_(
  column,
  preferences
) {

  if (
    !column ||
    !column.field
  ) {
    return column;
  }

  const width =
    normalizeColumnWidthPreference_(
      preferences &&
      preferences.widths &&
      preferences.widths[column.field]
    );

  if (width) {
    column.width =
      width;
  }

  return column;
}


function applyColumnOrderPreference_(
  columns,
  preferences
) {

  const order =
    preferences &&
    Array.isArray(preferences.order)
      ? preferences.order
      : [];

  if (!order.length) {
    return columns;
  }

  const actionColumns = [];

  const byField = {};

  const remaining = [];

  (columns || [])
    .forEach(column => {

      if (column.field === '_actions') {
        actionColumns.push(
          column
        );
        return;
      }

      if (column.field) {
        byField[column.field] =
          column;
      }

      remaining.push(
        column
      );

    });

  const ordered = [];

  order.forEach(field => {

    if (byField[field]) {
      ordered.push(
        byField[field]
      );
      delete byField[field];
    }

  });

  remaining.forEach(column => {

    if (
      !column.field ||
      byField[column.field]
    ) {
      ordered.push(
        column
      );

      if (column.field) {
        delete byField[column.field];
      }
    }

  });

  return ordered.concat(
    actionColumns
  );
}


function getNativeTableLayout_() {

  return 'fitDataTable';
}


function bindTableColumnPreferenceEvents_(
  table,
  pageKey
) {

  if (
    !table ||
    !pageKey
  ) {
    return;
  }

  table.on(
    'columnResized',
    function(column) {

      persistColumnWidthPreference_(
        pageKey,
        column
      );

    }
  );

  table.on(
    'columnMoved',
    function() {

      persistColumnOrderPreference_(
        pageKey,
        table
      );

    }
  );
}


function persistColumnWidthPreference_(
  pageKey,
  column
) {

  if (
    !column ||
    column.getField() === '_actions'
  ) {
    return;
  }

  const field =
    column.getField();

  const width =
    normalizeColumnWidthPreference_(
      column.getWidth()
    );

  if (!width) {
    return;
  }

  const preferences =
    getColumnPreferences_(
      pageKey
    );

  const widths =
    Object.assign(
      {},
      preferences.widths || {}
    );

  widths[field] =
    width;

  setColumnPreferences_(
    pageKey,
    {
      widths:
        widths
    }
  );
}


function persistColumnOrderPreference_(
  pageKey,
  table
) {

  if (!table) {
    return;
  }

  const order =
    table
      .getColumns()
      .map(column =>
        column.getField()
      )
      .filter(field =>
        field &&
        field !== '_actions'
      );

  setColumnPreferences_(
    pageKey,
    {
      order:
        order
    }
  );
}


function isTableColumnVisibleByPreference_(
  header,
  defaults,
  preferences,
  requiredColumns
) {

  if (requiredColumns[header]) {
    return true;
  }

  const hidden =
    new Set(
      preferences.hidden || []
    );

  const visible =
    new Set(
      preferences.visible || []
    );

  if (visible.has(header)) {
    return true;
  }

  if (hidden.has(header)) {
    return false;
  }

  return defaults.size === 0 ||
    defaults.has(header);
}


function persistColumnVisibilityPreference_(
  pageKey,
  header,
  visible,
  defaults
) {

  const preferences =
    getColumnVisibilityPreferences_(
      pageKey
    );

  const hidden =
    new Set(
      preferences.hidden || []
    );

  const shown =
    new Set(
      preferences.visible || []
    );

  const defaultVisible =
    defaults.size === 0 ||
    defaults.has(header);

  if (visible) {
    hidden.delete(header);
    if (defaultVisible) {
      shown.delete(header);
    } else {
      shown.add(header);
    }
  } else {
    shown.delete(header);
    hidden.add(header);
  }

  setColumnVisibilityPreferences_(
    pageKey,
    {
      hidden:
        Array.from(hidden),
      visible:
        Array.from(shown)
    }
  );
}


function getRequiredVisibleColumns_(data) {
  const definition = RECORD_PAGE_DEFINITIONS[data.pageKey];
  const required = {};
  (definition ? definition.requiredColumns : [data.headers && data.headers[0]])
    .filter(field => (data.headers || []).includes(field))
    .forEach(field => { required[field] = true; });
  return required;
}


function applyTableSearch() {
  if (!tableInstance) return;
  const input = document.getElementById('tableSearch');
  const query = String(input ? input.value : '').trim().toLowerCase();
  const matches = currentRecordDefinition && currentRecordDefinition.matchesRow;
  if (!query && !matches) { tableInstance.clearFilter(); return; }
  tableInstance.setFilter(function(row) {
    if (matches && !matches(row)) return false;
    return !query || currentHeaders.some(header =>
      String(row[header] || '').toLowerCase().includes(query));
  });
}


function clearTableFilters() {
  const search = document.getElementById('tableSearch');
  if (search) search.value = '';
  applyTableSearch();
}


function updateFilteredRecordCount(
  filters,
  rows
) {

  const element =
    document.getElementById(
      'recordCount'
    );


  if (!element) {
    return;
  }


  const count =
    rows ? rows.length : 0;


  element.textContent =
    `${count} record${count === 1 ? '' : 's'}`;
}


function changePageSize(
  value
) {

  if (!tableInstance) {
    return;
  }


  tableInstance.setPageSize(
    Number(value)
  );
}


function exportCurrentTable() {

  if (!tableInstance) {
    return;
  }


  tableInstance.download(
    'csv',
    `${currentTableData.label}.csv`
  );
}


/*******************************************************
 * ROW MENU
 *******************************************************/

function openRowActionMenu(
  event,
  rowData,
  canEdit
) {

  closeRowActionMenu();


  const menu =
    document.createElement(
      'div'
    );


  menu.id =
    'rowActionMenu';


  menu.className =
    'dropdown-menu show shadow';


  menu.style.position =
    'fixed';


  menu.style.zIndex =
    '99999';


  menu.style.left =
    Math.min(
      event.clientX,
      window.innerWidth - 220
    ) + 'px';


  menu.style.top =
    Math.min(
      event.clientY,
      window.innerHeight - 180
    ) + 'px';


  const serial =
    rowData['Serial Number'] || '';


  if (
    currentPageKey === 'switches' &&
    serial &&
    !String(serial).includes('/')
  ) {

    menu.appendChild(
      createActionMenuItem(
        'fa-file-code',
        'View Running Config',
        function() {

          viewRunningConfig(
            serial
          );

        }
      )
    );

  }


  if (canEdit) {

    menu.appendChild(
      createActionMenuItem(
        'fa-pen-to-square',
        'Edit Record',
        function() {

          openEditRecord(
            rowData
          );

        }
      )
    );


    menu.appendChild(
      createActionMenuItem(
        'fa-trash',
        'Delete Record',
        function() {

          confirmDeleteRecord(
            rowData
          );

        },
        true
      )
    );

  }


  document.body.appendChild(
    menu
  );


  setTimeout(
    function() {

      document.addEventListener(
        'click',
        closeRowActionMenu,
        {
          once: true
        }
      );

    },
    0
  );
}


function createActionMenuItem(
  icon,
  label,
  handler,
  danger
) {

  const button =
    document.createElement(
      'button'
    );


  button.className =
    'dropdown-item small' +
    (
      danger
        ? ' text-danger'
        : ''
    );


  button.innerHTML = `

    <i class="fa-solid ${icon} me-2"></i>

    ${escapeHtml(label)}

  `;


  button.addEventListener(
    'click',
    function(event) {

      event.stopPropagation();

      closeRowActionMenu();

      handler();

    }
  );


  return button;
}


async function updateRecordTablePage_(data) {
  const definition = currentRecordDefinition;
  const table = tableInstance;
  data.defaultColumns = resolveRecordDefaultColumns_(data, definition);
  currentTableData = data;
  currentHeaders = data.headers || [];
  definition.header(data);
  if (definition.updateSummary) definition.updateSummary(data);
  await replaceTableRows_(table, data.rows);
}

function createColumnResetButton_(preferenceKey) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'btn btn-sm btn-light border';
  button.title = 'Reset columns to defaults';
  button.setAttribute('aria-label', button.title);
  button.innerHTML = '<i class="fa-solid fa-rotate-left"></i>';
  button.addEventListener('click', event => {
    event.stopPropagation();
    setColumnPreferences_(preferenceKey, { hidden: [], visible: [], widths: {}, order: [] });
    renderPage(currentPageKey, currentPageData);
  });
  return button;
}
</script>
