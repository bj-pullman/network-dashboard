<!DOCTYPE html>
<html>
<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title><?= appName ?></title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css"
  >

  <?!= include('Styles'); ?>

</head>


<body>

<div id="appShell">

  <aside id="sidebar">

    <div class="brand">

    <div class="brand-logo-shell">

      <img
        id="brandLogo"
        class="brand-logo"
        alt="Organization logo"
        hidden
      >

      <div
        id="brandLogoFallback"
        class="brand-logo-fallback"
      >
        <i class="fa-solid fa-network-wired"></i>
      </div>

    </div>


      <div class="brand-copy">

        <div
          id="brandTitle"
          class="brand-title"
        >
          NETWORK DASHBOARD
        </div>

        <div
          id="brandSubtitle"
          class="brand-subtitle"
        >
          INFRASTRUCTURE
        </div>

      </div>

    </div>


    <div id="navigation"></div>


    <div class="sidebar-footer">

      <div class="user-avatar">
        <i class="fa-solid fa-user"></i>
      </div>


      <div class="sidebar-user-info">

        <div
          id="sidebarUserName"
          class="sidebar-user-name"
        >
          Loading...
        </div>

        <div
          id="sidebarUserRole"
          class="sidebar-user-role"
        >
          Authorized User
        </div>

      </div>

    </div>

  </aside>


  <main id="main">

    <header id="pageHeader">

      <div class="page-heading">

        <div
          id="pageEyebrow"
          class="page-eyebrow"
        >
          NETWORK DASHBOARD
        </div>


        <div class="title-line">

          <span class="title-slash">
            /
          </span>

          <h1 id="pageTitle">
            Dashboard
          </h1>

          <span class="title-slash">
            /
          </span>

        </div>


        <div
          id="pageSubtitle"
          class="page-subtitle"
        >
          Network infrastructure overview
        </div>

      </div>


      <div
        id="pageActions"
        class="page-actions"
      ></div>

    </header>


    <section id="pageContent">

      <div class="app-loading">

        <div
          class="spinner-border spinner-border-sm"
        ></div>

        <span>
          Loading Network Dashboard...
        </span>

      </div>

    </section>

  </main>

</div>


<div id="toastContainer"></div>


<!-- RECORD MODAL -->

<div
  class="modal fade"
  id="recordModal"
  tabindex="-1"
>

  <div
    class="modal-dialog modal-lg modal-dialog-scrollable"
  >

    <div class="modal-content">

      <div class="modal-header">

        <div>

          <div class="modal-eyebrow">
            DATABASE RECORD
          </div>

          <h5
            id="recordModalTitle"
            class="modal-title"
          >
            Edit Record
          </h5>

        </div>


        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>

      </div>


      <div
        id="recordModalBody"
        class="modal-body"
      ></div>


      <div class="modal-footer">

        <button
          type="button"
          class="btn btn-light"
          data-bs-dismiss="modal"
        >
          Cancel
        </button>


        <button
          type="button"
          id="saveRecordButton"
          class="btn btn-brand"
        >

          <i class="fa-solid fa-check me-2"></i>

          Save

        </button>

      </div>

    </div>

  </div>

</div>


<!-- CONFIG MODAL -->

<div
  class="modal fade"
  id="configModal"
  tabindex="-1"
>

  <div
    class="modal-dialog modal-xl modal-dialog-scrollable"
  >

    <div class="modal-content">

      <div class="modal-header">

        <div>

          <div class="modal-eyebrow">
            NETWORK INTEGRATION
          </div>

          <h5 class="modal-title">
            Running Configuration
          </h5>

        </div>


        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>

      </div>


      <div class="modal-body">

        <pre
          id="configDisplay"
          class="config-display"
        ></pre>

      </div>

    </div>

  </div>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script
  src="https://cdn.jsdelivr.net/npm/chart.js">
</script>

<script
  src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js">
</script>


<script>
  window.INITIAL_APP_BOOTSTRAP =
    <?!= initialBootstrapJson ?>;
</script>


<?!= include('Dashboard'); ?>

<?!= include('DepartmentWorkflow'); ?>

<?!= include('InternetWan'); ?>

<?!= include('Outages'); ?>

<?!= include('UptimeRobotPage'); ?>

<?!= include('StructuredPage'); ?>

<?!= include('TablePage'); ?>

<?!= include('UserManagement'); ?>

<?!= include('Settings'); ?>

<?!= include('Scripts'); ?>


</body>
</html>
