<div class="modal fade" id="standardPlaybookModal" tabindex="-1" aria-labelledby="standardPlaybookModalTitle">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <div class="modal-eyebrow">OPERATIONAL REFERENCE</div>
          <h2 class="modal-title h5" id="standardPlaybookModalTitle">Print Playbook</h2>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Print the sections you can access. Supported usernames and addresses are included only when permitted.
          Passwords, keys, tokens, other secrets, and free-text notes are never included.</p>
        <div id="standardPlaybookSections" class="row row-cols-1 row-cols-sm-2 g-2" aria-label="Playbook sections"></div>
        <div id="standardPlaybookFeedback" class="mt-3 small" role="status" aria-live="polite"></div>
        <div id="standardPlaybookWarnings" class="mt-2 small" role="status"></div>
        <div id="standardPlaybookSummary" class="mt-2"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Close</button>
        <button type="button" id="standardPlaybookPrepare" class="btn btn-light border"
                onclick="prepareStandardPlaybook_()">Preview selection</button>
        <button type="button" id="standardPlaybookPrint" class="btn btn-brand" disabled
                onclick="printStandardPlaybook_()">Print / Save as PDF</button>
      </div>
    </div>
  </div>
</div>

<main id="standardPlaybookPaper" aria-label="Network HQ Playbook print document"></main>

<style>
#standardPlaybookPaper { display: none; }
/* Keep the application out of the printable rendering even if the browser
   switches print media late. Only this isolated cover and its typed rows remain. */
body.standard-playbook-print > :not(#standardPlaybookPaper) { display: none !important; }
body.standard-playbook-print { overflow: visible !important; padding: 0 !important; }
body.standard-playbook-print #standardPlaybookPaper {
  display: block !important; color: #101827; background: #fff; font: 10.5pt/1.4 Arial, sans-serif;
  page: standardPlaybook; max-width: none;
}
@media print {
  @page standardPlaybook {
    size: letter; margin: .62in .58in .62in 1in;
    @top-left { content: "NETWORK HQ PLAYBOOK  /  OPERATIONAL REFERENCE"; color: #435171; font: 8pt Arial, sans-serif; }
    @bottom-right { content: "Page " counter(page) " of " counter(pages); color: #435171; font: 8pt Arial, sans-serif; }
  }
  #standardPlaybookPaper .playbook-cover,
  #standardPlaybookPaper .playbook-section-cover {
    break-after: page; padding-top: 1.35in;
  }
  #standardPlaybookPaper .playbook-section-cover { break-before: page; }
  #standardPlaybookPaper .playbook-label { color: #435171; font-weight: bold; letter-spacing: .08em; }
  #standardPlaybookPaper .playbook-cover h1 { font-size: 34pt; line-height: 1.1; }
  #standardPlaybookPaper h2 { font-size: 26pt; line-height: 1.15; }
  #standardPlaybookPaper h3 { font-size: 17pt; break-after: avoid; }
  #standardPlaybookPaper .playbook-meta { margin: 12pt 0; color: #435171; }
  #standardPlaybookPaper .playbook-data { width: 100%; border-collapse: collapse; table-layout: fixed; }
  #standardPlaybookPaper .playbook-data thead { display: table-header-group; }
  #standardPlaybookPaper .playbook-data tr { break-inside: avoid; }
  #standardPlaybookPaper .playbook-data th,
  #standardPlaybookPaper .playbook-data td {
    padding: 5pt 7pt; border: 1px solid #b2bed5; vertical-align: top; overflow-wrap: anywhere; text-align: left;
  }
  #standardPlaybookPaper .playbook-data th { background: #e6eef9; font-weight: bold; }
}
</style>

<script>
let standardPlaybookPreview_ = null;
let standardPlaybookRequest_ = 0;
let standardPlaybookModal_ = null;
let standardPlaybookTitle_ = '';


function clearStandardPlaybookPreview_() {
  standardPlaybookRequest_ += 1;
  standardPlaybookPreview_ = null;
  document.getElementById('standardPlaybookPrint').disabled = true;
  document.getElementById('standardPlaybookPrepare').disabled = false;
  document.getElementById('standardPlaybookFeedback').textContent = '';
  document.getElementById('standardPlaybookSummary').replaceChildren();
  document.getElementById('standardPlaybookWarnings').replaceChildren();
}

function openStandardPlaybook_() {
  const options = appBootstrap?.standardPlaybookSections || [];
  if (!options.length) return;
  const node = document.getElementById('standardPlaybookModal');
  if (!standardPlaybookModal_) {
    standardPlaybookModal_ = new bootstrap.Modal(node);
    node.addEventListener('hide.bs.modal', clearStandardPlaybookPreview_);
  }
  clearStandardPlaybookPreview_();
  document.getElementById('standardPlaybookSections').innerHTML = options.map(option => `
    <div class="col"><label class="d-flex gap-2 align-items-center border rounded py-2 px-3">
      <input type="checkbox" class="form-check-input mt-0" value="${escapeAttribute(option.key)}"
             onchange="clearStandardPlaybookPreview_()" checked>
      <span>${escapeHtml(option.label)}</span>
    </label></div>`).join('');
  standardPlaybookModal_.show();
}

async function loadSelectedPlaybookSections_(keys, request) {
  const slots = new Array(keys.length);
  const labels = new Map((appBootstrap?.standardPlaybookSections || []).map(option => [option.key, option.label]));
  let next = 0;
  async function worker() {
    while (request === standardPlaybookRequest_ && next < keys.length) {
      const index = next++;
      const key = keys[index];
      try {
        slots[index] = await scriptRunPromise_('playbook: ' + key,
          runner => runner.appGetStandardPlaybook([key]));
      } catch (error) {
        slots[index] = { exclusions: [{ key, label: labels.get(key), reason: 'failed' }] };
      }
    }
  }
  // A slow or rejected RPC must not discard successful sibling sections.
  await Promise.all(Array.from({ length: Math.min(3, keys.length) }, worker));
  const replies = slots.filter(Boolean);
  const metadata = replies.find(reply => reply.generatedLabel) || {};
  return {
    title: metadata.title, generatedLabel: metadata.generatedLabel,
    sections: replies.flatMap(reply => reply.sections || []),
    exclusions: replies.flatMap(reply => reply.exclusions || []),
    unavailableCount: replies.reduce((sum, reply) => sum + (reply.unavailableCount || 0), 0)
  };
}

function playbookExclusionMessages_(data) {
  const messages = [];
  let unavailable = data.unavailableCount || 0;
  (data.exclusions || []).forEach(item => {
    if (item.reason === 'unavailable') unavailable++;
    else if (item.reason === 'empty') messages.push(item.label + ' did not have any data to show.');
    else if (item.reason === 'no-eligible-fields') messages.push(item.label + ' had no fields eligible for your access.');
    else messages.push((item.label || 'A selected section') + ' could not be loaded and was excluded.');
  });
  if (unavailable) messages.push(unavailable === 1
    ? 'One selected section was unavailable or not permitted.'
    : unavailable + ' selected sections were unavailable or not permitted.');
  return messages;
}

function showPlaybookExclusions_(data) {
  const warnings = document.getElementById('standardPlaybookWarnings');
  warnings.replaceChildren();
  const messages = playbookExclusionMessages_(data);
  if (!messages.length) return;
  const list = document.createElement('ul');
  list.className = 'alert alert-warning mb-0 py-2 ps-4';
  messages.forEach(message => {
    const item = document.createElement('li');
    item.textContent = message;
    list.appendChild(item);
  });
  warnings.appendChild(list);
}

async function prepareStandardPlaybook_() {
  clearStandardPlaybookPreview_();
  const request = standardPlaybookRequest_;
  const button = document.getElementById('standardPlaybookPrepare');
  const feedback = document.getElementById('standardPlaybookFeedback');
  const keys = [...document.querySelectorAll('#standardPlaybookSections input:checked')].map(item => item.value);
  if (!keys.length) {
    feedback.textContent = 'Select at least one section.';
    return;
  }
  button.disabled = true;
  feedback.textContent = 'Checking section access and preparing the Playbook…';
  try {
    const data = await loadSelectedPlaybookSections_(keys, request);
    if (request !== standardPlaybookRequest_) return;
    showPlaybookExclusions_(data);
    if (!data.sections.length) {
      feedback.textContent = 'Nothing eligible to print for this selection.';
      return;
    }
    standardPlaybookPreview_ = { keys, preparedAt: Date.now() };
    feedback.textContent = 'Ready to print. Empty or ineligible sections are omitted. In the print dialog, choose Save as PDF to keep a copy.';
    document.getElementById('standardPlaybookSummary').innerHTML = `
      <ul class="mb-0">${data.sections.map(section =>
        `<li>${escapeHtml(section.label)} (${section.rows.length} ${section.rows.length === 1 ? 'row' : 'rows'})</li>`).join('')}</ul>`;
    document.getElementById('standardPlaybookPrint').disabled = false;
  } catch (error) {
    if (request === standardPlaybookRequest_) feedback.textContent = 'The Playbook could not be prepared. Check your selections and try again.';
  } finally {
    if (request === standardPlaybookRequest_) button.disabled = false;
  }
}

async function printStandardPlaybook_() {
  if (!standardPlaybookPreview_ || Date.now() - standardPlaybookPreview_.preparedAt > 120000) {
    clearStandardPlaybookPreview_();
    document.getElementById('standardPlaybookFeedback').textContent = 'Refresh the preview to check current section access.';
    return;
  }
  const request = standardPlaybookRequest_;
  const prepared = standardPlaybookPreview_;
  const button = document.getElementById('standardPlaybookPrint');
  const feedback = document.getElementById('standardPlaybookFeedback');
  button.disabled = true;
  feedback.textContent = 'Rechecking section access before printing…';
  let data;
  try {
    data = await loadSelectedPlaybookSections_(prepared.keys, request);
    if (request !== standardPlaybookRequest_) return;
    showPlaybookExclusions_(data);
    if (!data.sections.length) {
      feedback.textContent = 'No selected sections are currently eligible. Refresh the preview to continue.';
      return;
    }
  } catch (error) {
    if (request === standardPlaybookRequest_) feedback.textContent = 'Could not verify access. Refresh the preview and try again.';
    return;
  }
  const omissions = playbookExclusionMessages_(data);
  const paper = document.getElementById('standardPlaybookPaper');
  paper.innerHTML = `
    <article class="playbook-cover">
      <p class="playbook-label">OPERATIONAL REFERENCE</p>
      <h1>${escapeHtml(data.title)}</h1>
      <p class="playbook-meta">Generated ${escapeHtml(data.generatedLabel)}</p>
      <p>Passwords, keys, tokens, and other secrets are intentionally omitted.</p>
      <h3>Contents</h3>
      <ol>${data.sections.map(section => `<li>${escapeHtml(section.label)}</li>`).join('')}</ol>
      ${omissions.length ? `<h3>Omitted sections</h3><ul>${omissions.map(message =>
        `<li>${escapeHtml(message)}</li>`).join('')}</ul>` : ''}
    </article>
    ${data.sections.map((section, index) => `
      <article>
        <div class="playbook-section-cover">
          <p class="playbook-label">SECTION ${index + 1}</p>
          <h2>${escapeHtml(section.label)}</h2>
          <p class="playbook-meta">Generated ${escapeHtml(data.generatedLabel)}</p>
        </div>
        <h3>${escapeHtml(section.label)}</h3>
        <table class="playbook-data">
          <thead><tr>${section.columns.map(column => `<th scope="col">${escapeHtml(column)}</th>`).join('')}</tr></thead>
          <tbody>${section.rows.map(row => `<tr>${row.map(cell =>
            `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </article>`).join('')}`;
  standardPlaybookTitle_ = document.title;
  document.title = data.title;
  document.body.classList.add('standard-playbook-print');
  try { window.print(); } catch (error) { cleanupStandardPlaybookPrint_(); }
}

function cleanupStandardPlaybookPrint_() {
  if (!document.body.classList.contains('standard-playbook-print')) return;
  document.body.classList.remove('standard-playbook-print');
  document.getElementById('standardPlaybookPaper').replaceChildren();
  document.title = standardPlaybookTitle_;
  clearStandardPlaybookPreview_();
}
window.addEventListener('afterprint', cleanupStandardPlaybookPrint_);
</script>
