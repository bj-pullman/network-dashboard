<script>

function renderUsersPage(data) {

  currentPageData =
    data;

  setPageHeader(
    'Users & Permissions',
    'Control access to Network Dashboard'
  );

  document.getElementById('pageActions').innerHTML = `

    <button
      class="btn btn-sm btn-brand"
      onclick="openUserEditor()"
    >
      <i class="fa-solid fa-user-plus me-2"></i>
      Add User
    </button>

    <button
      class="btn btn-sm btn-light border"
      onclick="refreshCurrentPage(this)"
    >
      <i class="fa-solid fa-rotate me-2"></i>
      Refresh
    </button>
  `;


  const breakglass =
    data.breakglass || [];


  const domainPolicy =
    data.domainPolicy || {};

  const userColumns =
    getUserTableColumns_();

  const visibleUserColumns =
    userColumns.filter(column =>
      column.visible
    );


  document.getElementById('pageContent').innerHTML = `

    <div class="app-card user-access-note mb-4">

      <div class="fw-bold mb-1">
        <i class="fa-solid fa-shield-halved me-2"></i>
        Break-glass Administrators
      </div>

      <div class="small">
        ${
          breakglass.length
            ? breakglass.map(escapeHtml).join(', ')
            : 'No break-glass administrators are currently configured.'
        }
      </div>

      <div class="small text-muted mt-2">
        Break-glass access provides emergency administrative access independent
        of normal page permissions. This is not an error.
      </div>

    </div>


    <div
      class="alert mb-4"
      style="
        background:#eef4fb;
        border:1px solid #cbd9ea;
        color:#284766;
      "
    >

      <div class="fw-bold mb-1">
        <i class="fa-solid fa-envelope-circle-check me-2"></i>
        User Domain Policy
      </div>

      <div class="small">
        ${
          domainPolicy.restrictionEnabled
            ? 'New users must belong to @' + escapeHtml(domainPolicy.allowedDomain || 'not configured') + '.'
            : 'Domain restriction is disabled. Any valid email address may be added.'
        }
      </div>

    </div>


    <div class="app-card">

      <div class="card-header-clean">

        <h2 class="card-title-clean">
          Authorized Users
        </h2>

        <div class="user-table-controls">

          <span class="record-count">
            ${data.users.length} configured
          </span>

          <div class="dropdown">
            <button
              type="button"
              class="btn btn-sm btn-light border dropdown-toggle"
              data-bs-toggle="dropdown"
            >
              <i class="fa-solid fa-table-columns me-2"></i>
              Columns
            </button>
            <div
              id="userColumnMenu"
              class="dropdown-menu table-column-menu p-2 shadow"
            ></div>
          </div>

        </div>

      </div>


      <div class="table-responsive">

        <table class="table table-hover align-middle mb-0">

          <thead>
            <tr>
              ${visibleUserColumns.map(column => `
                <th>${escapeHtml(column.title)}</th>
              `).join('')}
              <th class="text-end">Actions</th>
            </tr>
          </thead>

          <tbody>

            ${
              data.users.length
                ? data.users.map(user => `

                  <tr>

                    ${visibleUserColumns.map(column =>
                      renderUserTableCell_(
                        column.field,
                        user
                      )
                    ).join('')}

                    <td class="text-end">

                      <button
                        class="btn btn-sm btn-light border"
                        onclick='openUserEditor(${safeJson(user)})'
                      >
                        <i class="fa-solid fa-pen"></i>
                      </button>

                      <button
                        class="btn btn-sm btn-light border text-danger"
                        onclick='removeAppUser(${JSON.stringify(user.email)}, this)'
                      >
                        <i class="fa-solid fa-trash"></i>
                      </button>

                    </td>

                  </tr>

                `).join('')

                : `
                  <tr>
                    <td
                      colspan="${visibleUserColumns.length + 1}"
                      class="text-center text-muted py-5"
                    >
                      No additional users configured.
                    </td>
                  </tr>
                `
            }

          </tbody>

        </table>

      </div>

    </div>
  `;

  buildUserColumnMenu_(
    userColumns
  );
}


function getUserTableFields_() {

  return [
    'Name',
    'Email',
    'Status',
    'Role',
    'Default Access'
  ];
}


function getUserDefaultColumns_() {

  return [
    'Name',
    'Email',
    'Status',
    'Role'
  ];
}


function getUserRequiredColumns_() {

  return {
    Email: true
  };
}


function getUserTableColumns_() {

  const defaults =
    new Set(
      getUserDefaultColumns_()
    );

  const preferences =
    reconcileColumnVisibilityPreferences_(
      'users',
      getUserTableFields_()
    );

  const requiredColumns =
    getUserRequiredColumns_();

  const titleByField = {
    Name: 'Name',
    Email: 'Email',
    Status: 'Status',
    Role: 'Role',
    'Default Access': 'Default Access'
  };

  return getUserTableFields_()
    .map(field => ({
      field:
        field,
      title:
        titleByField[field] || field,
      visible:
        isTableColumnVisibleByPreference_(
          field,
          defaults,
          preferences,
          requiredColumns
        )
    }));
}


function renderUserTableCell_(
  field,
  user
) {

  if (field === 'Name') {
    return `
      <td class="fw-semibold">
        ${escapeHtml(user.name || '-')}
      </td>
    `;
  }

  if (field === 'Email') {
    return `
      <td>
        ${escapeHtml(user.email)}
      </td>
    `;
  }

  if (field === 'Status') {
    return `
      <td>
        ${
          user.active
            ? statusPill('Active')
            : statusPill('Inactive')
        }
      </td>
    `;
  }

  if (field === 'Role') {
    return `
      <td>
        ${rolePill(user.role)}
      </td>
    `;
  }

  if (field === 'Default Access') {
    return `
      <td>
        ${permissionPill(user.defaultPermission)}
      </td>
    `;
  }

  return '<td></td>';
}


function buildUserColumnMenu_(
  columns
) {

  const menu =
    document.getElementById(
      'userColumnMenu'
    );

  if (!menu) {
    return;
  }

  menu.innerHTML =
    '';

  const controls =
    document.createElement(
      'div'
    );

  controls.className =
    'column-menu-controls';

  const selectAll =
    document.createElement(
      'button'
    );

  selectAll.type =
    'button';
  selectAll.className =
    'btn btn-sm btn-light border';
  selectAll.textContent =
    'Select All';

  const clearAll =
    document.createElement(
      'button'
    );

  clearAll.type =
    'button';
  clearAll.className =
    'btn btn-sm btn-light border';
  clearAll.textContent =
    'Clear All';

  controls.appendChild(
    selectAll
  );

  controls.appendChild(
    clearAll
  );

  menu.appendChild(
    controls
  );

  const defaults =
    new Set(
      getUserDefaultColumns_()
    );

  const requiredColumns =
    getUserRequiredColumns_();

  selectAll.addEventListener(
    'click',
    function(event) {
      event.stopPropagation();
      setAllUserColumnsVisible_(
        columns,
        true,
        defaults,
        requiredColumns
      );
    }
  );

  clearAll.addEventListener(
    'click',
    function(event) {
      event.stopPropagation();
      setAllUserColumnsVisible_(
        columns,
        false,
        defaults,
        requiredColumns
      );
    }
  );

  columns.forEach(column => {

    const wrapper =
      document.createElement(
        'label'
      );

    wrapper.className =
      'dropdown-item d-flex align-items-center gap-2';

    wrapper.addEventListener(
      'click',
      function(event) {
        event.stopPropagation();
      }
    );

    const checkbox =
      document.createElement(
        'input'
      );

    checkbox.type =
      'checkbox';
    checkbox.className =
      'form-check-input m-0';
    checkbox.checked =
      !!column.visible;
    checkbox.disabled =
      !!requiredColumns[column.field];

    checkbox.addEventListener(
      'change',
      function(event) {
        event.stopPropagation();

        persistColumnVisibilityPreference_(
          'users',
          column.field,
          this.checked,
          defaults
        );

        renderUsersPage(
          currentPageData
        );
      }
    );

    const text =
      document.createElement(
        'span'
      );

    text.textContent =
      requiredColumns[column.field]
        ? column.title + ' (required)'
        : column.title;

    wrapper.appendChild(
      checkbox
    );

    wrapper.appendChild(
      text
    );

    menu.appendChild(
      wrapper
    );
  });
}


function setAllUserColumnsVisible_(
  columns,
  visible,
  defaults,
  requiredColumns
) {

  const preferences = {
    hidden: [],
    visible: []
  };

  columns.forEach(column => {

    if (requiredColumns[column.field]) {
      return;
    }

    if (visible) {
      if (!defaults.has(column.field)) {
        preferences.visible.push(
          column.field
        );
      }
    } else {
      preferences.hidden.push(
        column.field
      );
    }

  });

  setColumnVisibilityPreferences_(
    'users',
    preferences
  );

  renderUsersPage(
    currentPageData
  );
}


function rolePill(role) {

  if (role === 'admin') {
    return `
      <span class="status-pill status-success">
        Admin
      </span>
    `;
  }

  return `
    <span class="status-pill status-neutral">
      User
    </span>
  `;
}


function permissionPill(permission) {

  if (permission === 'edit') {
    return `
      <span class="status-pill status-success">
        Edit
      </span>
    `;
  }

  if (permission === 'view') {
    return `
      <span class="status-pill status-info">
        View
      </span>
    `;
  }

  return `
    <span class="status-pill status-neutral">
      None
    </span>
  `;
}


function openUserEditor(user) {

  user = user || {
    email: '',
    name: '',
    active: true,
    role: 'user',
    defaultPermission: 'view',
    permissions: {}
  };

  const data =
    currentPageData;

  const pages =
    data.pages || [];

  const roleOptions =
    getUserControlledOptions_(
      'Role',
      ['user', 'admin']
    );

  const permissionOptions =
    getUserControlledOptions_(
      'Default Permission',
      ['view', 'edit', 'none']
    );


  document.getElementById('recordModalTitle')
    .textContent =
      user.email
        ? 'Edit User'
        : 'Add User';


  document.getElementById('recordModalBody')
    .innerHTML = `

      <div class="form-required-note">
        <span class="required-marker">*</span> Required
      </div>

      <div class="row g-3">

        <div class="col-md-6">

          <label class="form-label">
            NAME
          </label>

          <input
            id="userName"
            class="form-control"
            value="${escapeAttribute(user.name || '')}"
          >

        </div>


        <div class="col-md-6">

          <label class="form-label">
            GOOGLE WORKSPACE EMAIL <span class="required-marker">*</span>
          </label>

          <input
            id="userEmail"
            type="email"
            class="form-control"
            value="${escapeAttribute(user.email || '')}"
            ${user.email ? 'readonly' : ''}
            required
            aria-required="true"
          >

        </div>


        <div class="col-md-6">

          <label class="form-label">
            ROLE
          </label>

          <select
            id="userRole"
            class="form-select"
          >
            ${userOptionList_(
              roleOptions,
              user.role || 'user'
            )}
          </select>

        </div>


        <div class="col-md-6">

          <label class="form-label">
            DEFAULT PERMISSION
          </label>

          <select
            id="userDefaultPermission"
            class="form-select"
          >
            ${userOptionList_(
              permissionOptions,
              user.defaultPermission || 'view'
            )}
          </select>

        </div>


        <div class="col-md-6">

          <label class="form-label">
            STATUS
          </label>

          <select
            id="userActive"
            class="form-select"
          >
            <option
              value="true"
              ${user.active ? 'selected' : ''}
            >
              Active
            </option>

            <option
              value="false"
              ${!user.active ? 'selected' : ''}
            >
              Disabled
            </option>
          </select>

        </div>

      </div>


      <hr class="my-4">


      <div class="mb-2 fw-bold">
        Page Overrides
      </div>

      <div class="text-muted small mb-3">
        Leave a page on Default to inherit the user's default permission.
      </div>


      <div class="row g-2">

        ${pages.map(page => {

          const selected =
            user.permissions &&
            user.permissions[page.key]
              ? user.permissions[page.key]
              : '';

          return `

            <div class="col-md-6">

              <div
                class="border rounded p-2 d-flex align-items-center justify-content-between gap-3"
              >

                <span class="small fw-semibold">
                  ${escapeHtml(page.label)}
                </span>

                <select
                  class="form-select form-select-sm permission-override"
                  data-page="${escapeAttribute(page.key)}"
                  style="width:110px;"
                >
                  <option
                    value=""
                    ${selected === '' ? 'selected' : ''}
                  >
                    Default
                  </option>

                  ${userOptionList_(
                    permissionOptions,
                    selected
                  )}
                </select>

              </div>

            </div>
          `;

        }).join('')}

      </div>
    `;


  document.getElementById('saveRecordButton')
    .onclick =
      saveUserFromModal;


  recordModal.show();
}


function getUserControlledOptions_(
  field,
  fallback
) {

  const data =
    currentPageData || {};

  const options =
    data.controlledOptions &&
    data.controlledOptions[field];

  return Array.isArray(options) &&
    options.length
    ? options
    : fallback;
}


function userOptionList_(
  options,
  selected
) {

  const value =
    String(selected || '');

  return (
    options || []
  ).map(option => {

    const text =
      String(option);

    return `
      <option
        value="${escapeAttribute(text)}"
        ${text === value ? 'selected' : ''}
      >
        ${escapeHtml(
          text.charAt(0).toUpperCase() +
          text.slice(1)
        )}
      </option>
    `;

  }).join('');
}


function saveUserFromModal() {

  const permissions = {};

  document
    .querySelectorAll('.permission-override')
    .forEach(select => {

      if (select.value) {
        permissions[
          select.dataset.page
        ] = select.value;
      }

    });


  const user = {

    name:
      document
        .getElementById('userName')
        .value,

    email:
      document
        .getElementById('userEmail')
        .value,

    active:
      document
        .getElementById('userActive')
        .value === 'true',

    role:
      document
        .getElementById('userRole')
        .value,

    defaultPermission:
      document
        .getElementById('userDefaultPermission')
        .value,

    permissions:
      permissions
  };


  const saveButton =
    setActionWorking(
      document.getElementById(
        'saveRecordButton'
      ),
      'Saving...'
    );


  scriptRunPromise_(
    'saveAppUser',
    runner =>
      runner.saveAppUser(
        user
      )
  )
    .then(function() {

      setActionSuccess(
        saveButton,
        'Saved'
      );

      recordModal.hide();

      invalidateClientPage('users');

      loadPage('users', true);

      showToast(
        'User permissions saved.'
      );

    })
    .catch(function(error) {
      setActionError(
        saveButton,
        'Save Failed'
      );
      handleFailure(
        error,
        'save user'
      );
    });
}


function removeAppUser(
  email,
  button
) {

  if (
    !confirm(
      `Remove portal access for ${email}?`
    )
  ) {
    return;
  }


  const actionButton =
    setActionWorking(
      button,
      'Removing...'
    );


  scriptRunPromise_(
    'deleteAppUser',
    runner =>
      runner.deleteAppUser(
        email
      )
  )
    .then(function() {

      setActionSuccess(
        actionButton,
        'Removed'
      );

      invalidateClientPage('users');

      loadPage('users', true);

      showToast(
        'User removed.'
      );

    })
    .catch(function(error) {
      setActionError(
        actionButton,
        'Remove Failed'
      );
      handleFailure(
        error,
        'remove user'
      );
    });
}

</script>
